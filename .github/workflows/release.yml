# 按 tag 自动构建并发布二进制。
#
# 触发：
#   1. 推送形如 v<主>.<次>.<补丁>（可带 -rcN）的 tag：
#        git tag v0.4.0 && git push origin v0.4.0
#   2. 手动（Actions 页 Run workflow，或 API dispatch）：输入已存在的
#      tag 名——给"工作流本身修过、tag 不想重打"的场景用。
#
# 发布物（挂在同名 GitHub Release 上）：
#   rl-limiter-v<版本>-linux-x86_64.tar.gz(.sha256)
#
# 构建刻意放在 manylinux2014 容器（glibc 2.17）里：PyInstaller 产物
# 要求目标机 glibc ≥ 构建机，这样 CentOS 7 / RHEL 7 及之后的发行版
# 都能跑。注意容器不能作为 job 的 container: 使用——checkout@v4 的
# node20 需要 glibc ≥ 2.28 会直接起不来（v0.4.0 首次构建踩过）；
# 因此 checkout 在宿主 runner 上做，构建用 docker run 进容器。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.4.1）。已存在：按该 tag 的代码重建；不存在：按所选分支 HEAD 构建并自动创建该 tag"
        required: true

permissions:
  contents: write   # 创建 Release 并上传产物

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      REL_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # dispatch 场景先按所选分支整库检出，下一步再决定是否切 tag。
          fetch-depth: 0

      - name: dispatch 场景：tag 已存在则切到它构建
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$REL_TAG" >/dev/null; then
            git checkout "refs/tags/$REL_TAG"
            echo "tag $REL_TAG 已存在：按该 tag 的代码重建发布"
          else
            echo "tag $REL_TAG 不存在：按当前分支 HEAD 构建，发布时由" \
                 "Release 动作在该提交上创建 tag"
          fi

      - name: 校验 tag 与 pyproject 版本一致
        run: |
          TAG="${REL_TAG#v}"
          VER=$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml)
          # 允许预发布后缀：tag v0.4.0-rc1 对应 pyproject 0.4.0。
          case "$TAG" in "$VER"|"$VER"-rc*) ;; *)
            echo "tag（$REL_TAG）与 pyproject.toml（$VER）不一致" >&2
            exit 1;;
          esac

      - name: 在 manylinux2014 容器里构建发布包
        # 容器自带的 /opt/python/* 是**静态**编译（无 libpython 共享库），
        # PyInstaller 用不了（"Python was built without a shared
        # library"，v0.4.0 第二次构建踩过）；改装 Miniconda 的 Python
        # ——共享库构建、官方兼容 glibc ≥ 2.17，与 manylinux2014 的
        # 兼容目标一致。版本钉死保证可复现。
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e VERSION="${REL_TAG#v}" \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -c 'set -e
              curl -fsSL -o /tmp/mc.sh https://repo.anaconda.com/miniconda/Miniconda3-py311_24.7.1-0-Linux-x86_64.sh
              bash /tmp/mc.sh -b -p /opt/conda >/dev/null
              PYTHON=/opt/conda/bin/python3 bash deploy/release/build.sh'

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          # -rc 预发布自动标 prerelease。
          prerelease: ${{ contains(env.REL_TAG, '-rc') }}
          generate_release_notes: true
