# docker compose 一键演示环境（LVS 分支）：**一对 keepalived 主备
# director**（每台 = LVS NAT + 同机 rl-limiter）+ 模拟业务后端 + 可调
# 并发压测 + 总控。详细玩法见 docs/05-DockerCompose演示.md。
#
#   前提：宿主机内核已加载 IPVS —— modprobe ip_vs ip_vs_rr
#        （Docker Desktop(Mac/Win) 精简内核可能没有，入口自检会直接失败）
#   启动：docker compose -f docker-compose-demo.yml up -d --build
#   控制台：http://127.0.0.1:8090（node1）/ :8092（node2）/ :8095（总控）
#   主备漂移演示：docker compose -f docker-compose-demo.yml stop node1
#        → VIP 漂到 node2，流量与限速零窗口接管（node2 的 tc 规则早已就位）
#   收场：docker compose -f docker-compose-demo.yml down
#
# 拓扑（LVS-NAT 教科书形态；两个 VIP 由 VRRP 一起漂）：
#
#   loadgen ══ frontnet 10.211.1.0/24 ══► VIP 10.211.1.100:8080
#                                           │ 当前主机（node1 主 / node2 备）
#                                           │ IPVS NAT 转发
#                                           ▼
#              backnet 10.211.2.0/24 ◄══ web 10.211.2.20:9000
#              （web 默认网关 = 后端侧 VIP 10.211.2.100——NAT 回程必经
#                当前主机，这正是回程网关也要随 VRRP 漂移的原因）
#
# 部署形态：每个 node 容器 = 生产上的一台 director：容器内同时跑
# keepalived（VRRP + 下发 virtual_server）与 rl-limiter。**主备都装
# IPVS 表、都建 tc 规则**——备机空转、漂移即生效（docs/11）。
#
# 配置来源只有两个（没有数据库）：内核 IPVS 实况表（keepalived 维护，
# rl-limiter 只读）+ rl-limiter 的 YAML（挂 deploy/docker/
# limiter-node.yaml 为模板；**默认不登记限额 = 只监控**，起来后用控制
# 台/写 API 给 vs_10.211.1.100_8080 设限额观察限速）。

services:
  # ---- 模拟业务后端：随机大小响应。默认网关指向后端侧 VIP——
  # NAT 回程必须经当前主 director，这条路由是 LVS-NAT 的结构性要求。----
  web:
    build: .
    command: >-
      bash -c "ip route replace default via 10.211.2.100
      && exec python3 tools/random_web.py --port 9000"
    cap_add:
      - NET_ADMIN                # 改默认路由用
    sysctls:
      net.core.somaxconn: 65536
      net.ipv4.tcp_max_syn_backlog: 65536
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.tcp_max_tw_buckets: 2097152
    environment:
      WEB_MIN_BYTES: ${WEB_MIN_BYTES:-4096}
      WEB_MAX_BYTES: ${WEB_MAX_BYTES:-262144}
      WEB_BIG_BYTES: ${WEB_BIG_BYTES:-536870912}
      WEB_PROCS: ${WEB_PROCS:-0}
    networks:
      backnet:
        ipv4_address: 10.211.2.20
    restart: unless-stopped

  # ---- 主备 director（keepalived VRRP）。两台配置只差 STATE/PRIORITY，
  # rl-limiter 的 YAML 模板同一份——主备对称是刻意的设计。 ----
  node1: &director
    build: .
    cap_add:
      - NET_ADMIN                # tc 限速 + VRRP + 改 sysctl
    volumes:
      - ./deploy/docker/limiter-node.yaml:/etc/rl-limiter/config-template.yaml:ro
      - ./deploy/docker/keepalived-node.conf:/etc/rl-limiter/keepalived-template.conf:ro
    environment: &director-env
      # 按网段定位两张网卡（容器内网卡名不可靠）：客户端侧 = 出向 HTB
      # 的限速网卡；后端侧给 keepalived 的回程 VIP 用。
      RL_FRONT_SUBNET: "10.211.1."
      RL_BACK_SUBNET: "10.211.2."
      # LVS NAT 主路径是出向 HTB 直接限速；入向闭环（ifb）是可选能力，
      # demo 不开，免得对宿主机内核多一个 ifb 模块要求。
      RL_TC_IN_IFACE: "-"
      KEEPALIVED_STATE: MASTER
      KEEPALIVED_PRIORITY: "150"
      RL_CONSOLE_PORT: "8090"
      RL_CONSOLE_BIND: 0.0.0.0   # 演示从宿主机打开；宿主机侧只映射回环
      RL_API_TOKEN: demo-token
      RL_METRICS_LOG: /var/log/rl-limiter/metrics.jsonl
    networks:
      frontnet:
        ipv4_address: 10.211.1.11
      backnet:
        ipv4_address: 10.211.2.11
    ports:
      - "127.0.0.1:8090:8090"    # node1 控制台
    depends_on:
      - web
    restart: unless-stopped

  node2:
    <<: *director
    environment:
      <<: *director-env
      KEEPALIVED_STATE: BACKUP
      KEEPALIVED_PRIORITY: "100"
    networks:
      frontnet:
        ipv4_address: 10.211.1.12
      backnet:
        ipv4_address: 10.211.2.12
    ports:
      - "127.0.0.1:8092:8090"    # node2 控制台

  # ---- 压测：打 VIP（不是某台 director 的实址——这正是主备演示的
  # 关键：stop node1 后流量自动跟着 VIP 走到 node2）。 ----
  loadgen:
    build: .
    command: >-
      python3 tools/loadgen.py
      --target http://10.211.1.100:8080/
      --control-port 8081
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: 1024 65535
      net.ipv4.tcp_max_tw_buckets: 2097152
    environment:
      LOADGEN_CONCURRENCY: ${LOADGEN_CONCURRENCY:-200}
      LOADGEN_PER_REQ_KBS: ${LOADGEN_PER_REQ_KBS:-100}
      LOADGEN_PROCS: ${LOADGEN_PROCS:-0}
    ports:
      - "8084:8081"   # 控制端口：GET /status、PUT /concurrency、PUT /big
    depends_on:
      - node1
      - node2
    networks: [frontnet]
    restart: unless-stopped

  # ---- 总控（rl-fleet）：登记主备两台。按需分配天然适配主备不对称
  # 流量（备机需求≈0 只占保底，漂移后配额跟着需求走）。 ----
  fleet:
    build: .
    command: >-
      bash -c "cp /etc/rl-limiter/fleet-template.yaml /etc/rl-limiter/fleet.yaml
      && exec rl-fleet -c /etc/rl-limiter/fleet.yaml"
    volumes:
      - ./deploy/docker/fleet.yaml:/etc/rl-limiter/fleet-template.yaml:ro
    environment:
      RL_CONSOLE_PORT: "8095"
      RL_CONSOLE_BIND: 0.0.0.0
      RL_API_TOKEN: demo-token
    ports:
      - "127.0.0.1:8095:8095"
    depends_on:
      - node1
      - node2
    networks: [backnet]
    restart: unless-stopped

# 双网络 = LVS-NAT 的标准双网卡形态：frontnet 客户端侧（VIP、出向
# HTB 限速都在这侧），backnet 后端侧（NAT 到 RS 的流量与回程）。
# 网段固定：入口脚本按前缀定位网卡，keepalived 模板里的 VIP/RS 地址
# 也写死在这两个段里。
networks:
  frontnet:
    ipam:
      config:
        - subnet: 10.211.1.0/24
          gateway: 10.211.1.1
  backnet:
    ipam:
      config:
        - subnet: 10.211.2.0/24
          gateway: 10.211.2.1
