# docker compose 一键演示环境：三台 **Ubuntu 24.04 节点**（每台 =
# HAProxy + 同机 rl-limiter）+ 模拟业务后端 + 可调并发压测服务。
# 详细玩法见 docs/04-DockerCompose演示.md。
#
#   启动：docker compose -f docker-compose-demo.yml up -d --build
#   控制台：http://localhost:8090 / :8092 / :8093（每台节点各一个）
#   观察：docker compose -f docker-compose-demo.yml logs -f node1 loadgen
#   调并发：curl -X PUT http://localhost:8084/concurrency -d '{"concurrency": 32}'
#   长连接大文件下载：curl -X PUT http://localhost:8084/big -d '{"per_target": 2}'
#   收场：docker compose -f docker-compose-demo.yml down
#
# 部署形态：**rl-limiter 与 HAProxy 同机**。每个 node 容器 = 生产上的
# 一台 ECS：容器内同时跑 haproxy 与 rl-limiter，rl-limiter 通过本机
# unix socket（/run/haproxy/admin.sock）只采本机那台 HAProxy——stats
# socket 不占任何网络端口，容器之间也无需互相可达。
#
# 配置来源只有两个本地文件（没有数据库）：
#   - haproxy.cfg（挂 deploy/docker/haproxy-base.cfg 为模板）——负载
#     均衡配置的**唯一权威**：监听端口、模式、后端服务器都写在这里，
#     改完 reload HAProxy 即生效，rl-limiter 只读它解析受管清单；
#   - rl-limiter 的 YAML（挂 deploy/docker/limiter-node.yaml 为模板）——
#     stats socket 接线 + quotas 限额登记（fe_main: 40 Mbps）。
# 两份文件的内容都被 rl-limiter 轮询（5s），改了即热生效。
#
# 拓扑（三台 TCP L4 节点，各自独立）：
#   loadgen ==打散==> node1:8080、node2:8080、node3:8080（各自 fe_main）
#                          └──> web:9000（随机大小响应）
#   node{1,2,3} 内的 rl-limiter ──show stat──> 本机 unix socket（不出容器）
#   node{1,2,3} 内的 rl-limiter ──轮询──> 本机 haproxy.cfg + YAML（热更新）
# 限速由各台机器的内核 tc（各 40 Mbps）在本机执行。每个控制台只展示
# 本机那台 HAProxy（只读监控；改配置 = 进容器改那两份文件）。

services:
  # ---- HAProxy 后端：模拟业务 web 服务（每次请求返回随机大小响应）----
  web:
    build: .
    command: python3 tools/random_web.py --port 9000
    environment:
      # 响应体大小区间（字节）：默认 256 KiB ~ 2 MiB，可按需覆盖。
      WEB_MIN_BYTES: ${WEB_MIN_BYTES:-262144}
      WEB_MAX_BYTES: ${WEB_MAX_BYTES:-2097152}
      # /big 大文件下载端点的默认大小：512 MiB（40 Mbps 限速下约 100s
      # 下完），供长连接大文件场景（loadgen 的 big worker）使用。
      WEB_BIG_BYTES: ${WEB_BIG_BYTES:-536870912}
    restart: unless-stopped

  # ---- 三台节点：Ubuntu 24.04 + HAProxy 2.8(发行版自带) + 同机 rl-limiter。
  # 每个容器 = 生产上的一台 ECS，各管各的。挂进去的 haproxy-base.cfg 是
  # **完整的** haproxy.cfg（含 fe_main 监听端口与后端），limiter-node.yaml
  # 登记限额。stats socket 是容器内的 unix socket，不映射也无需互通。
  node1:
    build:
      context: .
    # 限速由内核 tc 执行，容器默认没有操作网络设备的权限，必须显式给。
    # 少了它 rl-limiter 一启动就会因为 tc 权限不足而退出（入口脚本会
    # 明确报出来，不会静默地"没在限速"）。
    cap_add:
      - NET_ADMIN
    # FD 需求 = maxconn × 2 + maxpipes × 2 + 34（管道那一项是 splice 用的，
    # 本项目开着 splice）。给不够 HAProxy **拒绝启动**；入口脚本会在启动前
    # 按 cfg 里的实际值预检一遍并直接报出该改成多少，不必去 ALERT 里翻。
    #
    # 这里用的是**演示量级**：haproxy-base.cfg 的默认值是 100 万连接
    # （= 400 万 fd），而宿主机 `fs.nr_open` 默认只有 1048576、且**容器里
    # 改不动**，开发机上直接起不来。所以演示用下面的 HAPROXY_MAXCONN /
    # HAPROXY_MAXPIPES 降到 10 万（= 400034 fd）——降的是演示，模板本身
    # 仍然是那份可以直接抄去生产的骨架。生产机器请按 docs/08 把
    # fs.nr_open 抬上去，然后不设这两个变量、直接用模板默认值。
    #
    # 内核参数（somaxconn、conntrack 等）由入口脚本的 tune-kernel.sh 处理，
    # 不走 compose 的 sysctls: —— 原因见 docs/08-内核参数调优.md §2。
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    volumes:
      - ./deploy/docker/haproxy-base.cfg:/etc/rl-limiter/haproxy-template.cfg:ro
      - ./deploy/docker/limiter-node.yaml:/etc/rl-limiter/config-template.yaml:ro
    environment:
      # 演示量级：把模板里 100 万连接的默认值降到 10 万，见上面 ulimits 注释。
      HAPROXY_MAXCONN: "100000"
      HAPROXY_MAXPIPES: "100000"
      RL_CONSOLE_PORT: "8090"
      # 监控数据落盘（分钟粒度 JSONL，按天轮转；容器形态下随容器生命周期，
      # 要长期保留可把 /var/log/rl-limiter 挂成宿主机卷）。
      RL_METRICS_LOG: /var/log/rl-limiter/metrics.jsonl
      # 演示需要从宿主机打开控制台，故绑 0.0.0.0；宿主机侧只映射到回环
      # （下方 ports）。生产默认是 127.0.0.1，控制台无鉴权，切勿裸奔。
      RL_CONSOLE_BIND: 0.0.0.0
      # 写 API（页面/API 改限额）的演示令牌。生产上请生成随机值
      # （openssl rand -hex 24），不设则写接口整体 403、页面只读。
      RL_API_TOKEN: demo-token
    ports:
      - "8080:8080"              # hap-1 / fe_main（宿主机可 curl 体验限速）
      - "127.0.0.1:8090:8090"    # hap-1 的控制台
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  node2:
    build:
      context: .
    # 限速由内核 tc 执行，容器默认没有操作网络设备的权限，必须显式给。
    # 少了它 rl-limiter 一启动就会因为 tc 权限不足而退出（入口脚本会
    # 明确报出来，不会静默地"没在限速"）。
    cap_add:
      - NET_ADMIN
    # FD 需求 = maxconn × 2 + maxpipes × 2 + 34（管道那一项是 splice 用的，
    # 本项目开着 splice）。给不够 HAProxy **拒绝启动**；入口脚本会在启动前
    # 按 cfg 里的实际值预检一遍并直接报出该改成多少，不必去 ALERT 里翻。
    #
    # 这里用的是**演示量级**：haproxy-base.cfg 的默认值是 100 万连接
    # （= 400 万 fd），而宿主机 `fs.nr_open` 默认只有 1048576、且**容器里
    # 改不动**，开发机上直接起不来。所以演示用下面的 HAPROXY_MAXCONN /
    # HAPROXY_MAXPIPES 降到 10 万（= 400034 fd）——降的是演示，模板本身
    # 仍然是那份可以直接抄去生产的骨架。生产机器请按 docs/08 把
    # fs.nr_open 抬上去，然后不设这两个变量、直接用模板默认值。
    #
    # 内核参数（somaxconn、conntrack 等）由入口脚本的 tune-kernel.sh 处理，
    # 不走 compose 的 sysctls: —— 原因见 docs/08-内核参数调优.md §2。
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    volumes:
      - ./deploy/docker/haproxy-base.cfg:/etc/rl-limiter/haproxy-template.cfg:ro
      - ./deploy/docker/limiter-node.yaml:/etc/rl-limiter/config-template.yaml:ro
    environment:
      # 演示量级：把模板里 100 万连接的默认值降到 10 万，见上面 ulimits 注释。
      HAPROXY_MAXCONN: "100000"
      HAPROXY_MAXPIPES: "100000"
      RL_CONSOLE_PORT: "8090"
      # 监控数据落盘（分钟粒度 JSONL，按天轮转；容器形态下随容器生命周期，
      # 要长期保留可把 /var/log/rl-limiter 挂成宿主机卷）。
      RL_METRICS_LOG: /var/log/rl-limiter/metrics.jsonl
      RL_CONSOLE_BIND: 0.0.0.0
      # 写 API（页面/API 改限额）的演示令牌。生产上请生成随机值
      # （openssl rand -hex 24），不设则写接口整体 403、页面只读。
      RL_API_TOKEN: demo-token
    ports:
      - "8082:8080"              # hap-2 / fe_main
      - "127.0.0.1:8092:8090"    # hap-2 的控制台
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  node3:
    build:
      context: .
    # 限速由内核 tc 执行，容器默认没有操作网络设备的权限，必须显式给。
    # 少了它 rl-limiter 一启动就会因为 tc 权限不足而退出（入口脚本会
    # 明确报出来，不会静默地"没在限速"）。
    cap_add:
      - NET_ADMIN
    # FD 需求 = maxconn × 2 + maxpipes × 2 + 34（管道那一项是 splice 用的，
    # 本项目开着 splice）。给不够 HAProxy **拒绝启动**；入口脚本会在启动前
    # 按 cfg 里的实际值预检一遍并直接报出该改成多少，不必去 ALERT 里翻。
    #
    # 这里用的是**演示量级**：haproxy-base.cfg 的默认值是 100 万连接
    # （= 400 万 fd），而宿主机 `fs.nr_open` 默认只有 1048576、且**容器里
    # 改不动**，开发机上直接起不来。所以演示用下面的 HAPROXY_MAXCONN /
    # HAPROXY_MAXPIPES 降到 10 万（= 400034 fd）——降的是演示，模板本身
    # 仍然是那份可以直接抄去生产的骨架。生产机器请按 docs/08 把
    # fs.nr_open 抬上去，然后不设这两个变量、直接用模板默认值。
    #
    # 内核参数（somaxconn、conntrack 等）由入口脚本的 tune-kernel.sh 处理，
    # 不走 compose 的 sysctls: —— 原因见 docs/08-内核参数调优.md §2。
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    volumes:
      - ./deploy/docker/haproxy-base.cfg:/etc/rl-limiter/haproxy-template.cfg:ro
      - ./deploy/docker/limiter-node.yaml:/etc/rl-limiter/config-template.yaml:ro
    environment:
      # 演示量级：把模板里 100 万连接的默认值降到 10 万，见上面 ulimits 注释。
      HAPROXY_MAXCONN: "100000"
      HAPROXY_MAXPIPES: "100000"
      RL_CONSOLE_PORT: "8090"
      # 监控数据落盘（分钟粒度 JSONL，按天轮转；容器形态下随容器生命周期，
      # 要长期保留可把 /var/log/rl-limiter 挂成宿主机卷）。
      RL_METRICS_LOG: /var/log/rl-limiter/metrics.jsonl
      RL_CONSOLE_BIND: 0.0.0.0
      # 写 API（页面/API 改限额）的演示令牌。生产上请生成随机值
      # （openssl rand -hex 24），不设则写接口整体 403、页面只读。
      RL_API_TOKEN: demo-token
    ports:
      - "8083:8080"              # hap-3 / fe_main
      - "127.0.0.1:8093:8090"    # hap-3 的控制台
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  # ---- 客户端群：可在线调节并发数的压测服务（模拟并发带宽）----
  loadgen:
    build: .
    # 三个入口各是一台独立节点：worker 轮转绑定入口，每台节点各自被
    # 本机 tc 压在自己的限额内、互不影响。
    command: >-
      python3 tools/loadgen.py
      --target http://node1:8080/,http://node2:8080/,http://node3:8080/
      --control-port 8081
    environment:
      # 初始并发：LOADGEN_CONCURRENCY=32 docker compose up -d 即可改；
      # 运行中用控制端口在线调节（见文件头速查）。
      LOADGEN_CONCURRENCY: ${LOADGEN_CONCURRENCY:-1000}
      # 长连接大文件下载场景：每个入口 N 条长连接循环下载 /big（默认
      # 每入口 1 条）。验证 tc 对存量长连接的持续限速与限额
      # 调整（reload + hard-stop）对在途下载的影响。
      LOADGEN_BIG_PER_TARGET: ${LOADGEN_BIG_PER_TARGET:-1}
    ports:
      - "8084:8081"   # 控制端口（宿主机 8084）：GET /status、PUT /concurrency
    depends_on:
      - node1
      - node2
      - node3
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 10.211.0.0/24
          gateway: 10.211.0.1