  # ---- 客户端群：可在线调节并发数的压测服务（模拟并发带宽）----
  loadgen:
    build: .
    # 三个入口各是一台独立节点：worker 轮转绑定入口，每台节点各自被
    # 本机 tc 压在自己的限额内、互不影响。
    command: >-
      python3 tools/loadgen.py
      --target http://node1:8080/,http://node2:8080/,http://node3:8080/
      --control-port 8081
    # 并发上限是 10240（loadgen.py 的 MAX_CONCURRENCY），每个 worker 一条
    # 连接 ≈ 一个 fd：nofile 要盖过上限并留出控制端口/日志等的余量，
    # 否则并发拉高时 worker 建连报 EMFILE。
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    # 短连接场景 loadgen 是 TIME_WAIT/临时端口压力最大的一侧（客户端先
    # 关，TIME_WAIT 全在它这边：实测 5000 并发挂 4 万个）。默认端口区间
    # 每目标仅 ~2.8 万个、tw_reuse=2 仅回环生效——满速时临时端口耗尽，
    # 建连重试风暴会表现为**节点**的 SYN 负载。客户端侧没有 tc 按源端口
    # 分类的顾虑，端口区间可以放心下探到 1024。
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: 1024 65535
      net.ipv4.tcp_max_tw_buckets: 2097152
    environment:
      # 初始并发：LOADGEN_CONCURRENCY=32 docker compose up -d 即可改；
      # 运行中用控制端口在线调节（见文件头速查）。
      LOADGEN_CONCURRENCY: ${LOADGEN_CONCURRENCY:-1000}
      # 压测进程数：默认自动=CPU 核数（单进程 asyncio 只能吃满一个核，
      # 上万并发靠多进程分片；1 = 旧的单进程行为）。
      LOADGEN_PROCS: ${LOADGEN_PROCS:-0}
      # 每请求限读 100 KB/s（模拟终端用户的下载速度；0 = 不限）。
      # 1000 并发 × ≤100KB/s ≈ ≤800 Mbps 的聚合压力，仍远超各入口限额。
      LOADGEN_PER_REQ_KBS: ${LOADGEN_PER_REQ_KBS:-100}
      # 长连接大文件下载场景：每个入口 N 条长连接循环下载 /big（默认
      # 每入口 1 条）。验证 tc 对存量长连接的持续限速与限额
      # 调整（reload + hard-stop）对在途下载的影响。
      # 默认 0：主场景是小文件短连接。要演示长连接大文件限速再开
      # （运行中 PUT /big 也行）。
      LOADGEN_BIG_PER_TARGET: ${LOADGEN_BIG_PER_TARGET:-0}
    ports:
      - "8084:8081"   # 控制端口（宿主机 8084）：GET /status、PUT /concurrency
    depends_on:
      - node1
      - node2
      - node3
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 10.211.0.0/24
          gateway: 10.211.0.1