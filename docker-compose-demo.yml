# docker compose 演示拓扑（通用形态）：两台"服务器节点" + 压测 + 总控。
#
#   起停：make demo-up / make demo-logs / make demo-down
#   控制台：http://localhost:8090 / :8092（每台节点各一个，令牌 742ccc60283bf452954071b32d99867729047595bb9cbf29）
#   总控：http://localhost:8095（多机总量控制）
#   调并发：curl -X PUT http://localhost:8084/concurrency -d '{"concurrency": 1000}'
#   长连接大文件下载：curl -X PUT http://localhost:8084/big -d '{"per_target": 2}'
#
# 每台节点 = 一台"任意服务"的服务器：容器里跑 rl-limiter + 一个业务
# 进程示例（random_web，随机响应大小的 HTTP 服务）。**rl-limiter 不
# 知道也不关心业务进程是什么**——监控是双网卡设备视图 + 内核 TCP
# 计数器，限速是客户端侧网卡的入向 tc（闭环压出向）。把 random_web
# 换成 nginx、自研服务，一切照常工作，这正是本形态要演示的点。
#
#   loadgen ══ frontnet（客户端侧，eth-front）══► node1/node2 :8080
#   fleet  ══ backnet（后端/管理侧，eth-back）══► 节点控制台 :8090
#
# 双网络 = 每台节点双网卡：客户端流量和管理面物理分开，入向限速只落
# 在客户端侧那张卡上（入口脚本按 RL_FRONT_SUBNET 网段定位网卡名）。

x-node: &node
  build: .
  cap_add: [NET_ADMIN]           # tc 需要；不需要 privileged
  # 节点自己的 netns 参数：高并发下发行版默认值先一步成为瓶颈。
  sysctls:
    net.core.somaxconn: 65536
    net.ipv4.tcp_max_syn_backlog: 65536
    net.ipv4.tcp_tw_reuse: 1
    net.ipv4.tcp_max_tw_buckets: 2097152
    # tc 按端口分类：端口区间下界保持 32768，下探会撞监听端口。
    net.ipv4.ip_local_port_range: 32768 60999
  volumes:
    - ./deploy/docker/limiter-node.yaml:/etc/rl-limiter/config-template.yaml:ro
  restart: unless-stopped

x-node-env: &node-env
  # 业务进程示例：随机响应大小的 HTTP 服务，监听 8080。换成任何别的
  # 命令（或留空=纯监控/限速节点）演示语义不变。
  APP_CMD: >-
    python3 /app/tools/random_web.py --port 8080
  WEB_MIN_BYTES: ${WEB_MIN_BYTES:-4096}
  WEB_MAX_BYTES: ${WEB_MAX_BYTES:-262144}
  WEB_BIG_BYTES: ${WEB_BIG_BYTES:-536870912}
  WEB_PROCS: ${WEB_PROCS:-2}
  RL_CONSOLE_PORT: "8090"
  # 双网卡：按网段定位客户端侧网卡（compose 接两个网络时 eth0/eth1
  # 顺序不可靠）。入向限速与设备监控的锚点都落在客户端侧那张上。
  RL_FRONT_SUBNET: "10.211.1."
  # 闭环形态：出向不做 tc 整形（限速 = 动态收紧客户端侧入向）。
  RL_TC_IFACE: "-"
  RL_METRICS_LOG: /var/log/rl-limiter/metrics.jsonl
  RL_CONSOLE_BIND: 0.0.0.0
  # 演示专用令牌（写在公开仓库里，**绝不可用于生产**）。令牌必须过强度
  # 规则（≥32 位高强度随机串），弱令牌会被当作没有令牌、写接口禁用。
  RL_API_TOKEN: 742ccc60283bf452954071b32d99867729047595bb9cbf29

services:
  node1:
    <<: *node
    environment:
      <<: *node-env
    ports:
      - "8080:8080"              # node1 的业务端口（宿主机可直接 curl）
      - "127.0.0.1:8090:8090"    # node1 的控制台
    networks: [frontnet, backnet]

  node2:
    <<: *node
    environment:
      <<: *node-env
    ports:
      - "8082:8080"              # node2 的业务端口
      - "127.0.0.1:8092:8090"    # node2 的控制台
    networks: [frontnet, backnet]

  # ---- 压测客户端：打两台节点的业务端口（客户端侧网络）----
  loadgen:
    build: .
    command: >-
      python3 tools/loadgen.py
      --target http://node1:8080/,http://node2:8080/
      --control-port 8081
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    # 短连接场景 loadgen 是 TIME_WAIT/临时端口压力最大的一侧；客户端侧
    # 没有 tc 按源端口分类的顾虑，端口区间放心下探。
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: 1024 65535
      net.ipv4.tcp_max_tw_buckets: 2097152
    environment:
      LOADGEN_CONCURRENCY: ${LOADGEN_CONCURRENCY:-1000}
      LOADGEN_PROCS: ${LOADGEN_PROCS:-0}
      LOADGEN_PER_REQ_KBS: ${LOADGEN_PER_REQ_KBS:-100}
      LOADGEN_BIG_PER_TARGET: ${LOADGEN_BIG_PER_TARGET:-0}
    ports:
      - "8084:8081"   # 控制端口：GET /status、PUT /concurrency、PUT /big
    depends_on:
      - node1
      - node2
    networks: [frontnet]
    restart: unless-stopped

  # ---- 总控制台（rl-fleet）：汇总两台节点，把总流出带宽按需分配为
  # 各节点的实例出向目标（节点闭环再转成入向限速）。玩法：打开
  # http://localhost:8095（令牌 742ccc60283bf452954071b32d99867729047595bb9cbf29），设总带宽后加压观察两
  # 节点配额此消彼长、总出向被压在参考线下。 ----
  fleet:
    build: .
    # 模板只读挂载 + 启动时拷到可写路径：总控的写 API 要整份重写这份
    # YAML，bind-mount 的单文件 os.replace 会失败，必须先拷贝。
    command: >-
      bash -c "cp /etc/rl-limiter/fleet-template.yaml /etc/rl-limiter/fleet.yaml
      && exec rl-fleet -c /etc/rl-limiter/fleet.yaml"
    volumes:
      - ./deploy/docker/fleet.yaml:/etc/rl-limiter/fleet-template.yaml:ro
    environment:
      RL_CONSOLE_PORT: "8095"
      RL_CONSOLE_BIND: 0.0.0.0
      RL_API_TOKEN: 742ccc60283bf452954071b32d99867729047595bb9cbf29
      # 监控落盘：页面「历史回查」读它。
      RL_METRICS_LOG: /var/log/rl-limiter/fleet-metrics.jsonl
    ports:
      - "127.0.0.1:8095:8095"
    depends_on:
      - node1
      - node2
    # 管理面走后端侧网络：轮询/下发不混入客户端侧被整形的流量。
    networks: [backnet]
    restart: unless-stopped

# 双网络拓扑 = 每台节点双网卡（本形态的部署前提）：
#   frontnet 客户端侧（loadgen ↔ 节点）：入向限速与设备监控锚点在
#            节点的这张网卡上；
#   backnet  后端/管理侧（fleet ↔ 节点控制台）：管理流量物理隔开。
# 网段固定：入口脚本按 RL_FRONT_SUBNET 前缀定位客户端侧网卡名。
networks:
  frontnet:
    ipam:
      config:
        - subnet: 10.211.1.0/24
          gateway: 10.211.1.1
  backnet:
    ipam:
      config:
        - subnet: 10.211.2.0/24
          gateway: 10.211.2.1
