[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-limiter"
version = "0.6.4"
description = "服务器出口带宽限速与监控（通用形态）：双网卡 + 内核计数器监控，客户端侧网卡入向 tc 闭环限速，rl-fleet 多机总量控制"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rl-limiter = "rl_limiter.__main__:main"
rl-fleet = "rl_limiter.fleetmain:main"

[tool.setuptools]
packages = ["rl_limiter"]

[tool.setuptools.package-data]
# Web 控制台的静态页面随包分发（webconsole 按包内相对路径读取）。
rl_limiter = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
