[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-limiter"
version = "0.3.0"
description = "集中式 HAProxy 入口带宽限速服务：远程控制多台 HAProxy，保证各环境下行带宽不超约定配额"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.9",
    "aiomysql>=0.2",
    # MySQL 8+ 默认 caching_sha2_password 认证，aiomysql/PyMySQL 依赖它完成握手
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rl-limiter = "rl_limiter.__main__:main"
# 本机全网限速。与 rl-limiter 没有任何代码/配置共享，可以单独拿走。
netlimit = "netlimit.cli:main"

[tool.setuptools]
packages = ["rl_limiter", "netlimit"]

[tool.setuptools.package-data]
# Web 控制台的静态页面随包分发（webconsole 按包内相对路径读取）。
rl_limiter = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
