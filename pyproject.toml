[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-limiter"
version = "0.2.0"
description = "集中式 HAProxy 入口带宽限速服务：远程控制多台 HAProxy，保证各环境下行带宽不超约定配额"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# MySQL 配置源（v3.0）：PyMySQL 为纯 Python 驱动，docker 镜像内零编译
# 依赖。搭配 MySQL 用户使用 mysql_native_password 认证时无需 cryptography。
mysql = ["PyMySQL>=1.1"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rl-limiter = "rl_limiter.__main__:main"

[tool.setuptools]
packages = ["rl_limiter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
