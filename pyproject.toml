[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hap-agg"
version = "0.1.0"
description = "HAProxy 多实例监控聚合：经内网 TCP stats socket 批量采样 N 台 HAProxy，合并成一个视图（Web 页面 + JSON API + Prometheus /metrics）"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
hap-agg = "hap_agg.__main__:main"

[tool.setuptools]
packages = ["hap_agg"]

[tool.setuptools.package-data]
# Web 页面随包分发（web 模块按包内相对路径读取）。
hap_agg = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
