[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-limiter"
version = "0.4.0"
description = "HAProxy 入口带宽限速与监控：读本机 haproxy.cfg 与 YAML 限额，经内核 tc 限速并做秒级监控"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
rl-limiter = "rl_limiter.__main__:main"

[tool.setuptools]
packages = ["rl_limiter"]

[tool.setuptools.package-data]
# Web 控制台的静态页面随包分发（webconsole 按包内相对路径读取）。
rl_limiter = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
