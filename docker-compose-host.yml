# 生产形态样例：**host 网络**单节点部署（容器交付 + 宿主机网络栈）。
# 通用形态：rl-limiter 监控/限速宿主机双网卡，与机器上跑什么服务无关
# ——被限的服务（nginx/HAProxy/自研……）该怎么跑还怎么跑，不用进这个
# 容器。
#
#   启动：docker compose -f docker-compose-host.yml up -d --build
#   控制台：http://<本机内网地址>:8090（默认绑 0.0.0.0，读接口无鉴权，
#           用防火墙/安全组限制来源；只想本机访问改 RL_CONSOLE_BIND）
#   收场：docker compose -f docker-compose-host.yml down
#
# 为什么是 host 网络：tc 必须作用在宿主机真实网卡上，监控读的也是宿主
# 机的 /proc——host 网络下容器与宿主机共享网络栈，这些天然成立；bridge
# 形态反而全不成立。注意：
#
#   - **控制台端口直接占宿主机**（没有 ports: 映射这回事）；
#   - **tc 直接作用于真实网卡**：出厂默认 eth0 入向限速（RL_TC_IN_IFACE），
#     网卡命名不同改环境变量。异常退出时 tc 规则可能残留在宿主机内核
#     ——重启本服务即幂等重建/接管；
#   - **net.* 内核参数就是宿主机的**：compose 的 sysctls: 在 host 网络
#     下不可用。请在宿主机上执行 deploy/sysctl/tune-kernel.sh（或按
#     docs/08 固化到 sysctl.d）。
#
# 配置文件建议：生产请把 deploy/config/limiter.example.yaml 复制一份
# 改好，再把挂载路径指向你的副本——直接改仓库模板会在升级时冲突。

services:
  rl-limiter:
    build: .
    network_mode: host           # 共享宿主机网络栈（见文件头）
    cap_add: [NET_ADMIN]         # tc 需要；不需要 privileged
    volumes:
      # 生产：换成你复制出来的副本路径（见文件头注释）。
      - ./deploy/config/limiter.example.yaml:/etc/rl-limiter/config-template.yaml:ro
      # 监控数据落盘挂宿主机卷，长期保留、容器重建不丢。
      - /var/log/rl-limiter:/var/log/rl-limiter
    environment:
      # 出厂默认即双网卡闭环：入向执行网卡 eth0（客户端侧）、出向不做
      # tc。宿主机网卡命名不同（ens33/enp1s0…）时改这两行；也可以用
      # RL_NIC=<卡1,卡2> 指定设备监控清单（默认=全部物理网卡）。
      RL_TC_IFACE: "-"
      RL_TC_IN_IFACE: eth0
      RL_CONSOLE_PORT: "8090"
      # host 网络下控制台端口直接落在宿主机上。默认绑 0.0.0.0（内网
      # 同网段可直接打开监控页）——控制台**读接口无鉴权**，务必用
      # 防火墙/安全组限制来源，切勿裸奔公网；写接口由 RL_API_TOKEN
      # 闸住。只想本机访问（配 SSH 隧道）改回 127.0.0.1。
      RL_CONSOLE_BIND: 0.0.0.0
      # 写 API（页面/API 改限额）令牌：生产请生成随机值
      # （openssl rand -hex 24）；不设则写接口整体 403、页面只读。
      # RL_API_TOKEN: "<openssl rand -hex 24>"
      RL_METRICS_LOG: /var/log/rl-limiter/metrics.jsonl
    restart: unless-stopped
