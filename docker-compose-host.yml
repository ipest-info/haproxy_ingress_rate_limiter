# 生产形态样例（LVS 分支）：**host 网络**部署 rl-limiter（容器交付 +
# 宿主机网络栈）。
#
#   前提：宿主机自己跑 keepalived/ipvsadm（IPVS 表在宿主机内核里——
#         host 网络下容器与宿主机共享同一张表，rl-limiter 直接读）；
#         modprobe ip_vs ip_vs_rr 已加载。
#   启动：docker compose -f docker-compose-host.yml up -d --build
#   控制台：http://127.0.0.1:8090（默认只绑回环，远程看用 SSH 隧道）
#
# 为什么是 host 网络：bridge 的数据面（veth→网桥→conntrack/NAT）高
# 负载下有 10%~30% 开销；host 网络没有这些层，且 **IPVS 表/网卡/tc
# 都直接就是宿主机的**——rl-limiter 的采样与限速作用在真实数据面上。
# 注意：
#   - keepalived 由宿主机 systemd 管（生产常态），容器只跑 rl-limiter
#     （command 覆盖入口脚本的 director 编排）；
#   - 控制台端口直接占宿主机；保持 127.0.0.1，远程走 SSH 隧道；
#   - net.* 内核参数在宿主机上调（deploy/sysctl/tune-kernel.sh），
#     host 网络下 compose 的 sysctls: 不可用；
#   - 主备：两台宿主机各跑一份本 compose、同一份 YAML（docs/11）。
#
# 配置文件：把 deploy/docker/limiter-node.yaml 复制一份出来改（限额），
# 挂载路径指向你的副本。
services:
  rl-limiter:
    build: .
    network_mode: host
    # tc 限速 + 读 IPVS 表需要；仅此一项，不需要 privileged。
    cap_add:
      - NET_ADMIN
    # 入口脚本带参数 = 直接执行（不跑容器内 keepalived 编排）。
    command: >-
      bash -c "cp /etc/rl-limiter/config-template.yaml /etc/rl-limiter/config.yaml
      && exec rl-limiter -c /etc/rl-limiter/config.yaml"
    volumes:
      # 生产：换成你复制出来的副本路径（见文件头注释）。
      - ./deploy/docker/limiter-node.yaml:/etc/rl-limiter/config-template.yaml:ro
      - /var/log/rl-limiter:/var/log/rl-limiter
    environment:
      # 出向限速网卡 = 宿主机**客户端侧物理网卡名**（NAT 双向都过
      # director，出向 HTB 在这张卡上直接限速）。显式写死，别依赖
      # 自动探测。
      RL_TC_IFACE: eth0
      # 入向闭环（可选能力）：需要时填客户端侧网卡并确认内核有 ifb。
      RL_TC_IN_IFACE: "-"
      RL_CONSOLE_PORT: "8090"
      RL_CONSOLE_BIND: 127.0.0.1
      # 写 API 令牌：openssl rand -hex 24；不设则写接口 403、页面只读。
      # RL_API_TOKEN: "<openssl rand -hex 24>"
      RL_METRICS_LOG: /var/log/rl-limiter/metrics.jsonl
    restart: unless-stopped
