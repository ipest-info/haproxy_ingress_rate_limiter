<title>rl-limiter 控制台</title>
<style>
/* 单 HAProxy 模型的控制台：一台 HAProxy、若干受管 frontend。
   每个 frontend 一张卡片 = 实时曲线 + 配置表单（监听端口、限额、
   后端服务器）。改完提交即写库，随后由 enforcer 写进 haproxy.cfg
   并 reload——所以页面上的每一次保存都是真正生效的配置变更。 */
:root {
  --surface-0: #f4f4f2;
  --surface-1: #fcfcfb;
  --surface-2: #eeedea;
  --border:    #e2e1dd;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #8a8983;
  --series-rate:   #2a78d6;
  --series-mean:   #008300;
  --ref-quota:     #52514e;
  --status-good:     #0ca30c;
  --status-warning:  #fab219;
  --status-critical: #d03b3b;
  --grid: rgba(0,0,0,.07);
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-0: #16161a; --surface-1: #1e1e23; --surface-2: #26262c;
    --border: #34343c;
    --text-primary: #f2f2f0; --text-secondary: #b9b8b4; --text-muted: #86857f;
    --grid: rgba(255,255,255,.08);
    --ref-quota: #b9b8b4;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC",
        "Microsoft YaHei", sans-serif;
}
header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 16px; background: var(--surface-1);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
}
h1 { font-size: 16px; margin: 0; font-weight: 650; }
.meta { color: var(--text-secondary); font-size: 12.5px; }
.meta b { color: var(--text-primary); font-weight: 600; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
  padding: 2px 9px; border-radius: 999px; background: var(--surface-2);
}
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
main { padding: 16px; display: grid; gap: 16px; }
.banner {
  padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6;
  border-left: 4px solid var(--status-warning); background: rgba(250,178,25,.10);
}
.banner.ok  { border-left-color: var(--status-good); background: rgba(12,163,12,.10); }
.banner.err { border-left-color: var(--status-critical); background: rgba(208,59,59,.12); }
.banner pre {
  margin: 6px 0 0; white-space: pre-wrap; word-break: break-all;
  font-size: 12px; opacity: .85;
}
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px;
}
.card > h2 {
  font-size: 14.5px; margin: 0 0 10px; font-weight: 650;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.grow { flex: 1; }
canvas { width: 100%; height: 150px; display: block; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; font-size: 12.5px; }
.stats span { color: var(--text-secondary); }
.stats b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
button {
  font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-primary); cursor: pointer;
}
button:hover { border-color: var(--text-muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger  { color: var(--status-critical); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select {
  font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface-0);
  color: var(--text-primary); width: 100%;
}
.form { display: none; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
.form.open { display: block; }
.fields {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px 14px;
}
label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 3px; }
table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
td input { min-width: 70px; }
.hint { color: var(--text-muted); font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); color: var(--text-secondary); }
.tag.over { background: rgba(208,59,59,.15); color: var(--status-critical); font-weight: 600; }
.tag.degraded { background: rgba(250,178,25,.18); color: #8a6100; }
#logs { max-height: 260px; overflow-y: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
#logs div { padding: 1px 0; white-space: pre-wrap; word-break: break-all; }
.lv-WARNING { color: #8a6100; } .lv-ERROR, .lv-CRITICAL { color: var(--status-critical); }
.lv-DEBUG { color: var(--text-muted); }
#toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 50; }
.toast {
  background: var(--surface-1); border: 1px solid var(--border);
  border-left: 4px solid var(--status-good); border-radius: 8px;
  padding: 10px 14px; max-width: 460px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  font-size: 13px;
}
.toast.err { border-left-color: var(--status-critical); }
</style>

<header>
  <h1>rl-limiter 控制台</h1>
  <span class="badge"><span class="dot" id="sse-dot" style="background:var(--status-critical)"></span><span id="sse-text">连接中…</span></span>
  <span class="meta">HAProxy <b id="hap-name">–</b> <span class="hint" id="hap-endpoint"></span></span>
  <span class="meta">配置版本 <b id="cfg-version">–</b></span>
  <span class="meta">运行时长 <b id="uptime">–</b></span>
  <span class="meta">服务版本 <b id="svc-version">–</b></span>
  <span class="grow"></span>
  <span class="meta">窗口
    <select id="window-sel" style="width:auto;display:inline-block">
      <option value="60">1 分钟</option>
      <option value="300" selected>5 分钟</option>
      <option value="600">10 分钟</option>
    </select>
  </span>
</header>

<main>
  <!-- 配置下发状态。运维改完配置最关心的一件事：数据面到底生效了没有。 -->
  <div id="apply-banner" class="banner" style="display:none"></div>

  <div id="frontends"></div>

  <div class="card">
    <h2>新增受管 frontend<span class="grow"></span>
      <button id="new-btn">新增</button>
    </h2>
    <div class="hint">
      新增一个监听端口：填写端口、限额与后端服务器后保存，配置写入数据库，
      随后由本机 rl-limiter 写进 haproxy.cfg 的受管区块并 reload。
    </div>
    <div class="form" id="new-form"></div>
  </div>

  <div class="card">
    <h2>运行日志<span class="grow"></span>
      <select id="log-level" style="width:auto">
        <option value="DEBUG">全部</option>
        <option value="INFO" selected>INFO 及以上</option>
        <option value="WARNING">WARNING 及以上</option>
        <option value="ERROR">仅 ERROR</option>
      </select>
    </h2>
    <div id="logs"></div>
  </div>
</main>
<div id="toasts"></div>

<script>
const $ = (s, el) => (el || document).querySelector(s);
// 往 innerHTML 里塞任何非本页写死的文本前都要过这一道：配置名、下发失败
// 时 `haproxy -c` 的原始 stderr 等都来自外部，直接拼进 HTML 就是注入面。
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 速率一律以 bytes/s 在内部流转，只在显示时换算成 Mbps（×8÷1e6），
// 与配置里的 quota_bps（bit/s）口径对齐。
const toMbps = (bytesPerS) => bytesPerS * 8 / 1e6;
const fmtMbps = (bytesPerS) => toMbps(bytesPerS).toFixed(2) + " Mbps";

const state = {
  fes: new Map(),      // name -> {buf:[], conf, els, tooltipX}
  windowS: 300,
  logAfter: 0,
  logLevel: "INFO",
  enforceEnabled: false,
};
const LEVELS = {DEBUG:10, INFO:20, WARNING:30, ERROR:40, CRITICAL:50};

function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), isErr ? 9000 : 4500);
}

// ---------------------------------------------------------------- 表单
// 一个 frontend 的编辑表单：基本参数 + 后端服务器表格。新增与编辑共用，
// 因为后端接口是 upsert 语义（存在即整体更新），少一类边界情况。
function formHtml(fe, isNew) {
  const f = fe || {};
  const opt = (v, cur) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(v)}</option>`;
  return `
  <div class="fields">
    <div><label>frontend 名${isNew ? "" : "（不可改）"}</label>
      <input class="f-name" value="${esc(f.name || "")}" ${isNew ? "" : "disabled"}
             placeholder="fe_main"></div>
    <div><label>监听地址（留空 = 所有地址）</label>
      <input class="f-addr" value="${esc(f.bind_address || "")}" placeholder="留空"></div>
    <div><label>监听端口</label>
      <input class="f-port" type="number" min="1" max="65535" value="${esc(f.bind_port ?? "")}"></div>
    <div><label>限额（Mbps）</label>
      <input class="f-quota" type="number" min="0" step="0.1"
             value="${f.quota_bps ? (f.quota_bps / 1e6) : ""}"></div>
    <div><label>模式</label>
      <select class="f-mode">${opt("tcp", f.mode || "tcp")}${opt("http", f.mode)}</select></div>
    <div><label>负载均衡</label>
      <select class="f-balance">${["roundrobin","static-rr","leastconn","first","source","random"]
        .map(v => opt(v, f.balance || "roundrobin")).join("")}</select></div>
    <div><label>maxconn（0 = 不设）</label>
      <input class="f-maxconn" type="number" min="0" value="${esc(f.maxconn ?? 0)}"></div>
    <div><label>timeout connect (ms)</label>
      <input class="f-tc" type="number" min="1" value="${esc(f.timeout_connect_ms ?? 5000)}"></div>
    <div><label>timeout client (ms)</label>
      <input class="f-tcl" type="number" min="1" value="${esc(f.timeout_client_ms ?? 50000)}"></div>
    <div><label>timeout server (ms)</label>
      <input class="f-ts" type="number" min="1" value="${esc(f.timeout_server_ms ?? 50000)}"></div>
  </div>
  <table>
    <thead><tr><th>后端服务器</th><th>地址</th><th>端口</th><th>权重</th><th>健康检查</th><th>间隔(ms)</th><th></th></tr></thead>
    <tbody class="f-servers"></tbody>
  </table>
  <div class="row">
    <button class="f-addsrv">+ 添加服务器</button>
    <span class="grow"></span>
    <button class="f-cancel">取消</button>
    <button class="f-save primary">保存并下发</button>
  </div>
  <div class="hint" style="margin-top:8px">
    保存即写入配置库；本机 rl-limiter 随后把它渲染进 haproxy.cfg 的受管区块、
    <code>haproxy -c</code> 校验通过后原子替换并 reload。新建连接立即按新配置，
    存量连接在 HAProxy 的 hard-stop-after 宽限期后进入新配置。
  </div>`;
}

function serverRow(s) {
  const tr = document.createElement("tr");
  s = s || {};
  tr.innerHTML = `
    <td><input class="s-name" value="${esc(s.name || "")}" placeholder="web1"></td>
    <td><input class="s-addr" value="${esc(s.address || "")}" placeholder="10.0.0.21"></td>
    <td><input class="s-port" type="number" min="1" max="65535" value="${esc(s.port ?? "")}"></td>
    <td><input class="s-weight" type="number" min="0" max="256" value="${esc(s.weight ?? 100)}"></td>
    <td style="text-align:center"><input class="s-check" type="checkbox" ${s.check === false ? "" : "checked"} style="width:auto"></td>
    <td><input class="s-inter" type="number" min="1" value="${esc(s.check_inter_ms ?? 2000)}"></td>
    <td><button class="s-del danger">删除</button></td>`;
  tr.querySelector(".s-del").onclick = () => tr.remove();
  return tr;
}

function readForm(root, fallbackName) {
  const q = parseFloat($(".f-quota", root).value);
  const servers = [...root.querySelectorAll(".f-servers tr")].map(tr => ({
    name: $(".s-name", tr).value.trim(),
    address: $(".s-addr", tr).value.trim(),
    port: parseInt($(".s-port", tr).value, 10),
    weight: parseInt($(".s-weight", tr).value, 10),
    check: $(".s-check", tr).checked,
    check_inter_ms: parseInt($(".s-inter", tr).value, 10),
  }));
  return {
    name: ($(".f-name", root).value || fallbackName || "").trim(),
    bind_address: $(".f-addr", root).value.trim(),
    bind_port: parseInt($(".f-port", root).value, 10),
    // 界面按运维习惯用 Mbps，接口用 bit/s——换算只在这一处。
    quota_bps: Math.round((isFinite(q) ? q : 0) * 1e6),
    mode: $(".f-mode", root).value,
    balance: $(".f-balance", root).value,
    maxconn: parseInt($(".f-maxconn", root).value, 10) || 0,
    timeout_connect_ms: parseInt($(".f-tc", root).value, 10),
    timeout_client_ms: parseInt($(".f-tcl", root).value, 10),
    timeout_server_ms: parseInt($(".f-ts", root).value, 10),
    servers,
  };
}

function wireForm(root, fe, isNew, onDone) {
  const tbody = $(".f-servers", root);
  ((fe && fe.servers) || []).forEach(s => tbody.appendChild(serverRow(s)));
  if (isNew && !tbody.children.length) tbody.appendChild(serverRow());
  $(".f-addsrv", root).onclick = () => tbody.appendChild(serverRow());
  $(".f-cancel", root).onclick = () => onDone(false);
  $(".f-save", root).onclick = async (ev) => {
    const btn = ev.target; btn.disabled = true;
    const payload = readForm(root, fe && fe.name);
    try {
      const r = await fetch("/api/frontends/" + encodeURIComponent(payload.name),
        {method: "PUT", body: JSON.stringify(payload)});
      const j = await r.json();
      if (!r.ok) { toast(j.error || "保存失败", true); btn.disabled = false; return; }
      toast(j.note || "已保存");
      onDone(true);
    } catch (e) { toast("请求失败: " + e, true); btn.disabled = false; }
  };
}

// ---------------------------------------------------------------- 卡片
function ensureCard(name) {
  let fe = state.fes.get(name);
  if (fe) return fe;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <h2><span class="fe-title"></span>
      <span class="tag fe-bind"></span>
      <span class="tag fe-mode"></span>
      <span class="tag over fe-over" style="display:none">超限</span>
      <span class="tag degraded fe-degraded" style="display:none">采样失联</span>
      <span class="grow"></span>
      <button class="fe-edit">编辑</button>
      <button class="fe-del danger">删除</button>
    </h2>
    <canvas></canvas>
    <div class="stats">
      <span>实时 <b class="st-rate">–</b></span>
      <span>10s 均值 <b class="st-mean">–</b></span>
      <span>限额 <b class="st-quota">–</b></span>
      <span>利用率 <b class="st-util">–</b></span>
      <span>连接数 <b class="st-conn">–</b></span>
      <span>后端 <b class="st-srv">–</b></span>
    </div>
    <div class="form"></div>`;
  $("#frontends").appendChild(card);
  const canvas = $("canvas", card);
  fe = {name, buf: [], conf: null, card, canvas, tooltipX: null};
  canvas.addEventListener("mousemove", (e) => {
    fe.tooltipX = e.offsetX; draw(fe);
  });
  canvas.addEventListener("mouseleave", () => { fe.tooltipX = null; draw(fe); });
  new ResizeObserver(() => draw(fe)).observe(canvas);
  $(".fe-edit", card).onclick = () => openEdit(fe);
  $(".fe-del", card).onclick = () => delFrontend(name);
  state.fes.set(name, fe);
  return fe;
}

function openEdit(fe) {
  const form = $(".form", fe.card);
  if (form.classList.contains("open")) { form.classList.remove("open"); return; }
  form.innerHTML = formHtml(fe.conf, false);
  form.classList.add("open");
  wireForm(form, fe.conf, false, (saved) => {
    form.classList.remove("open");
    if (saved) setTimeout(loadOverview, 600);
  });
}

async function delFrontend(name) {
  if (!confirm(`删除 frontend「${name}」？\n\n该监听端口会在下一次 reload 后停止服务。`)) return;
  try {
    const r = await fetch("/api/frontends/" + encodeURIComponent(name), {method: "DELETE"});
    const j = await r.json();
    if (!r.ok) { toast(j.error || "删除失败", true); return; }
    toast(j.note || "已删除");
    const fe = state.fes.get(name);
    if (fe) { fe.card.remove(); state.fes.delete(name); }
    setTimeout(loadOverview, 600);
  } catch (e) { toast("请求失败: " + e, true); }
}

function updateCard(fe, u) {
  const c = fe.card;
  $(".fe-title", c).textContent = fe.name;
  const conf = fe.conf || {};
  $(".fe-bind", c).textContent = (conf.bind_address || "*") + ":" + (conf.bind_port ?? "?");
  $(".fe-mode", c).textContent = conf.mode || "tcp";
  $(".st-srv", c).textContent = (conf.servers || []).length;
  if (!u) return;
  $(".st-rate", c).textContent = fmtMbps(u.rate_bytes_per_s);
  $(".st-mean", c).textContent = fmtMbps(u.mean10_bytes_per_s);
  $(".st-quota", c).textContent = u.quota_bytes_per_s ? fmtMbps(u.quota_bytes_per_s) : "–";
  $(".st-util", c).textContent = u.quota_bytes_per_s
    ? (u.mean10_bytes_per_s / u.quota_bytes_per_s * 100).toFixed(0) + "%" : "–";
  $(".st-conn", c).textContent = u.conn;
  $(".fe-over", c).style.display = u.over ? "" : "none";
  $(".fe-degraded", c).style.display = u.degraded ? "" : "none";
}

// ---------------------------------------------------------------- 图表
function draw(fe) {
  const cv = fe.canvas, dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  g.clearRect(0, 0, w, h);

  const now = Date.now() / 1000;
  const pts = fe.buf.filter(p => now - p.ts <= state.windowS);
  const quota = fe.conf ? (fe.conf.quota_bytes_per_s || 0) : 0;
  // 纵轴上界取 max(限额, 实测峰值) 的 1.15 倍：限额线永远在视野内，
  // 超限时的溢出部分也看得见。
  let peak = quota;
  for (const p of pts) peak = Math.max(peak, p.rate, p.mean);
  const top = (peak || 1) * 1.15;
  const x = (ts) => w - (now - ts) / state.windowS * w;
  const y = (v) => h - (v / top) * (h - 4) - 2;

  g.strokeStyle = css.getPropertyValue("--grid"); g.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const yy = Math.round(h * i / 4) + .5;
    g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke();
  }
  if (quota > 0) {
    g.strokeStyle = css.getPropertyValue("--ref-quota");
    g.setLineDash([5, 4]); g.beginPath();
    g.moveTo(0, y(quota)); g.lineTo(w, y(quota)); g.stroke();
    g.setLineDash([]);
  }
  const line = (key, color) => {
    g.strokeStyle = color; g.lineWidth = 1.6; g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(x(p.ts), y(p[key])) : g.moveTo(x(p.ts), y(p[key])));
    g.stroke();
  };
  line("rate", css.getPropertyValue("--series-rate"));
  line("mean", css.getPropertyValue("--series-mean"));

  if (fe.tooltipX != null && pts.length) {
    let best = pts[0], bd = Infinity;
    for (const p of pts) { const d = Math.abs(x(p.ts) - fe.tooltipX); if (d < bd) { bd = d; best = p; } }
    const px = x(best.ts);
    g.strokeStyle = css.getPropertyValue("--text-muted");
    g.beginPath(); g.moveTo(px, 0); g.lineTo(px, h); g.stroke();
    const label = `${fmtMbps(best.rate)} / 均 ${fmtMbps(best.mean)}`;
    g.font = "12px sans-serif";
    const tw = g.measureText(label).width + 10;
    const bx = Math.min(Math.max(px - tw / 2, 2), w - tw - 2);
    g.fillStyle = css.getPropertyValue("--surface-2");
    g.fillRect(bx, 4, tw, 20);
    g.fillStyle = css.getPropertyValue("--text-primary");
    g.fillText(label, bx + 5, 18);
  }
}

// ---------------------------------------------------------------- 数据
function applySnapshot(snap, live) {
  $("#cfg-version").textContent = snap.config_version ?? "–";
  if (snap.haproxy) {
    $("#hap-name").textContent = snap.haproxy.name || "–";
    $("#hap-endpoint").textContent = snap.haproxy.endpoint || "";
  }
  for (const [name, u] of Object.entries(snap.units || {})) {
    const fe = ensureCard(name);
    fe.buf.push({ts: snap.ts, rate: u.rate_bytes_per_s, mean: u.mean10_bytes_per_s});
    if (fe.buf.length > 1200) fe.buf.shift();
    if (live) { updateCard(fe, u); draw(fe); }
  }
}

function renderApplyBanner(en) {
  const el = $("#apply-banner");
  state.enforceEnabled = !!(en && en.enabled);
  if (!en || !en.enabled) {
    // 未启用下发时也要说清楚：否则用户会以为在界面上保存就已经生效了。
    el.style.display = ""; el.className = "banner";
    el.innerHTML = "<b>配置自动下发未启用</b>：在这里保存的改动只会写入配置库，" +
      "<b>不会</b>自动写进 haproxy.cfg。要让改动真正生效，请设置 " +
      "<code>RL_APPLY_HAPROXY_CFG=&lt;本机 haproxy.cfg 路径&gt;</code> 后重启本服务，" +
      "或人工同步配置并 reload。";
    return;
  }
  el.style.display = "";
  if (en.ok) {
    el.className = "banner ok";
    const t = en.last_change_ts ? new Date(en.last_change_ts * 1000).toLocaleTimeString() : null;
    el.innerHTML = "<b>配置自动下发已启用</b>：在这里保存的改动会被写入本机 " +
      "haproxy.cfg 的受管区块并 reload，<b>数据面即时生效</b>" +
      "（新建连接立即按新配置；存量连接在 hard-stop-after 宽限期后进入新配置）。" +
      (t ? ` 最近一次下发：${esc(t)}。` : " 当前与配置库一致。");
  } else {
    el.className = "banner err";
    el.innerHTML = "<b>配置下发失败——数据面仍在按<u>调整前</u>的配置运行</b>：" +
      "配置库已改，但没能写进本机 haproxy.cfg / reload 未成功。" +
      "请按下方原因处理（会自动重试）。" + `<pre>${esc(en.error || "")}</pre>`;
  }
}

async function loadOverview() {
  const o = await (await fetch("/api/overview")).json();
  $("#svc-version").textContent = o.service_version || "–";
  $("#cfg-version").textContent = o.config_version ?? "–";
  if (o.haproxy) {
    $("#hap-name").textContent = o.haproxy.name || "–";
    $("#hap-endpoint").textContent = o.haproxy.endpoint || "";
  }
  const up = Math.floor(o.uptime_s || 0);
  $("#uptime").textContent = up >= 3600
    ? `${Math.floor(up/3600)}h${Math.floor(up%3600/60)}m` : `${Math.floor(up/60)}m${up%60}s`;
  renderApplyBanner(o.enforce);

  const names = Object.keys(o.frontends || {}).sort();
  for (const name of names) {
    const fe = ensureCard(name);
    fe.conf = o.frontends[name];
    updateCard(fe, (o.latest && o.latest.units) ? o.latest.units[name] : null);
  }
  // 配置里已删掉的 frontend：移除卡片，避免留下一张永不更新的僵尸图。
  for (const [name, fe] of [...state.fes]) {
    if (!names.includes(name)) { fe.card.remove(); state.fes.delete(name); }
  }
}

async function loadLogs() {
  const r = await fetch("/api/logs?after=" + state.logAfter);
  const j = await r.json();
  const box = $("#logs");
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  for (const e of j.entries || []) {
    state.logAfter = Math.max(state.logAfter, e.seq);
    const d = document.createElement("div");
    d.className = "lv-" + e.level;
    d.dataset.level = e.level;
    d.textContent = `${new Date(e.ts * 1000).toLocaleTimeString()} ${e.level} ${e.msg}`;
    d.style.display = (LEVELS[e.level] || 0) >= (LEVELS[state.logLevel] || 0) ? "" : "none";
    box.appendChild(d);
  }
  while (box.children.length > 1000) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function connectSSE() {
  const es = new EventSource("/api/stream");
  es.onopen = () => {
    $("#sse-dot").style.background = "var(--status-good)";
    $("#sse-text").textContent = "实时连接正常";
  };
  es.onerror = () => {
    $("#sse-dot").style.background = "var(--status-critical)";
    $("#sse-text").textContent = "连接断开，重试中…";
  };
  es.onmessage = (ev) => { try { applySnapshot(JSON.parse(ev.data), true); } catch (e) {} };
}

// ---------------------------------------------------------------- 启动
$("#window-sel").onchange = (e) => {
  state.windowS = parseInt(e.target.value, 10);
  for (const fe of state.fes.values()) draw(fe);
};
$("#log-level").onchange = (e) => {
  state.logLevel = e.target.value;
  const min = LEVELS[state.logLevel] || 0;
  for (const d of $("#logs").children)
    d.style.display = (LEVELS[d.dataset.level] || 0) >= min ? "" : "none";
};
$("#new-btn").onclick = () => {
  const form = $("#new-form");
  if (form.classList.contains("open")) { form.classList.remove("open"); return; }
  form.innerHTML = formHtml(null, true);
  form.classList.add("open");
  wireForm(form, null, true, (saved) => {
    form.classList.remove("open");
    if (saved) setTimeout(loadOverview, 600);
  });
};

(async function boot() {
  await loadOverview();
  try {
    const h = await (await fetch("/api/history")).json();
    for (const snap of h.snapshots || []) applySnapshot(snap, false);
  } catch (e) {}
  for (const fe of state.fes.values()) {
    const last = fe.buf[fe.buf.length - 1];
    if (last) draw(fe);
  }
  await loadLogs();
  connectSSE();
  setInterval(loadLogs, 2000);
  setInterval(loadOverview, 10000);
})();
</script>
