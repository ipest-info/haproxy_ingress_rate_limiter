<!-- 空 favicon：不写这行浏览器会去请求 /favicon.ico，控制台没这个路由，
     于是每次打开页面都在控制台留一条 404 —— 排障时那条无关的红字很干扰。 -->
<link rel="icon" href="data:,">
<style>
/* 单 HAProxy 模型的控制台。三个 tab：
     实例   —— 整台 HAProxy 的连接/带宽视图；
     监听端口 —— 每个 frontend 一张卡片：监控曲线 + 配置编辑；
     日志   —— 进程内环形缓冲的最近若干条。

   监控视图的分组照 docs/05-监控视图.md 落地，并且**只画有真实数据源的
   曲线**。拿不到的指标既不画空图、也不在页面上长篇解释为什么没有——
   那些取舍属于文档，页面只呈现真有数据的东西。

   每张图都标数据来源，因为口径确实不同、数值本就不该相等：
     HAProxy  应用层字节，按 frontend 精确拆分（带宽、连接）
     tc 队列  链路层字节 + 包数/丢包，按 frontend 拆分，仅出方向
     网卡     链路层，整机范围，用于入方向的包统计

   编辑表单的布局按**操作频率**分层，而不是按字段清单平铺：
     监听（端口/地址/模式）→ 限速（限额）→ 后端服务器 → 折叠的高级项。 */
:root {
  --surface-0: #f5f5f4;
  --surface-1: #ffffff;
  --surface-2: #f0efed;
  --surface-3: #e8e7e4;
  --border:    #dedcd8;
  --border-strong: #c8c6c1;
  --text-primary:   #16150f;
  --text-secondary: #5c5b55;
  --text-muted:     #8d8c85;
  /* 曲线配色：同一张图里的两三条线要一眼分得开，跨图又要语义一致
     （出向永远是蓝，入向永远是青，"坏事"永远是红）。 */
  --s-out:   #2a78d6;
  --s-in:    #0a9396;
  --s-mean:  #008300;
  --s-bad:   #cf3a3a;
  --s-idle:  #b8790a;
  --s-total: #7a4fd6;
  --ref-quota:     #77766f;
  --ok:       #0f9d3a;
  --warn:     #b8790a;
  --critical: #cf3a3a;
  --accent:   #2a78d6;
  --accent-weak: rgba(42,120,214,.10);
  --grid: rgba(0,0,0,.06);
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-0: #131316; --surface-1: #1c1c20; --surface-2: #24242a;
    --surface-3: #2d2d34;
    --border: #33333b; --border-strong: #45454f;
    --text-primary: #f0efec; --text-secondary: #b4b3ae; --text-muted: #85847e;
    --ref-quota: #b4b3ae;
    --s-in: #2ab7ba; --s-mean: #3fbb5a; --s-total: #9b78e8;
    --grid: rgba(255,255,255,.07);
    --accent-weak: rgba(42,120,214,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC",
        "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* 内容限宽并居中：2000px 宽屏上铺满会让每行的视线行程长得离谱，
   表单字段也会被拉成荒唐的宽度。 */
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

header {
  background: var(--surface-1); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 30;
}
header .wrap {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-top: 12px; padding-bottom: 12px;
}
h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
.meta { color: var(--text-secondary); font-size: 12.5px; white-space: nowrap; }
.meta b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
.grow { flex: 1 1 auto; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  padding: 3px 10px; border-radius: 999px; background: var(--surface-2);
  color: var(--text-secondary); white-space: nowrap;
}
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

/* ---- tab 条 ---- */
.tabs {
  display: flex; gap: 2px; border-bottom: 1px solid var(--border);
  background: var(--surface-1); position: sticky; top: 53px; z-index: 29;
}
.tabs .wrap { display: flex; gap: 4px; padding-top: 0; padding-bottom: 0; }
.tabs button {
  border: 0; background: transparent; border-radius: 0; padding: 10px 16px;
  font-size: 13.5px; color: var(--text-secondary); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs button:hover { background: var(--surface-2); }
.tabs button[aria-selected=true] {
  color: var(--accent); border-bottom-color: var(--accent); font-weight: 600;
}

main { padding: 20px 0 64px; }
main > .wrap > * + * { margin-top: 16px; }
.tabpage { display: none; }
.tabpage.on { display: block; }
.tabpage > * + * { margin-top: 16px; }

.banner {
  padding: 11px 15px; border-radius: 9px; font-size: 13px; line-height: 1.65;
  border: 1px solid transparent; border-left-width: 3px;
  background: rgba(184,121,10,.09); border-left-color: var(--warn);
}
.banner.ok  { background: rgba(15,157,58,.09); border-left-color: var(--ok); }
.banner.err { background: rgba(207,58,58,.10); border-left-color: var(--critical); }
.banner.info{ background: var(--surface-2); border-left-color: var(--border-strong); }
.banner pre {
  margin: 7px 0 0; white-space: pre-wrap; word-break: break-all;
  font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
  background: rgba(0,0,0,.05); padding: 8px 10px; border-radius: 6px;
}
.banner ul { margin: 6px 0 0; padding-left: 20px; }
.banner li { margin: 3px 0; }

.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 11px; box-shadow: var(--shadow); overflow: hidden;
}
.card + .card { margin-top: 16px; }
.card-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 13px 16px; border-bottom: 1px solid var(--border);
}
.card-title { font-size: 14.5px; font-weight: 650; }
.card-body { padding: 14px 16px; }

.tag {
  font: 11.5px/1.5 ui-monospace, Menlo, Consolas, monospace;
  padding: 2px 7px; border-radius: 5px;
  background: var(--surface-2); color: var(--text-secondary);
}
.tag.alert { background: rgba(207,58,58,.14); color: var(--critical); font-weight: 600; }
.tag.warn  { background: rgba(184,121,10,.16); color: var(--warn); font-weight: 600; }

/* 指标条：等宽数字 + 标签在上、数值在下，扫一眼就能对齐比较。 */
.stats { display: flex; gap: 24px; flex-wrap: wrap; }
.card-body > .stats + .chart-grid { margin-top: 14px; }
.stat-l { font-size: 11.5px; color: var(--text-muted); }
.stat-v {
  font-size: 15px; font-weight: 620; font-variant-numeric: tabular-nums;
  margin-top: 1px;
}
.stat-v small { font-size: 11.5px; font-weight: 400; color: var(--text-muted); margin-left: 3px; }

/* ---- 图表分组 ----
   一行两张：再窄就看不出曲线形状了，再宽则一屏放不下一个分组。 */
.chart-grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
}
.chart {
  border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px 8px;
  background: var(--surface-1); min-width: 0;
}
.chart-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.chart-t { font-size: 13px; font-weight: 600; }
.chart-src { font-size: 11px; color: var(--text-muted); margin-left: auto; }
canvas { width: 100%; height: 128px; display: block; margin-top: 6px; }
.legend {
  display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px;
  font-size: 11.5px; color: var(--text-secondary);
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 2.5px; border-radius: 2px; flex: none; }
.legend b { font-variant-numeric: tabular-nums; color: var(--text-primary); font-weight: 600; }

button {
  font: inherit; font-size: 13px; padding: 6px 13px; border-radius: 7px;
  border: 1px solid var(--border-strong); background: var(--surface-1);
  color: var(--text-primary); cursor: pointer; white-space: nowrap;
  transition: background .12s, border-color .12s;
}
button:hover:not(:disabled) { background: var(--surface-2); }
button.primary {
  background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550;
}
button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
button.ghost { border-color: transparent; background: transparent; color: var(--text-secondary); }
button.ghost:hover:not(:disabled) { background: var(--surface-2); }
button.danger { color: var(--critical); border-color: transparent; background: transparent; }
button.danger:hover:not(:disabled) { background: rgba(207,58,58,.10); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.sm { padding: 3px 9px; font-size: 12px; }

/* ---- 编辑面板 ---- */
.editor {
  display: none; background: var(--surface-2);
  border-top: 1px solid var(--border);
}
.editor.open { display: block; }
.sec { padding: 15px 16px; border-bottom: 1px solid var(--border); }
.sec:last-of-type { border-bottom: 0; }
.sec-h {
  font-size: 12px; font-weight: 650; color: var(--text-secondary);
  letter-spacing: .04em; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.sec-h .hint { font-weight: 400; letter-spacing: 0; }
/* 字段宽度按内容需要给，不平均分——端口只要 8 个字符宽，没必要和地址一样宽。 */
.fields { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-start; }
.f { display: flex; flex-direction: column; }
.f-name  { width: 190px; } .f-addr { width: 230px; }
.f-port  { width: 110px; } .f-mode { width: 120px; }
.f-quota { width: 190px; } .f-num  { width: 130px; }
.f-bal   { width: 150px; }
label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
label .req { color: var(--critical); }
input, select {
  font: inherit; font-size: 13px; padding: 6px 9px; border-radius: 7px;
  border: 1px solid var(--border-strong); background: var(--surface-1);
  color: var(--text-primary); width: 100%; min-width: 0;
}
input:focus, select:focus {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak);
}
input:disabled { background: var(--surface-3); color: var(--text-muted); }
input.bad { border-color: var(--critical); }
input.bad:focus { box-shadow: 0 0 0 3px rgba(207,58,58,.15); }
.suffix { position: relative; }
.suffix input { padding-right: 46px; }
.suffix span {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-size: 12px; color: var(--text-muted); pointer-events: none;
}
.err { font-size: 11.5px; color: var(--critical); margin-top: 4px; }
.hint { font-size: 11.5px; color: var(--text-muted); }
/* 限额换算提示：Mbps ↔ bytes/s 的 8 倍混淆是本项目最贵的错误来源，
   把最终写进 cfg 的数值直接显示出来，让人在保存前就能发现。 */
.conv {
  font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums;
  align-self: center; padding-top: 14px; line-height: 1.5;
}
.conv b { color: var(--text-primary); font-weight: 600; }

table { width: 100%; max-width: 880px; border-collapse: collapse;
         table-layout: fixed; font-size: 13px; }
th {
  text-align: left; font-size: 11.5px; font-weight: 600; color: var(--text-muted);
  padding: 0 8px 6px 0; white-space: nowrap;
}
td { padding: 3px 8px 3px 0; vertical-align: top; }
/* 操作列紧跟最后一个输入框，别被推到表格最右端——那样"移除"看着不像
   属于这一行。 */
.col-ac { width: 72px; }
td:last-child, th:last-child { padding-right: 0; padding-left: 10px; }
th.c, td.c { text-align: center; }
/* 列宽按内容需要给：端口是 5 位数字，没必要和地址一样宽。 */
.col-nm { width: 150px; } .col-ad { width: 220px; } .col-pt { width: 96px; }
.col-wt { width: 84px; }  .col-ck { width: 76px; }  .col-in { width: 108px; }
input[type=checkbox] { width: auto; }
.empty { color: var(--text-muted); font-size: 12.5px; padding: 8px 0; }

details.adv { border-top: 1px solid var(--border); }
details.adv > summary {
  padding: 11px 16px; cursor: pointer; font-size: 12.5px;
  color: var(--text-secondary); user-select: none; list-style: none;
}
details.adv > summary::-webkit-details-marker { display: none; }
details.adv > summary::before { content: "▸ "; color: var(--text-muted); }
details.adv[open] > summary::before { content: "▾ "; }
details.adv > summary:hover { background: var(--surface-3); }

.actions {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 16px; background: var(--surface-3);
  border-top: 1px solid var(--border);
}
.dirty { font-size: 12px; color: var(--warn); }

#logs {
  max-height: 460px; overflow-y: auto;
  font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
}
#logs div { padding: 1px 0; white-space: pre-wrap; word-break: break-all; }
.lv-WARNING { color: var(--warn); }
.lv-ERROR, .lv-CRITICAL { color: var(--critical); }
.lv-DEBUG { color: var(--text-muted); }

#toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 60; }
.toast {
  background: var(--surface-1); border: 1px solid var(--border);
  border-left: 3px solid var(--ok); border-radius: 9px;
  padding: 11px 15px; max-width: 440px; box-shadow: var(--shadow);
  font-size: 13px; line-height: 1.55;
}
.toast.err { border-left-color: var(--critical); }
@media (max-width: 720px) {
  .f-name, .f-addr, .f-quota, .f-bal, .f-mode, .f-num, .f-port { width: 100%; }
  .tabs { top: 0; position: static; }
}
</style>

<header><div class="wrap">
  <h1>rl-limiter</h1>
  <span class="badge"><span class="dot" id="sse-dot" style="background:var(--critical)"></span><span id="sse-text">连接中…</span></span>
  <span class="meta">HAProxy <b id="hap-name">–</b></span>

<nav class="tabs"><div class="wrap">

<main><div class="wrap">
  <div id="apply-banner" class="banner" style="display:none"></div>

  <!-- ============ 实例视图 ============ -->
  <section class="tabpage on" id="page-instance">

    <div class="card">

        <select id="log-level" style="width:auto;padding:4px 8px">

          <option value="WARNING">WARNING 及以上</option>

      </div>
      <div class="card-body"><div id="logs"></div></div>
    </div>

<script>
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
// 往 innerHTML 里塞任何非本页写死的文本前都要过这一道：配置名、下发失败
// 时 `haproxy -c` 的原始 stderr 等都来自外部，直接拼进 HTML 就是注入面。
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 速率一律以 bytes/s 在内部流转，只在显示时换算成 Mbps（×8÷1e6），
// 与配置里的 quota_bps（bit/s）口径对齐。
const fmtMbps = (bps) => (bps * 8 / 1e6).toFixed(2);
// 每秒计数类（连接数、包数）：小数值给一位小数，大数值取整——差分出来的
// 每秒值经常在个位数，全部取整会让曲线看着一跳一跳的。
const fmtRate = (v) => (v >= 100 ? Math.round(v).toString()
                      : v >= 10 ? v.toFixed(1) : v.toFixed(2));
const fmtInt = (v) => Math.round(v || 0).toString();

const state = {
  fes: new Map(),            // frontend 名 → {buf, conf, card, charts…}
  instBuf: [],               // 实例视图的样本环形缓冲
  instCharts: [],
  windowS: 300, logAfter: 0, logLevel: "INFO", tab: "instance",
};
const LEVELS = {DEBUG:10, INFO:20, WARNING:30, ERROR:40, CRITICAL:50};
// 缓冲上限：1 秒一拍，服务端只留 10 分钟历史，客户端留够 20 分钟即可。
const BUF_MAX = 1200;

function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), isErr ? 10000 : 4500);
}

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name);

// ============================================================ 图表
// 一个通用的多序列时间序列图：所有监控视图（实例的、frontend 的）都用它，
// 差别只在"取哪个缓冲、画哪几个字段、怎么格式化数值"。
//
// spec = {
//   title, source,                  标题与数据来源标注（来源必须标：
//                                   HAProxy 口径与网卡口径不是一回事）
//   fmt, unit,                      数值格式化与单位文本
//   series: [{key, label, color}],  要画的字段
//   points: () => [{ts, …}],        数据源（每次重绘现取）
//   ref: () => ({value,label})|null 参考线（限额）
// }
function makeChart(parent, spec) {
  const el = document.createElement("div");
  el.className = "chart";
  el.innerHTML = `
    <div class="chart-h">
      <span class="chart-t">${esc(spec.title)}</span>
      <span class="chart-src">${esc(spec.source || "")}</span>
    </div>
    <canvas></canvas>
    <div class="legend">${spec.series.map(s =>
      `<span><i style="background:${esc(s.color)}"></i>${esc(s.label)} <b data-k="${esc(s.key)}">–</b></span>`
    ).join("")}</div>`;
  parent.appendChild(el);
  const ch = Object.assign({el, canvas: $("canvas", el), tooltipX: null}, spec);
  ch.canvas.addEventListener("mousemove", (e) => { ch.tooltipX = e.offsetX; drawChart(ch); });
  ch.canvas.addEventListener("mouseleave", () => { ch.tooltipX = null; drawChart(ch); });
  new ResizeObserver(() => drawChart(ch)).observe(ch.canvas);
  return ch;
}

function drawChart(ch) {
  const cv = ch.canvas, dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;                     // tab 未激活时画布尺寸为 0
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const now = Date.now() / 1000;
  const pts = ch.points().filter(p => now - p.ts <= state.windowS);
  const ref = ch.ref ? ch.ref() : null;
  // 纵轴上界取 max(参考线, 实测峰值) 的 1.15 倍：限额线永远在视野内，
  // 超限时的溢出部分也看得见。
  let peak = ref ? ref.value : 0;
  for (const p of pts) for (const s of ch.series) peak = Math.max(peak, p[s.key] || 0);
  const top = (peak || 1) * 1.15;
  const x = (ts) => w - (now - ts) / state.windowS * w;
  const y = (v) => h - ((v || 0) / top) * (h - 4) - 2;

  g.strokeStyle = css("--grid"); g.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const yy = Math.round(h * i / 4) + .5;
    g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke();
  }
  g.font = "10.5px sans-serif";
  g.fillStyle = css("--text-muted");
  // 纵轴上界的数值：没有它就看不出曲线的绝对高度，只能看出形状。
  g.fillText(ch.fmt(top) + " " + ch.unit, 4, 12);

  if (ref && ref.value > 0) {
    g.strokeStyle = css("--ref-quota");
    g.setLineDash([5, 4]); g.beginPath();
    g.moveTo(0, y(ref.value)); g.lineTo(w, y(ref.value)); g.stroke();
    g.setLineDash([]);
  }
  for (const s of ch.series) {
    g.strokeStyle = css(s.color) || s.color;
    g.lineWidth = 1.6; g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(x(p.ts), y(p[s.key]))
                            : g.moveTo(x(p.ts), y(p[s.key])));
    g.stroke();
  }
  if (ref && ref.value > 0) {
    // 限额标签画在曲线**之后**并衬一层底色：限速生效时曲线本来就贴着
    // 限额线跑，先画标签会被曲线盖掉，正好在最需要读它的时候读不到。
    const lbl = ref.label, lw = g.measureText(lbl).width;
    const lx = w - lw - 5, ly = Math.max(10, y(ref.value) - 4);
    g.fillStyle = css("--surface-1");
    g.fillRect(lx - 2, ly - 9, lw + 4, 12);
    g.fillStyle = css("--ref-quota");
    g.fillText(lbl, lx, ly);
  }

  // 图例上的数值：默认跟最新一拍，鼠标悬停时跟悬停处那一拍——图例既是
  // legend 又是读数器，省掉一整行重复的指标条。
  let cur = pts.length ? pts[pts.length - 1] : null;
  if (ch.tooltipX != null && pts.length) {
    let bd = Infinity;
    for (const p of pts) { const d = Math.abs(x(p.ts) - ch.tooltipX); if (d < bd) { bd = d; cur = p; } }
    const px = x(cur.ts);
    g.strokeStyle = css("--text-muted");
    g.beginPath(); g.moveTo(px, 0); g.lineTo(px, h); g.stroke();
  }
  for (const b of $$(".legend b", ch.el))
    b.textContent = cur ? ch.fmt(cur[b.dataset.k] || 0) : "–";
}

function redrawAll() {
  for (const ch of state.instCharts) drawChart(ch);
  for (const fe of state.fes.values()) for (const ch of fe.charts) drawChart(ch);
}

    makeChart(conn, {
      title: "实例总连接数", source: "show info / frontend 汇总",

      series: [
        {key: "conn", label: "并发连接数", color: "--s-total"},
        {key: "active", label: "活跃连接数", color: "--s-out"},

      ],
    }),
    makeChart(bw, {
      title: "实例带宽统计", source: "HAProxy 应用层口径",

      series: [
        {key: "rin", label: "流入带宽", color: "--s-in"},
        {key: "rout", label: "流出带宽", color: "--s-out"},

    }),
    makeChart(bw, {
      title: "实例数据包统计", source: "网卡口径（整机）",
      fmt: fmtRate, unit: "包/秒", points: pts,
      series: [
        {key: "pin", label: "每秒流入数据包数", color: "--s-in"},
        {key: "pout", label: "每秒流出数据包数", color: "--s-out"},
      ],
    }),
    makeChart(bw, {
      title: "实例丢弃数据包统计", source: "网卡口径（整机）",
      fmt: fmtRate, unit: "包/秒", points: pts,
      series: [
        {key: "din", label: "每秒丢失入包数", color: "--s-bad"},
        {key: "dout", label: "每秒丢失出包数", color: "--s-idle"},

}

function updateInstance(i) {
  if (!i) return;
  const set = (id, v, unit) =>
    $(id).innerHTML = esc(v) + (unit ? `<small>${unit}</small>` : "");
  set("#i-conn", fmtInt(i.conn));
  set("#i-actidle", fmtInt(i.active_conns) + " / " + fmtInt(i.idle_conns));
  set("#i-new", fmtRate(i.conn_new_ps), "个/秒");
  set("#i-denied", fmtRate(i.conn_denied_ps), "个/秒");
  set("#i-rin", fmtMbps(i.rate_in_bytes_per_s), "Mbps");
  set("#i-rout", fmtMbps(i.rate_out_bytes_per_s), "Mbps");
  set("#i-maxconn", i.max_conn ? fmtInt(i.max_conn) : "–");
  set("#i-idle", fmtInt(i.idle_pct), "%");
  $("#inst-degraded").hidden = !i.degraded;
  $("#inst-nic-note").textContent = i.nic
    ? `数据包统计取自网卡 ${i.nic}（整机口径，含 HAProxy 之外的流量）`
    : "未采集网卡数据：数据包/丢包曲线为空（可用 RL_NIC 指定网卡）";
}

        <input class="i-name" value="${esc(f.name || "")}" ${isNew ? "" : "disabled"}
               placeholder="fe_main" autocomplete="off">
        ${isNew ? '<div class="hint">字母数字 . _ -</div>'
                : '<div class="hint">改名请新建后删除旧的</div>'}
        <div class="err" hidden></div>
      </div>
      <div class="f f-addr">

      </div>

    <div class="sec-h">限速</div>
    <div class="fields">
      <div class="f f-quota">
        <label>带宽限额 <span class="req">*</span></label>
        <div class="suffix">
          <input class="i-quota" type="number" min="0" step="any"
                 value="${f.quota_bps ? (f.quota_bps / 1e6) : ""}" placeholder="40">
          <span>Mbps</span>

        <div class="err" hidden></div>

    <div class="err err-srv" hidden style="margin-top:6px"></div>

  <details class="adv">
    <summary>高级参数（并发上限、负载均衡、超时）</summary>
    <div class="sec" style="border-bottom:0">
      <div class="fields">
        <div class="f f-num">
          <label>maxconn</label>

        <div class="f f-bal">

          <div class="suffix"><input class="i-tcl" type="number" min="1"
            value="${esc(f.timeout_client_ms ?? 50000)}"><span>ms</span></div>

function serverRow(s) {
  s = s || {};
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input class="s-name" value="${esc(s.name || "")}" placeholder="web1" autocomplete="off"></td>
    <td><input class="s-addr" value="${esc(s.address || "")}" placeholder="10.0.0.21" autocomplete="off"></td>
    <td><input class="s-port" type="number" min="1" max="65535" value="${esc(s.port ?? "")}" placeholder="9000"></td>
    <td><input class="s-weight" type="number" min="0" max="256" value="${esc(s.weight ?? 100)}"></td>
    <td class="c"><input class="s-check" type="checkbox" ${s.check === false ? "" : "checked"}></td>
    <td><input class="s-inter" type="number" min="1" value="${esc(s.check_inter_ms ?? 2000)}"></td>
    <td><button class="s-del danger sm">移除</button></td>`;
  tr.querySelector(".s-del").onclick = () => { tr.remove(); tr.dispatchEvent(new Event("x")); };
  return tr;
}

function readEditor(root, fallbackName) {
  const q = parseFloat($(".i-quota", root).value);
  return {
    name: ($(".i-name", root).value || fallbackName || "").trim(),
    bind_address: $(".i-addr", root).value.trim(),
    bind_port: parseInt($(".i-port", root).value, 10),
    // 界面按运维习惯用 Mbps，接口用 bit/s——换算只在这一处。
    quota_bps: Math.round((isFinite(q) ? q : 0) * 1e6),
    mode: $(".i-mode", root).value,
    balance: $(".i-balance", root).value,
    maxconn: parseInt($(".i-maxconn", root).value, 10) || 0,
    timeout_connect_ms: parseInt($(".i-tc", root).value, 10),
    timeout_client_ms: parseInt($(".i-tcl", root).value, 10),
    timeout_server_ms: parseInt($(".i-ts", root).value, 10),
    servers: $$(".i-servers tr", root).map(tr => ({
      name: $(".s-name", tr).value.trim(),
      address: $(".s-addr", tr).value.trim(),
      port: parseInt($(".s-port", tr).value, 10),
      weight: parseInt($(".s-weight", tr).value, 10),
      check: $(".s-check", tr).checked,
      check_inter_ms: parseInt($(".s-inter", tr).value, 10),
    })),
  };
}

const NAME_RE = /^[A-Za-z0-9._-]{1,64}$/;
const ADDR_RE = /^[A-Za-z0-9._:-]{1,255}$/;

/** 前端校验只为**尽早**给出人话反馈；服务端有同一套规则的权威校验，
 *  两边不一致时以服务端为准（它的错误会通过 toast 显示出来）。 */
function validate(root, p, isNew) {
  const errs = new Map();
  if (isNew && !NAME_RE.test(p.name))
    errs.set(".i-name", "只能用字母、数字、点、下划线、连字符");
  if (!(p.bind_port >= 1 && p.bind_port <= 65535))
    errs.set(".i-port", "端口需在 1–65535");
  if (p.bind_address && !ADDR_RE.test(p.bind_address))
    errs.set(".i-addr", "地址含非法字符");
  if (!(p.quota_bps > 0)) errs.set(".i-quota", "限额必须大于 0");
  else if (p.quota_bps < 8) errs.set(".i-quota", "限额太小（不足 1 byte/s）");

  let srvErr = "";
  if (!p.servers.length) srvErr = "至少要有一台后端服务器";
  const seen = new Set();
  for (const s of p.servers) {
    if (!s.name) { srvErr = "请填写服务器名"; break; }
    if (!NAME_RE.test(s.name)) {
      srvErr = `服务器名「${s.name}」非法：只能用字母、数字、点、下划线、连字符`; break;
    }
    if (seen.has(s.name)) { srvErr = `服务器名「${s.name}」重复`; break; }
    seen.add(s.name);
    if (!s.address) { srvErr = `请填写「${s.name}」的后端地址`; break; }
    if (!ADDR_RE.test(s.address)) { srvErr = `「${s.name}」的地址含非法字符`; break; }
    if (!(s.port >= 1 && s.port <= 65535)) {
      srvErr = `「${s.name}」的端口需在 1–65535`; break;
    }
    if (!(s.weight >= 0 && s.weight <= 256)) { srvErr = `「${s.name}」的权重需在 0–256`; break; }
  }

  // 渲染内联错误：错在哪个字段就标哪个字段，不弹一个笼统的失败提示。
  for (const sel of [".i-name", ".i-port", ".i-addr", ".i-quota"]) {
    const input = $(sel, root); if (!input) continue;
    const box = input.closest(".f").querySelector(".err");
    const msg = errs.get(sel);
    input.classList.toggle("bad", !!msg);
    box.hidden = !msg; box.textContent = msg || "";
  }
  const sbox = $(".err-srv", root);
  if (sbox) { sbox.hidden = !srvErr; sbox.textContent = srvErr; }
  return errs.size === 0 && !srvErr;
}

function wireEditor(root, fe, isNew, onDone) {
  const tbody = $(".i-servers", root);
  const emptyHint = $(".empty", root);
  ((fe && fe.servers) || []).forEach(s => tbody.appendChild(serverRow(s)));
  if (isNew && !tbody.children.length) tbody.appendChild(serverRow());

  const initial = JSON.stringify(readEditor(root, fe && fe.name));
  const refresh = () => {
    const p = readEditor(root, fe && fe.name);
    // 限额换算提示。Mbps ↔ bytes/s 的 8 倍混淆是本项目最贵的错误来源，
    // 把最终写进 cfg 的数值直接显示出来，保存前就能发现填错了一位。
    const conv = $(".conv", root);
    conv.innerHTML = p.quota_bps > 0
      ? `↔ <b>${(p.quota_bps / 8 / 1e6).toFixed(2)} MB/s</b>　`
        + `写入 haproxy.cfg 的 <code>limit</code> = <b>${Math.floor(p.quota_bps / 8)}</b> bytes/s`
      : "";
    emptyHint.hidden = tbody.children.length > 0;
    const dirty = JSON.stringify(p) !== initial;
    $(".dirty", root).hidden = !dirty;
    const valid = validate(root, p, isNew);
    // 没改动就不给保存：避免"手滑点一下"触发一次真实的 reload。
    $(".i-save", root).disabled = !(dirty && valid);
  };
  root.addEventListener("input", refresh);
  root.addEventListener("change", refresh);
  root.addEventListener("x", refresh);          // 移除服务器行
  $(".i-addsrv", root).onclick = (e) => {
    e.preventDefault(); tbody.appendChild(serverRow()); refresh();
  };
  refresh();

  $(".i-cancel", root).onclick = () => {
    if (!$(".dirty", root).hidden && !confirm("有未保存的修改，确定放弃？")) return;
    onDone(false);
  };
  if (!isNew) $(".i-del", root).onclick = () => delFrontend(fe.name);
  $(".i-save", root).onclick = async (ev) => {
    const btn = ev.target, p = readEditor(root, fe && fe.name);
    if (!validate(root, p, isNew)) return;
    btn.disabled = true; btn.textContent = "下发中…";
    try {
      const r = await fetch("/api/frontends/" + encodeURIComponent(p.name),
        {method: "PUT", body: JSON.stringify(p)});
      const j = await r.json();
      if (!r.ok) {
        toast(j.error || "保存失败", true);
        btn.disabled = false; btn.textContent = isNew ? "创建并下发" : "保存并下发";
        return;
      }
      toast(j.note || "已保存");
      onDone(true);
    } catch (e) {
      toast("请求失败: " + e, true);
      btn.disabled = false; btn.textContent = isNew ? "创建并下发" : "保存并下发";
    }
  };
}

// ============================================================ frontend 卡片
// 每个 frontend 一张卡片：概要指标条 + 三张监控图 + 折叠的编辑面板。
// 三张图对应文档里 frontend 视图能落地的三组：新建连接、总连接、带宽。
function ensureCard(name) {
  let fe = state.fes.get(name);
  if (fe) return fe;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-head">
      <span class="card-title fe-name"></span>
      <span class="tag fe-bind"></span>
      <span class="tag fe-mode"></span>
      <span class="tag alert fe-over" hidden>超限</span>
      <span class="tag warn fe-degraded" hidden>采样失联</span>
      <span class="grow"></span>
      <button class="fe-edit">编辑</button>
    </div>
    <div class="card-body">
      <div class="stats">
        <div><div class="stat-l">实时下行</div><div class="stat-v st-rate">–<small>Mbps</small></div></div>
        <div><div class="stat-l">10s 均值</div><div class="stat-v st-mean">–<small>Mbps</small></div></div>
        <div><div class="stat-l">限额</div><div class="stat-v st-quota">–<small>Mbps</small></div></div>
        <div><div class="stat-l">利用率</div><div class="stat-v st-util">–</div></div>
        <div><div class="stat-l">并发连接</div><div class="stat-v st-conn">–</div></div>
        <div><div class="stat-l">活跃 / 非活跃</div><div class="stat-v st-actidle">–</div></div>
        <div><div class="stat-l">后端</div><div class="stat-v st-srv">–<small>台</small></div></div>
      </div>
      <div class="chart-grid fe-charts"></div>
    </div>
    <div class="editor"></div>`;
  $("#frontends").appendChild(card);
  fe = {name, buf: [], conf: null, card, charts: []};
  const grid = $(".fe-charts", card), pts = () => fe.buf;
  fe.charts = [
    makeChart(grid, {
      title: "新建连接数", source: "conn_tot / dcon+dses+dreq 差分",
      fmt: fmtRate, unit: "个/秒", points: pts,
      series: [
        {key: "conn_new", label: "每秒新建连接数", color: "--s-out"},
        {key: "conn_denied", label: "每秒丢失连接数", color: "--s-bad"},
      ],
    }),
    makeChart(grid, {
      title: "总连接数", source: "scur / h1_open_connections",
      fmt: fmtInt, unit: "个", points: pts,
      series: [
        {key: "conn", label: "并发连接数", color: "--s-total"},
        {key: "active", label: "活跃连接数", color: "--s-out"},
        {key: "idle", label: "非活跃连接数", color: "--s-idle"},
      ],
    }),
    makeChart(grid, {
      title: "带宽统计", source: "bin / bout 差分（应用层）",
      fmt: fmtMbps, unit: "Mbps", points: pts,
      series: [
        {key: "rin", label: "流入带宽", color: "--s-in"},
        {key: "rout", label: "流出带宽", color: "--s-out"},
        {key: "mean", label: "流出 10s 均值", color: "--s-mean"},
      ],
      // 限额参考线只对流出方向有意义——tc 只整形出方向。
      ref: () => fe.conf && fe.conf.quota_bytes_per_s
        ? {value: fe.conf.quota_bytes_per_s,
           label: "限额 " + fmtMbps(fe.conf.quota_bytes_per_s)}
        : null,
    }),
    makeChart(grid, {
      // 这张图是限速迁到内核 tc 之后才有的：tc 的每个队列正好对应一个
      // frontend，于是"按监听端口统计包与丢包"第一次成立。丢包就是被
      // 限速丢掉的包，overlimit 是被限速延迟的次数——限额吃不吃紧看它。
      title: "数据包与丢包", source: "tc 队列（出方向）",
      fmt: fmtRate, unit: "个/秒", points: pts,
      series: [
        {key: "pkts_out", label: "每秒流出数据包数", color: "--s-out"},
        {key: "drop_out", label: "每秒丢弃包数", color: "--s-bad"},
        {key: "overlimit", label: "每秒触发限速次数", color: "--s-idle"},
      ],
    }),
  ];
  $(".fe-edit", card).onclick = () => toggleEdit(fe);
  state.fes.set(name, fe);
  return fe;
}

function toggleEdit(fe) {
  const ed = $(".editor", fe.card), btn = $(".fe-edit", fe.card);
  if (ed.classList.contains("open")) {
    ed.classList.remove("open"); btn.textContent = "编辑"; return;
  }
  ed.innerHTML = editorHtml(fe.conf, false);
  ed.classList.add("open"); btn.textContent = "收起";
  wireEditor(ed, fe.conf, false, (saved) => {
    ed.classList.remove("open"); btn.textContent = "编辑";
    if (saved) setTimeout(loadOverview, 700);
  });
}

async function delFrontend(name) {
  if (!confirm(`删除监听端口「${name}」？\n\n该端口会在下一次 reload 后停止服务，`
             + `经它转发的连接会被断开。`)) return;
  try {
    const r = await fetch("/api/frontends/" + encodeURIComponent(name), {method: "DELETE"});
    const j = await r.json();
    if (!r.ok) { toast(j.error || "删除失败", true); return; }
    toast(j.note || "已删除");
    const fe = state.fes.get(name);
    if (fe) { fe.card.remove(); state.fes.delete(name); }
    setTimeout(loadOverview, 700);
  } catch (e) { toast("请求失败: " + e, true); }
}

function updateCard(fe, u) {
  const c = fe.card, conf = fe.conf || {};
  $(".fe-name", c).textContent = fe.name;
  $(".fe-bind", c).textContent = (conf.bind_address || "*") + ":" + (conf.bind_port ?? "?");
  $(".fe-mode", c).textContent = conf.mode || "tcp";
  $(".st-srv", c).innerHTML = (conf.servers || []).length + "<small>台</small>";
  if (!u) return;
  const set = (sel, v, unit) =>
    $(sel, c).innerHTML = esc(v) + (unit ? `<small>${unit}</small>` : "");
  set(".st-rate", fmtMbps(u.rate_bytes_per_s), "Mbps");
  set(".st-mean", fmtMbps(u.mean10_bytes_per_s), "Mbps");
  set(".st-quota", u.quota_bytes_per_s ? fmtMbps(u.quota_bytes_per_s) : "–",
      u.quota_bytes_per_s ? "Mbps" : "");
  set(".st-util", u.quota_bytes_per_s
    ? (u.mean10_bytes_per_s / u.quota_bytes_per_s * 100).toFixed(0) + "%" : "–");
  set(".st-conn", fmtInt(u.conn));
  set(".st-actidle", fmtInt(u.active_conns) + " / " + fmtInt(u.idle_conns));
  $(".fe-over", c).hidden = !u.over;
  $(".fe-degraded", c).hidden = !u.degraded;
}

// ============================================================ 数据
function applySnapshot(snap, live) {
  $("#cfg-version").textContent = snap.config_version ?? "–";
  if (snap.haproxy) {
    $("#hap-name").textContent = snap.haproxy.name || "–";
    $("#hap-endpoint").textContent = snap.haproxy.endpoint || "";
  }
  const i = snap.instance;
  if (i && Object.keys(i).length) {
    state.instBuf.push({
      ts: snap.ts,
      conn_new: i.conn_new_ps, conn_denied: i.conn_denied_ps,
      conn: i.conn, active: i.active_conns, idle: i.idle_conns,
      rin: i.rate_in_bytes_per_s, rout: i.rate_out_bytes_per_s,
      pin: i.pkts_in_ps, pout: i.pkts_out_ps,
      din: i.drop_in_ps, dout: i.drop_out_ps,
    });
    if (state.instBuf.length > BUF_MAX) state.instBuf.shift();
    if (live) {
      updateInstance(i);
      if (state.tab === "instance") for (const ch of state.instCharts) drawChart(ch);
    }
  }
  for (const [name, u] of Object.entries(snap.units || {})) {
    const fe = ensureCard(name);
    // rout 就是限速那条链路的 rate_bytes_per_s（bwlim 只整形下行），
    // 这里统一叫 rout 是为了和 rin 成对，图表按同一套键名取值。
    fe.buf.push({
      ts: snap.ts,
      rout: u.rate_bytes_per_s, rin: u.rate_in_bytes_per_s,
      mean: u.mean10_bytes_per_s,
      conn_new: u.conn_new_ps, conn_denied: u.conn_denied_ps,
      conn: u.conn, active: u.active_conns, idle: u.idle_conns,
      pkts_out: u.pkts_out_ps || 0, drop_out: u.drop_out_ps || 0,
      overlimit: u.overlimit_ps || 0,
    });
    if (fe.buf.length > BUF_MAX) fe.buf.shift();
    if (live) {
      updateCard(fe, u);
      if (state.tab === "frontend") for (const ch of fe.charts) drawChart(ch);
    }
  }
}

function renderApplyBanner(en) {
  const el = $("#apply-banner");
  el.style.display = "";
  if (!en || !en.enabled) {
    // 未启用下发时必须说清楚：否则用户会以为在界面上保存就已经生效了。
    el.className = "banner";
    el.innerHTML = "<b>配置自动下发未启用</b>：这里保存的改动只会写入配置库，"
      + "<b>不会</b>自动写进 haproxy.cfg。要让改动真正生效，请设置 "
      + "<code>RL_APPLY_HAPROXY_CFG=&lt;本机 haproxy.cfg 路径&gt;</code> 后重启本服务。";
    return;
  }
  if (en.ok) {
    el.className = "banner ok";
    const t = en.last_change_ts ? new Date(en.last_change_ts * 1000).toLocaleTimeString() : null;
    el.innerHTML = "<b>配置自动下发已启用</b>：保存后会写入本机 haproxy.cfg 并 reload，"
      + "数据面即时生效（新建连接立即按新配置；存量连接在 hard-stop-after 宽限期后跟上）。"
      + (t ? ` 最近一次下发 ${esc(t)}。` : " 当前与配置库一致。");
  } else {
    el.className = "banner err";
    el.innerHTML = "<b>配置下发失败——数据面仍在按<u>调整前</u>的配置运行</b>："
      + "配置库已改，但没能写进本机 haproxy.cfg / reload 未成功（会自动重试）。"
      + `<pre>${esc(en.error || "")}</pre>`;
  }
}

async function loadOverview() {
  const o = await (await fetch("/api/overview")).json();
  $("#svc-version").textContent = o.service_version || "–";
  $("#cfg-version").textContent = o.config_version ?? "–";
  if (o.haproxy) {
    $("#hap-name").textContent = o.haproxy.name || "–";
    $("#hap-endpoint").textContent = o.haproxy.endpoint || "";
  }
  const up = Math.floor(o.uptime_s || 0);
  $("#uptime").textContent = up >= 3600
    ? `${Math.floor(up/3600)}h${Math.floor(up%3600/60)}m` : `${Math.floor(up/60)}m${up%60}s`;
  renderApplyBanner(o.enforce);
  if (o.latest && o.latest.instance) updateInstance(o.latest.instance);

  const names = Object.keys(o.frontends || {}).sort();
  for (const name of names) {
    const fe = ensureCard(name);
    // 编辑面板开着时不覆盖 conf：否则轮询会把用户正在填的表单初值换掉。
    if (!$(".editor", fe.card).classList.contains("open")) fe.conf = o.frontends[name];
    updateCard(fe, (o.latest && o.latest.units) ? o.latest.units[name] : null);
  }
  for (const [name, fe] of [...state.fes]) {
    if (!names.includes(name)) { fe.card.remove(); state.fes.delete(name); }
  }
}

async function loadLogs() {
  const j = await (await fetch("/api/logs?after=" + state.logAfter)).json();
  const box = $("#logs");
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  for (const e of j.logs || []) {
    state.logAfter = Math.max(state.logAfter, e.seq);
    const d = document.createElement("div");
    d.className = "lv-" + e.level;
    d.dataset.level = e.level;
    d.textContent = `${new Date(e.ts * 1000).toLocaleTimeString()} ${e.level} ${e.msg}`;
    d.style.display = (LEVELS[e.level] || 0) >= (LEVELS[state.logLevel] || 0) ? "" : "none";
    box.appendChild(d);
  }
  while (box.children.length > 1000) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function connectSSE() {
  const es = new EventSource("/api/stream");
  es.onopen = () => {
    $("#sse-dot").style.background = "var(--ok)";
    $("#sse-text").textContent = "实时连接正常";
  };
  es.onerror = () => {
    $("#sse-dot").style.background = "var(--critical)";
    $("#sse-text").textContent = "连接断开，重试中…";
  };
  es.onmessage = (ev) => { try { applySnapshot(JSON.parse(ev.data), true); } catch (e) {} };
}

// ============================================================ 启动
function switchTab(name) {
  state.tab = name;
  for (const b of $$(".tabs button")) b.setAttribute("aria-selected", String(b.dataset.tab === name));
  for (const p of $$(".tabpage")) p.classList.toggle("on", p.id === "page-" + name);
  // 刚显示出来的画布此前 clientWidth 为 0，必须重绘一次才有内容。
  redrawAll();
}
for (const b of $$(".tabs button")) b.onclick = () => switchTab(b.dataset.tab);

$("#window-sel").onchange = (e) => {
  state.windowS = parseInt(e.target.value, 10);
  redrawAll();
};
$("#log-level").onchange = (e) => {
  state.logLevel = e.target.value;
  const min = LEVELS[state.logLevel] || 0;
  for (const d of $("#logs").children)
    d.style.display = (LEVELS[d.dataset.level] || 0) >= min ? "" : "none";
};
$("#new-btn").onclick = () => {
  const ed = $("#new-editor"), btn = $("#new-btn");
  if (ed.classList.contains("open")) {
    ed.classList.remove("open"); btn.textContent = "+ 新增"; return;
  }
  ed.innerHTML = editorHtml(null, true);
  ed.classList.add("open"); btn.textContent = "收起";
  wireEditor(ed, null, true, (saved) => {
    ed.classList.remove("open"); btn.textContent = "+ 新增";
    if (saved) setTimeout(loadOverview, 700);
  });
};
// 有未保存修改时离开页面要拦一下——这里的每次保存都是真实的配置变更。
window.addEventListener("beforeunload", (e) => {
  if ($$(".editor.open .dirty").some(d => !d.hidden)) { e.preventDefault(); e.returnValue = ""; }
});

(async function boot() {
  buildInstanceCharts();
  await loadOverview();
  try {
    const h = await (await fetch("/api/history")).json();
    for (const snap of h.snapshots || []) applySnapshot(snap, false);
  } catch (e) {}
  redrawAll();
  await loadLogs();
  connectSSE();
  setInterval(loadLogs, 2000);
  setInterval(loadOverview, 10000);
})();
</script>
