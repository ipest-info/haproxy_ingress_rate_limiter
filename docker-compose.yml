# docker compose 一键演示环境：MySQL 配置源 + 三台 **Ubuntu 24.04 节点**
# （每台 = HAProxy + 同机 rl-limiter）+ 模拟业务后端 + 可调并发压测服务。
# 详细玩法见 docs/04-DockerCompose演示.md。
#
#   启动：docker compose up -d --build
#   控制台：http://localhost:8090 / :8092 / :8093（每台节点各一个）
#   观察：docker compose logs -f node1 loadgen
#   调并发：curl -X PUT http://localhost:8084/concurrency -d '{"concurrency": 32}'
#   长连接大文件下载：curl -X PUT http://localhost:8084/big -d '{"per_target": 2}'
#   收场：docker compose down -v
#
# 部署形态：**rl-limiter 与 HAProxy 同机**。每个 node 容器 = 生产上的
# 一台 ECS：容器内同时跑 haproxy 与 rl-limiter，rl-limiter 通过本机
# unix socket（/run/haproxy/admin.sock）只采本机那台 HAProxy——stats
# socket 不占任何网络端口，容器之间也无需互相可达。
#
# 拓扑（三台 TCP L4 节点，各自独立；监听端口/限额/后端服务器都由各自的
# rl-limiter 从配置库渲染进本机 haproxy.cfg 的受管区块）：
#   loadgen ==打散==> node1:8080、node2:8080、node3:8080（各自 fe_main）
#                          └──> web:9000（随机大小响应）
#   node{1,2,3} 内的 rl-limiter ──轮询──> mysql（实例/frontend/后端服务器）
#   node{1,2,3} 内的 rl-limiter ──show stat──> 本机 unix socket（不出容器）
# 限速由各台机器的内核 tc（各 40 Mbps）在本机执行。每个控制台
# 只管本机那台 HAProxy：可在页面上增删改监听端口、限额与后端服务器，
# 保存即写库、随后自动写进 cfg 并 reload。

services:
  # ---- 配置源：MySQL（表结构与演示种子数据见 deploy/mysql/init.sql）----
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: rl_limiter
      MYSQL_USER: rl
      MYSQL_PASSWORD: rl_pass
    volumes:
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    # 只在本机回环暴露 3306，方便宿主机直接用 mysql 客户端改配置。
    networks:
      - default
    healthcheck:
      # TCP ping：初始化阶段的临时实例只监听 unix socket，ping 通 TCP
      # 即表示真实实例（含 init.sql 灌数）已就绪。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  # ---- 三台节点：Ubuntu 24.04 + HAProxy 2.8(发行版自带) + 同机 rl-limiter。
  # 每个容器 = 生产上的一台 ECS，各管各的。挂进去的 haproxy-base.cfg 只是
  # global/defaults 骨架，监听端口与后端由各自的 rl-limiter 从配置库渲染
  # 进受管区块。stats socket 是容器内的 unix socket，不映射也无需互通。
  node1:
    build:
      context: .
    # 限速由内核 tc 执行，容器默认没有操作网络设备的权限，必须显式给。
    # 少了它 rl-limiter 一启动就会因为 tc 权限不足而退出（入口脚本会
    # 明确报出来，不会静默地"没在限速"）。
    cap_add:
      - NET_ADMIN
    # FD 需求 = maxconn × 2 + maxpipes × 2 + 34（管道那一项是 splice 用的，
    # 本项目开着 splice）。给不够 HAProxy **拒绝启动**；入口脚本会在启动前
    # 按 cfg 里的实际值预检一遍并直接报出该改成多少，不必去 ALERT 里翻。
    #
    # 下面 HAPROXY_MAXCONN/MAXPIPES 都是 100 万，于是
    #     FD 需求 = 1000000×2 + 1000000×2 + 34 = 4000034
    # nofile 必须盖得住这个数（tests/test_deploy_limits.py 会盯着这条）。
    #
    # **注意：这已经超过宿主机 `fs.nr_open` 的默认值 1048576。** 那是单
    # 进程 RLIMIT_NOFILE 的硬天花板，**容器里改不动**——不先在宿主机抬上去，
    # 容器连启动都启不来（runc 设 rlimit 直接失败）。先执行：
    #     sudo sysctl -w fs.nr_open=4194304
    # 要持久化用 deploy/sysctl/tune-kernel.sh dump（表里已含这一项）。
    #
    # 开发机上不想动宿主机内核参数的话，把这两个变量连同 nofile 一起降到
    # 10 万量级即可（10 万连接 = 400034 fd，nofile 524288 就够）。
    #
    # 内核参数（somaxconn、conntrack 等）由入口脚本的 tune-kernel.sh 处理，
    # 不走 compose 的 sysctls: —— 原因见 docs/08-内核参数调优.md §2。
    ulimits:
      nofile:
        soft: 4194304
        hard: 4194304
    volumes:
      - ./deploy/docker/haproxy-base.cfg:/etc/rl-limiter/haproxy-template.cfg:ro
    environment:
      # 本实例对应配置库 haproxy_instances 里的哪一行（读写都只碰自己
      # 那些行）。值必须与库中登记的实例名一致。
      RL_NODE_NAME: hap-1
      # 与 haproxy-base.cfg 的默认值一致（100 万）。改这两个数**必须**同步
      # 改上面的 ulimits.nofile 与宿主机的 fs.nr_open，见那段注释。
      HAPROXY_MAXCONN: "1000000"
      HAPROXY_MAXPIPES: "1000000"
      RL_MYSQL_HOST: mysql
      RL_MYSQL_PORT: "3306"
      RL_MYSQL_USER: rl
      RL_MYSQL_PASSWORD: rl_pass
      RL_MYSQL_DB: rl_limiter
      RL_MYSQL_POLL_S: "3"
      RL_CONSOLE_PORT: "8090"
      # 演示需要从宿主机打开控制台，故绑 0.0.0.0；宿主机侧只映射到回环
      # （下方 ports）。生产默认是 127.0.0.1，控制台无鉴权，切勿裸奔。
      RL_CONSOLE_BIND: 0.0.0.0
      # 配置自动下发：库里改监听端口/限额/后端服务器 → 本机 rl-limiter
      # 立刻把它们渲染进这份 cfg 的受管区块并 reload（容器里没有
      # systemctl，用入口脚本落的 master pid 发 SIGUSR2）。
      RL_APPLY_HAPROXY_CFG: /etc/haproxy/haproxy.cfg
      RL_APPLY_RELOAD_CMD: kill -USR2 $$(cat /run/haproxy/master.pid)
    networks:
      - default
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped


volumes:
  mysql-data:


networks:
  default:
    ipam:
      config:
        - subnet: 10.211.0.0/24
          gateway: 10.211.0.1