# docker compose 一键演示环境：MySQL 配置源 + 真实 HAProxy 整形 + 模拟
# 业务后端 + 可调并发压测服务。详细玩法见 docs/04-DockerCompose演示.md。
#
#   启动：docker compose up -d --build
#   控制台：http://localhost:8090（实时曲线、限额登记、环境/挂载点管理）
#   观察：docker compose logs -f rl-limiter loadgen
#   调并发：curl -X PUT http://localhost:8084/concurrency -d '{"concurrency": 32}'
#   长连接大文件下载：curl -X PUT http://localhost:8084/big -d '{"per_target": 2}'
#   收场：docker compose down -v
#
# 拓扑（三台 TCP L4 HAProxy；节点是环境的独占资源——一个环境可横跨
# 多台节点，一台节点只服务一个环境）：
#   loadgen ==打散==> haproxy1:8080、haproxy2:8080 (fe_env_a → env-a 独占)
#                    haproxy3:8080 (fe_env_b → env-b 独占)
#                          └──> web:9000（随机大小响应）
#   rl-limiter ──轮询──> mysql（配置：节点/环境/挂载点/登记限额）
#   rl-limiter ──show stat（只读采样）──> haproxy{1,2,3}:9999
# 限速由各台 HAProxy 的 shared bwlim（各 40 Mbps）在本机执行；env-a =
# hap-1+hap-2（聚合视图 80Mbps），env-b = hap-3（节点是环境的独占资源）。

services:
  # ---- 配置源：MySQL（表结构与演示种子数据见 deploy/mysql/init.sql）----
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: rl_limiter
      MYSQL_USER: rl
      MYSQL_PASSWORD: rl_pass
    volumes:
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    # 只在本机回环暴露 3306，方便宿主机直接用 mysql 客户端改配置。
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # TCP ping：初始化阶段的临时实例只监听 unix socket，ping 通 TCP
      # 即表示真实实例（含 init.sql 灌数）已就绪。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  # ---- HAProxy 后端：模拟业务 web 服务（每次请求返回随机大小响应）----
  web:
    build: .
    command: python3 tools/random_web.py --port 9000
    environment:
      # 响应体大小区间（字节）：默认 256 KiB ~ 2 MiB，可按需覆盖。
      WEB_MIN_BYTES: ${WEB_MIN_BYTES:-262144}
      WEB_MAX_BYTES: ${WEB_MAX_BYTES:-2097152}
      # /big 大文件下载端点的默认大小：512 MiB（40 Mbps 限速下约 100s
      # 下完），供长连接大文件场景（loadgen 的 big worker）使用。
      WEB_BIG_BYTES: ${WEB_BIG_BYTES:-536870912}
    restart: unless-stopped

  # ---- 数据面：三台真实 HAProxy 2.8（TCP L4 + shared bwlim 聚合限速
  # + stats socket 供只读采样）。节点独占环境：haproxy1/haproxy2 只跑
  # env-a 的 fe_env_a（一环境横跨两节点），haproxy3 只跑 env-b 的
  # fe_env_b。9999（runtime API）不映射宿主机：仅 compose 网络内可达。
  haproxy1:
    image: haproxy:2.8
    volumes:
      - ./deploy/docker/haproxy-env-a.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8080"   # hap-1 / fe_env_a（宿主机可 curl 体验限速）
    depends_on:
      - web
    restart: unless-stopped

  haproxy2:
    image: haproxy:2.8
    volumes:
      - ./deploy/docker/haproxy-env-a.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8082:8080"   # hap-2 / fe_env_a
    depends_on:
      - web
    restart: unless-stopped

  haproxy3:
    image: haproxy:2.8
    volumes:
      - ./deploy/docker/haproxy-env-b.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8083:8080"   # hap-3 / fe_env_b
    depends_on:
      - web
    restart: unless-stopped

  # ---- 控制面：rl-limiter（配置来自 MySQL，轮询热更新；内置 Web 控制台）----
  rl-limiter:
    build: .
    environment:
      RL_MYSQL_HOST: mysql
      RL_MYSQL_PORT: "3306"
      RL_MYSQL_USER: rl
      RL_MYSQL_PASSWORD: rl_pass
      RL_MYSQL_DB: rl_limiter
      RL_MYSQL_POLL_S: "3"
      # 内置 Web 控制台：实时带宽/连接数曲线 + 限额登记 + 超限告警 + 日志。
      RL_CONSOLE_PORT: "8090"
    ports:
      - "8090:8090"   # 控制台（浏览器打开 http://localhost:8090）
    depends_on:
      mysql:
        condition: service_healthy
      haproxy1:
        condition: service_started
      haproxy2:
        condition: service_started
      haproxy3:
        condition: service_started
    restart: unless-stopped

  # ---- 客户端群：可在线调节并发数的压测服务（模拟并发带宽）----
  loadgen:
    build: .
    # 三个入口（env-a×2 节点 + env-b×1 节点）：worker 轮转绑定入口，
    # 每台节点各自被 shared bwlim 压在自己的限额内、互不影响。
    command: >-
      python3 tools/loadgen.py
      --target http://haproxy1:8080/,http://haproxy2:8080/,http://haproxy3:8080/
      --control-port 8081
    environment:
      # 初始并发：LOADGEN_CONCURRENCY=32 docker compose up -d 即可改；
      # 运行中用控制端口在线调节（见文件头速查）。
      LOADGEN_CONCURRENCY: ${LOADGEN_CONCURRENCY:-12}
      # 长连接大文件下载场景：每个入口 N 条长连接循环下载 /big（默认
      # 每入口 1 条）。验证 shared bwlim 对存量长连接的持续限速与限额
      # 调整（reload + hard-stop）对在途下载的影响。
      LOADGEN_BIG_PER_TARGET: ${LOADGEN_BIG_PER_TARGET:-1}
    ports:
      - "8084:8081"   # 控制端口（宿主机 8084）：GET /status、PUT /concurrency
    depends_on:
      - haproxy1
      - haproxy2
      - haproxy3
    restart: unless-stopped

volumes:
  mysql-data:
