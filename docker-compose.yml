# docker compose 一键演示环境：MySQL 配置源 + 三台 **Ubuntu 24.04 节点**
# （每台 = HAProxy + 同机 rl-limiter）+ 模拟业务后端 + 可调并发压测服务。
# 详细玩法见 docs/04-DockerCompose演示.md。
#
#   启动：docker compose up -d --build
#   控制台：http://localhost:8090 / :8092 / :8093（每台节点各一个）
#   观察：docker compose logs -f node1 loadgen
#   调并发：curl -X PUT http://localhost:8084/concurrency -d '{"concurrency": 32}'
#   长连接大文件下载：curl -X PUT http://localhost:8084/big -d '{"per_target": 2}'
#   收场：docker compose down -v
#
# 部署形态：**rl-limiter 与 HAProxy 同机**。每个 node 容器 = 生产上的
# 一台 ECS：容器内同时跑 haproxy 与 rl-limiter，rl-limiter 通过本机
# unix socket（/run/haproxy/admin.sock）只采本机那台 HAProxy——stats
# socket 不占任何网络端口，容器之间也无需互相可达。
#
# 拓扑（三台 TCP L4 节点；节点是环境的独占资源——一个环境可横跨多台
# 节点，一台节点只服务一个环境）：
#   loadgen ==打散==> node1:8080、node2:8080 (fe_env_a → env-a 独占)
#                    node3:8080 (fe_env_b → env-b 独占)
#                          └──> web:9000（随机大小响应）
#   node{1,2,3} 内的 rl-limiter ──轮询──> mysql（节点/环境/挂载点/限额）
#   node{1,2,3} 内的 rl-limiter ──show stat──> 本机 unix socket（不出容器）
# 限速由各台 HAProxy 的 shared bwlim（各 40 Mbps）在本机执行；env-a =
# hap-1+hap-2，env-b = hap-3。同机模式下每个控制台只展示本机节点。

services:
  # ---- 配置源：MySQL（表结构与演示种子数据见 deploy/mysql/init.sql）----
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: rl_limiter
      MYSQL_USER: rl
      MYSQL_PASSWORD: rl_pass
    volumes:
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    # 只在本机回环暴露 3306，方便宿主机直接用 mysql 客户端改配置。
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # TCP ping：初始化阶段的临时实例只监听 unix socket，ping 通 TCP
      # 即表示真实实例（含 init.sql 灌数）已就绪。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  # ---- HAProxy 后端：模拟业务 web 服务（每次请求返回随机大小响应）----
  web:
    build: .
    command: python3 tools/random_web.py --port 9000
    environment:
      # 响应体大小区间（字节）：默认 256 KiB ~ 2 MiB，可按需覆盖。
      WEB_MIN_BYTES: ${WEB_MIN_BYTES:-262144}
      WEB_MAX_BYTES: ${WEB_MAX_BYTES:-2097152}
      # /big 大文件下载端点的默认大小：512 MiB（40 Mbps 限速下约 100s
      # 下完），供长连接大文件场景（loadgen 的 big worker）使用。
      WEB_BIG_BYTES: ${WEB_BIG_BYTES:-536870912}
    restart: unless-stopped

  # ---- 三台节点：Ubuntu 24.04 + HAProxy 2.8(发行版自带) + 同机 rl-limiter。
  # 每个容器 = 生产上的一台 ECS。节点独占环境：node1/node2 只跑 env-a 的
  # fe_env_a（一环境横跨两节点），node3 只跑 env-b 的 fe_env_b。
  # stats socket 是容器内的 unix socket，不映射、也不需要跨容器可达。
  node1:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.node
    volumes:
      - ./deploy/docker/haproxy-env-a.cfg:/etc/rl-limiter/haproxy-template.cfg:ro
    environment:
      # 同机模式开关：本实例只采本机这台 HAProxy（配置在全量校验后被
      # 裁剪到该节点）。值必须与配置库 haproxy_nodes.name 一致。
      RL_NODE_NAME: hap-1
      RL_MYSQL_HOST: mysql
      RL_MYSQL_PORT: "3306"
      RL_MYSQL_USER: rl
      RL_MYSQL_PASSWORD: rl_pass
      RL_MYSQL_DB: rl_limiter
      RL_MYSQL_POLL_S: "3"
      RL_CONSOLE_PORT: "8090"
      # 演示需要从宿主机打开控制台，故绑 0.0.0.0；宿主机侧只映射到回环
      # （下方 ports）。生产默认是 127.0.0.1，控制台无鉴权，切勿裸奔。
      RL_CONSOLE_BIND: 0.0.0.0
      # 限额自动应用：库里改 quota_bps → 本机 rl-limiter 立刻改写这份
      # cfg 的 shared bwlim limit 并 reload（容器里没有 systemctl，
      # 用入口脚本落的 master pid 发 SIGUSR2）。
      RL_APPLY_HAPROXY_CFG: /etc/haproxy/haproxy.cfg
      RL_APPLY_RELOAD_CMD: kill -USR2 $$(cat /run/haproxy/master.pid)
    ports:
      - "8080:8080"              # hap-1 / fe_env_a（宿主机可 curl 体验限速）
      - "127.0.0.1:8090:8090"    # hap-1 的控制台
    depends_on:
      mysql:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  node2:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.node
    volumes:
      - ./deploy/docker/haproxy-env-a.cfg:/etc/rl-limiter/haproxy-template.cfg:ro
    environment:
      RL_NODE_NAME: hap-2
      RL_MYSQL_HOST: mysql
      RL_MYSQL_PORT: "3306"
      RL_MYSQL_USER: rl
      RL_MYSQL_PASSWORD: rl_pass
      RL_MYSQL_DB: rl_limiter
      RL_MYSQL_POLL_S: "3"
      RL_CONSOLE_PORT: "8090"
      RL_CONSOLE_BIND: 0.0.0.0
      # 限额自动应用：库里改 quota_bps → 本机 rl-limiter 立刻改写这份
      # cfg 的 shared bwlim limit 并 reload（容器里没有 systemctl，
      # 用入口脚本落的 master pid 发 SIGUSR2）。
      RL_APPLY_HAPROXY_CFG: /etc/haproxy/haproxy.cfg
      RL_APPLY_RELOAD_CMD: kill -USR2 $$(cat /run/haproxy/master.pid)
    ports:
      - "8082:8080"              # hap-2 / fe_env_a
      - "127.0.0.1:8092:8090"    # hap-2 的控制台
    depends_on:
      mysql:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  node3:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.node
    volumes:
      - ./deploy/docker/haproxy-env-b.cfg:/etc/rl-limiter/haproxy-template.cfg:ro
    environment:
      RL_NODE_NAME: hap-3
      RL_MYSQL_HOST: mysql
      RL_MYSQL_PORT: "3306"
      RL_MYSQL_USER: rl
      RL_MYSQL_PASSWORD: rl_pass
      RL_MYSQL_DB: rl_limiter
      RL_MYSQL_POLL_S: "3"
      RL_CONSOLE_PORT: "8090"
      RL_CONSOLE_BIND: 0.0.0.0
      # 限额自动应用：库里改 quota_bps → 本机 rl-limiter 立刻改写这份
      # cfg 的 shared bwlim limit 并 reload（容器里没有 systemctl，
      # 用入口脚本落的 master pid 发 SIGUSR2）。
      RL_APPLY_HAPROXY_CFG: /etc/haproxy/haproxy.cfg
      RL_APPLY_RELOAD_CMD: kill -USR2 $$(cat /run/haproxy/master.pid)
    ports:
      - "8083:8080"              # hap-3 / fe_env_b
      - "127.0.0.1:8093:8090"    # hap-3 的控制台
    depends_on:
      mysql:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # ---- 客户端群：可在线调节并发数的压测服务（模拟并发带宽）----
  loadgen:
    build: .
    # 三个入口（env-a×2 节点 + env-b×1 节点）：worker 轮转绑定入口，
    # 每台节点各自被本机 shared bwlim 压在自己的限额内、互不影响。
    command: >-
      python3 tools/loadgen.py
      --target http://node1:8080/,http://node2:8080/,http://node3:8080/
      --control-port 8081
    environment:
      # 初始并发：LOADGEN_CONCURRENCY=32 docker compose up -d 即可改；
      # 运行中用控制端口在线调节（见文件头速查）。
      LOADGEN_CONCURRENCY: ${LOADGEN_CONCURRENCY:-12}
      # 长连接大文件下载场景：每个入口 N 条长连接循环下载 /big（默认
      # 每入口 1 条）。验证 shared bwlim 对存量长连接的持续限速与限额
      # 调整（reload + hard-stop）对在途下载的影响。
      LOADGEN_BIG_PER_TARGET: ${LOADGEN_BIG_PER_TARGET:-1}
    ports:
      - "8084:8081"   # 控制端口（宿主机 8084）：GET /status、PUT /concurrency
    depends_on:
      - node1
      - node2
      - node3
    restart: unless-stopped

volumes:
  mysql-data:
