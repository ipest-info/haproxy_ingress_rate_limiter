# deploy/docker/haproxy.cfg —— docker compose 演示环境的真实 HAProxy 配置。
#
# 由 deploy/haproxy/bwlim-example.cfg 改出（整形机制的逐行注释见该文件），
# 差异只在 compose 拓扑的落地细节：
#   - stats socket 绑 0.0.0.0:9999：容器网络即"内网"，端口不映射到宿主机，
#     只有同一 compose 网络里的 rl-limiter 能触达（生产环境必须绑内网 IP
#     并用安全组收紧，见示例配置的安全须知）；
#   - backend 指向 compose 服务名 web，用 docker 内嵌 DNS（127.0.0.11）
#     动态解析，web 容器重建换 IP 也能自动跟上；
#   - map 文件挂载在 /etc/haproxy/maps/bwlim.map，路径必须与 MySQL
#     haproxy_nodes.bwlim_map_path 一致。

global
    # rl-limiter 的采样（show stat）与执行（set map）通道。
    stats socket ipv4@0.0.0.0:9999 level admin
    # 限制单连接内核缓冲，整形堆积连接时内存可预算（设计 §3.4）。
    tune.rcvbuf.server 65536
    tune.sndbuf.client 65536

defaults
    mode http
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# docker 内嵌 DNS：让 backend 的服务名解析跟随容器重建。
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry   1s
    hold valid      10s

# 环境 env-a 的入口（frontend 名 = map 键 = MySQL env_targets.frontend）。
frontend fe_env_a
    bind :8080
    maxconn 25000

    # 每流限速 × HTTP/2 多路复用会放大配额，整形入口禁用 h2 升级。
    option disable-h2-upgrade

    # 每流整形过滤器。注意 HAProxy 语义：per-stream bwlim 只有在某条
    # set-bandwidth-limit 动作对该流执行后才启用，default-limit 仅是
    # "动作未显式带 limit 参数时"的默认值，并不会自动兜住未启用的流。
    # 因此下方对 map 未命中（env_lim<=0）的流补了一条不带 limit 的动作，
    # 让异常流真正落到 1 MB/s 的保守安全网，而不是完全不限速。
    filter bwlim-out env-dyn default-limit 1048576 default-period 1s

    # 聚合整形值（bytes/s）← rl-limiter 拥有的 runtime map。
    http-response set-var(txn.env_lim) fe_name,map_str_int(/etc/haproxy/maps/bwlim.map,0)

    # 每流限速 = 聚合值 / 当前并发连接数（fe_conn ≥ 1 防御除零）。
    http-response set-var(txn.conns) fe_conn
    http-response set-var(txn.conns) int(1) if { var(txn.conns) -m int lt 1 }
    http-response set-var(txn.stream_lim) var(txn.env_lim),div(txn.conns)
    # map 命中：按查表值整形。
    http-response set-bandwidth-limit env-dyn limit var(txn.stream_lim) if { var(txn.env_lim) -m int gt 0 }
    # map 未命中：不带 limit 启用过滤器 → 该流按 default-limit（1 MB/s）兜底。
    http-response set-bandwidth-limit env-dyn if !{ var(txn.env_lim) -m int gt 0 }

    default_backend be_env_a

backend be_env_a
    # init-addr：启动时先用 libc 解析，解析不到也允许先起来（none），
    # 随后由 resolvers 在运行期补上——避免 compose 启动顺序引发的死锁。
    server web1 web:9000 resolvers docker init-addr libc,none check
