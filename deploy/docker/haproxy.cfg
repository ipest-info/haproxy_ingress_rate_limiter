# deploy/docker/haproxy.cfg —— docker compose 演示环境的真实 HAProxy 配置
# （TCP L4 负载均衡形态，与生产一致；compose 里两台 HAProxy 共用本文件）。
#
# 与 HTTP 模式示例（deploy/haproxy/bwlim-example.cfg）的机制完全相同——
# rl-limiter 写 bwlim map、bwlim-out 过滤器按"聚合值 / 当前连接数"做
# 每流整形——差异只在 L4 的落地方式：
#   - 用 listen 段（前后端合一的经典 L4 写法），mode tcp；
#   - 整形变量与动作改用 tcp-request content 规则：连接建立时执行一次，
#     该连接的限速值即定格。注意 L4 特有的语义：runtime map 更新只影响
#     **新连接**，存量长连接保持旧限速直至断开——AIMD 靠连接自然轮转
#     收敛，长连接业务需配合 tc 兜底（deploy/tc/backstop.sh）；
#   - 变量用 sess 作用域（TCP 无 HTTP 事务，txn 语义不适用）。
#
# stats socket 绑 0.0.0.0:9999：容器网络即"内网"，端口不映射宿主机，
# 仅 compose 网络内的 rl-limiter 可达（生产必须绑内网 IP 并用安全组收紧）。

global
    # rl-limiter 的采样（show stat）与执行（set map）通道。
    stats socket ipv4@0.0.0.0:9999 level admin
    # 限制单连接内核缓冲，整形堆积连接时内存可预算（设计 §3.4）。
    tune.rcvbuf.server 65536
    tune.sndbuf.client 65536

defaults
    mode tcp
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# docker 内嵌 DNS：让后端服务名解析跟随容器重建。
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry   1s
    hold valid      10s

# 环境 env-a 的入口（listen 名 = stats 的 pxname = map 键 = env_targets.frontend）。
listen fe_env_a
    bind :8080
    maxconn 25000

    # 每流整形过滤器。HAProxy 语义：per-stream bwlim 只有在某条
    # set-bandwidth-limit 动作对该流执行后才启用，default-limit 仅是
    # "动作未显式带 limit 参数时"的默认值。因此下方对 map 未命中
    # （env_lim<=0）的连接补了一条不带 limit 的动作，让异常流真正落到
    # 1 MB/s 的保守安全网，而不是完全不限速。
    filter bwlim-out env-dyn default-limit 1048576 default-period 1s

    # 连接建立时计算该连接的下行限速：聚合值（rl-limiter 维护的 map）
    # / 当前并发连接数（fe_conn ≥ 1 防御除零）。
    tcp-request content set-var(sess.env_lim) fe_name,map_str_int(/etc/haproxy/maps/bwlim.map,0)
    tcp-request content set-var(sess.conns) fe_conn
    tcp-request content set-var(sess.conns) int(1) if { var(sess.conns) -m int lt 1 }
    tcp-request content set-var(sess.stream_lim) var(sess.env_lim),div(sess.conns)
    # map 命中：按查表值整形。
    tcp-request content set-bandwidth-limit env-dyn limit var(sess.stream_lim) if { var(sess.env_lim) -m int gt 0 }
    # map 未命中：不带 limit 启用过滤器 → 该连接按 default-limit 兜底。
    tcp-request content set-bandwidth-limit env-dyn if !{ var(sess.env_lim) -m int gt 0 }

    # init-addr：启动时先用 libc 解析，解析不到也允许先起来（none），
    # 随后由 resolvers 在运行期补上——避免 compose 启动顺序死锁。
    server web1 web:9000 resolvers docker init-addr libc,none

# 环境 env-b 的入口：同一机制、独立 map 键（演示多环境隔离限速）。
listen fe_env_b
    bind :8081
    maxconn 25000
    filter bwlim-out env-dyn default-limit 1048576 default-period 1s
    tcp-request content set-var(sess.env_lim) fe_name,map_str_int(/etc/haproxy/maps/bwlim.map,0)
    tcp-request content set-var(sess.conns) fe_conn
    tcp-request content set-var(sess.conns) int(1) if { var(sess.conns) -m int lt 1 }
    tcp-request content set-var(sess.stream_lim) var(sess.env_lim),div(sess.conns)
    tcp-request content set-bandwidth-limit env-dyn limit var(sess.stream_lim) if { var(sess.env_lim) -m int gt 0 }
    tcp-request content set-bandwidth-limit env-dyn if !{ var(sess.env_lim) -m int gt 0 }
    server web1 web:9000 resolvers docker init-addr libc,none
