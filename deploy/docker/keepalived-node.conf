# deploy/docker/keepalived-node.conf —— demo 主备 director 的 keepalived
# 模板（主备共用一份；state/priority/网卡名由入口脚本按环境变量与本机
# 实际网卡替换占位符生成 /etc/keepalived/keepalived.conf）。
#
# 两个 VIP，一次 VRRP 漂移同时切换：
#   10.211.1.100  客户端侧 VIP（loadgen 打它）
#   10.211.2.100  后端侧 VIP（web 的默认网关——NAT 回程必须经当前主机）
#
# virtual_server 段（IPVS 表）**主备都下发**：keepalived 的 LVS 配置
# 不随 VRRP 状态走，备机表里同样有服务——这正是 rl-limiter 主备对称
# 的前提（备机受管清单一致、tc 规则常驻空转，VIP 漂移即生效）。

global_defs {
    # demo 容器里没有合法的发件环境，关掉一切通知。
    vrrp_garp_master_delay 1
    vrrp_garp_master_repeat 3
    enable_script_security
}

vrrp_instance RL_DEMO {
    state @STATE@
    interface @FRONT_IF@
    virtual_router_id 66
    priority @PRIORITY@
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass rl-demo
    }
    virtual_ipaddress {
        10.211.1.100/24 dev @FRONT_IF@
        10.211.2.100/24 dev @BACK_IF@
    }
}

virtual_server 10.211.1.100 8080 {
    delay_loop 5
    lb_algo rr
    lb_kind NAT
    protocol TCP

    real_server 10.211.2.20 9000 {
        weight 1
        TCP_CHECK {
            connect_timeout 2
            connect_port 9000
        }
    }
}
