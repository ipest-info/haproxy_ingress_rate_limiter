# deploy/docker/haproxy-env-a.cfg —— env-a 专属节点的 HAProxy 配置
# （TCP L4，**聚合限速** shared bwlim；compose 里 node1 与 node2 共用，
# 体现"一个环境横跨多台节点"）。节点是环境的独占资源：本节点只承载
# env-a 的 fe_env_a。机制详解见 deploy/haproxy/bwlim-example.cfg。
#
# 部署形态：rl-limiter 与 HAProxy 同机（同一个 Ubuntu 24.04 容器 =
# 生产上的同一台 ECS），因此 stats socket 用**本机 unix socket**，
# 完全不对网络开放。

global
    # 同机的 rl-limiter 通过它只读采样（level user 即够）。
    # mode 660：属主/属组可读写——生产上把 rl-limiter 的运行用户加进
    # haproxy 组即可，不需要 root。
    stats socket /run/haproxy/admin.sock mode 660 level user
    tune.rcvbuf.server 65536
    tune.sndbuf.client 65536
    # reload 后旧 worker 的宽限期：到期强制退出，其上的存量连接被断开、
    # 客户端重连进新 worker 拿到新限额。这是"调整限额对存量长连接生效"
    # 的代价与手段（演示环境取 15s，生产建议 30~60s）。
    hard-stop-after 15s

defaults
    mode tcp
    # 连续统计：默认字节计数在会话结束时才计入 frontend 统计，TCP 长
    # 连接会让 bout 长期不动、断连时一次性跳变——rl-limiter 的逐秒差分
    # 测速（以及 stats 页的速率）都依赖计数连续推进，必须开启。
    option contstats
    timeout connect 5s
    timeout client  60s
    timeout server  60s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry   1s
    hold valid      10s

listen fe_env_a
    bind :8080
    maxconn 25000
    # 聚合速率表：shared bwlim 用它累计本 frontend 的总下行速率，
    # bytes_out_rate 的统计周期（1s）即共享限速的周期。
    stick-table type string len 64 size 16 expire 1h store bytes_out_rate(1s)
    # 共享限速：本 frontend 所有连接（含存量）合计 ≤ limit 字节/周期。
    # 40 Mbps = 5_000_000 bytes/s。调整限额 = 原地改这里 + reload（HUP）。
    filter bwlim-out node-agg limit 5000000 key fe_name min-size 1460
    tcp-request content set-bandwidth-limit node-agg
    server web1 web:9000 resolvers docker init-addr libc,none
