# deploy/docker/haproxy-env-a.cfg —— env-a 专属节点的 HAProxy 配置
# （TCP L4；compose 里 haproxy1 与 haproxy2 共用，体现"一个环境横跨
# 多台节点"）。节点是环境的独占资源：本节点只承载 env-a 的 fe_env_a，
# 不与其它环境混挂——混挂会让节点级模式切换同时波及两个环境。
# 机制详解见 deploy/haproxy/bwlim-example.cfg。

global
    stats socket ipv4@0.0.0.0:9999 level admin
    tune.rcvbuf.server 65536
    tune.sndbuf.client 65536

defaults
    mode tcp
    # 连续统计：默认字节计数在会话结束时才计入 frontend 统计，TCP 长
    # 连接会让 bout 长期不动、断连时一次性跳变——rl-limiter 的逐秒差分
    # 测速（以及 stats 页的速率）都依赖计数连续推进，必须开启。
    option contstats
    timeout connect 5s
    timeout client  60s
    timeout server  60s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry   1s
    hold valid      10s

listen fe_env_a
    bind :8080
    maxconn 25000
    # per-stream bwlim 只在 set-bandwidth-limit 动作执行后才启用；
    # map 未命中（env_lim<=0）由下方反向守卫的动作兜到 default-limit。
    filter bwlim-out env-dyn default-limit 1048576 default-period 1s
    # 连接建立时定格该连接的下行限速 = 聚合值 / 当前并发连接数。
    tcp-request content set-var(sess.env_lim) fe_name,map_str_int(/etc/haproxy/maps/bwlim.map,0)
    tcp-request content set-var(sess.conns) fe_conn
    tcp-request content set-var(sess.conns) int(1) if { var(sess.conns) -m int lt 1 }
    tcp-request content set-var(sess.stream_lim) var(sess.env_lim),div(sess.conns)
    tcp-request content set-bandwidth-limit env-dyn limit var(sess.stream_lim) if { var(sess.env_lim) -m int gt 0 }
    tcp-request content set-bandwidth-limit env-dyn if !{ var(sess.env_lim) -m int gt 0 }
    server web1 web:9000 resolvers docker init-addr libc,none
