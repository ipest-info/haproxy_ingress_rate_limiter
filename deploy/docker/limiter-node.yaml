# deploy/docker/limiter-node.yaml —— compose 演示里每台节点的 rl-limiter
# 配置（入口脚本把它复制成容器内的 /etc/rl-limiter/config.yaml）。
#
# 负载均衡配置**不在这里**：监听端口/后端服务器写在 haproxy-base.cfg
# （容器内 /etc/haproxy/haproxy.cfg，唯一权威）。这份 YAML 只登记
# 接线与限额；字段说明见 deploy/config/limiter.example.yaml。

log_level: info
tick_interval_s: 1.0

haproxy:
  name: haproxy
  socket_path: /run/haproxy/admin.sock
  cfg_path: /etc/haproxy/haproxy.cfg
  timeout_ms: 500

# 限额登记：frontend 名（= cfg 里的段名）→ Mbps。改这里（容器内
# /etc/rl-limiter/config.yaml）一个轮询周期（5s）内热生效，tc 即时换挡，
# 不需要 reload HAProxy、更不需要重启。
quotas:
  fe_main: 40

# 请求方向（入向）限速：双网卡形态（demo 的 compose 已是双网络拓扑，
# 客户端侧网卡由入口脚本按 RL_FRONT_SUBNET 自动定位）。
#   mbps      入向带宽上限。下载型业务的入向主要是 GET 请求 + 回传 ACK
#             （ACK 流量约为下载带宽的 1/40~1/20），10 Mbps 对 40M 的
#             下载限额来说留足了余量，不会误伤 ACK；
#   conn_rate 每秒新建连接上限。demo 的压测是短连接（每请求一条新连接），
#             1000 并发 ÷ 3 节点 ≈ 每节点 200~300 conn/s 的供给——设 150
#             能明显看到 SYN 速率闸在工作（loadgen 错误/延迟上升）。
request_limits:
  fe_main:
    mbps: 10
    conn_rate: 150
