# deploy/docker/limiter-node.yaml —— compose 演示里每台节点的 rl-limiter
# 配置模板（入口脚本复制成容器内 /etc/rl-limiter/config.yaml）。
#
# 通用形态：没有任何服务接线。监控 = 双网卡设备视图 + 内核 TCP 计数器；
# 限速 = instance_quota_mbps（出向目标，网卡口径，闭环收紧入向执行）
# + 可选的按端口静态入向限速（ports + request_limits）。
# 字段说明见 deploy/config/limiter.example.yaml（带全量注释的生产示例）。

name: node
log_level: info

# 出向带宽目标（Mbps，网卡口径；0 = 不限）。演示从"不限"起步：页面
# "实例总限速"或改本文件（热生效）设一个值，看闭环把出向压回目标。
instance_quota_mbps: 0

# 端口登记（演示：业务进程 random_web 监听 8080）。
ports:
  web: 8080

# 按端口的静态入向限速（演示默认不限；要体验就给 web 设个 mbps）。
request_limits: {}

# 闭环参数（默认启用；整段热生效）。demo 用 5s 调节周期加快收敛演示；
# 生产保持默认 15s。
dynamic_ingress:
  enabled: true
  interval_s: 5
