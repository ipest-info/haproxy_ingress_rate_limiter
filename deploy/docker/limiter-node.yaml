# deploy/docker/limiter-node.yaml —— compose 演示里每台 LVS director 的
# rl-limiter 配置（入口脚本把它复制成容器内的 /etc/rl-limiter/config.yaml）。
#
# 受管清单**不在这里**：虚拟服务（VIP:端口）由 keepalived 下发进内核
# IPVS 表（唯一权威），rl-limiter 只读内核。这份 YAML 只登记接线与
# 限额；字段说明见 deploy/config/limiter.example.yaml。
#
# 主备两台用**同一份**本文件——这是主备对称设计的一部分（docs/11）。

log_level: info
tick_interval_s: 1.0

# lvs 接线段整段可省（全部默认值）；写出来是演示字段在哪。
lvs:
  name: lvs-demo

# 出向带宽限额：虚拟服务合成名 vs_<VIP>_<端口> → Mbps。
# **默认不登记 = 只监控**。demo 起来后用控制台（页头填 API 令牌
# demo-token）或写 API 登记，或直接改容器内 /etc/rl-limiter/config.yaml
# （解开下面示例行），一个轮询周期（5s）内热生效。
# NAT 模式双向都过 director：这里的限额由出向 HTB 直接执行（与
# HAProxy 基线同一套 tc 机制）。
quotas: {}
#   vs_10.211.1.100_8080: 40

# 实例总限速（可选，Mbps）：全部虚拟服务出向合计的总闸（tc 层级模式）。
# instance_quota_mbps: 90
