# deploy/docker/haproxy-base.cfg —— compose 演示里每台节点的 HAProxy
# **基础骨架**：只有 global 与 defaults，没有任何 listen/frontend。
#
# 监听端口、限速与后端服务器由 rl-limiter 从配置库渲染进本文件的
# **受管区块**（首次 reconcile 时自动追加到文件末尾）：
#
#     # >>> BEGIN rl-limiter managed >>>
#     listen fe_main
#         bind :8080
#         filter bwlim-out rl-limit limit 5000000 key fe_name min-size 5000
#         server web1 web:9000 weight 100 check inter 2000ms
#     # <<< END rl-limiter managed <<<
#
# 标记之外的内容（就是本文件现有的这些）rl-limiter 一个字节都不会碰——
# 运维手写的 global/TLS/ACL/日志配置照常放这里。
#
# ============================================================================
# 调优基线：32 核、TCP 代理、高并发 + 高带宽
# ============================================================================
#
# 下面每一项都在 HAProxy 2.8.16 上实测过，注释里带的是实测数字而不是经验
# 之谈。整体效果（限额 500 MB/s、16 并发、各测 3 次）：
#
#   | 配置        | 吞吐              | CPU（单核百分比）|
#   | ----------- | ----------------- | --------------- |
#   | 调优前      | 2917~3621 Mbps    | 75~91%          |
#   | 调优后      | 3988~3993 Mbps    | 38~41%          |
#
# 调优前连配置的限额都跑不满（只到 73%~90%），调优后稳定在 99.7%，CPU 还
# 少了一半。
#
# ---------------------------------------------------------------------------
# 先说一件最重要的事：**这套限速用不了内核 splice（零拷贝）**
# ---------------------------------------------------------------------------
#
# TCP 高带宽代理的头号优化通常是 `option splice-response`（数据在内核里
# 从一个 socket 直接搬到另一个，不进用户态）。但实测：**只要 frontend 上
# 挂了 bwlim 滤镜，HAProxy 就会完全关掉 splice**——
#
#   | 场景              | 出向字节  | 其中走 splice 的 |
#   | ----------------- | --------- | ---------------- |
#   | splice + 限速     | 74867160  | **0**            |
#   | splice + 不限速   | 131073235 | 131072000        |
#   | 不开 splice       | 131073225 | 0                |
#
# 道理也说得通：限速要按字节计量并延迟发送，数据必须经过用户态。而限速
# 正是本项目存在的理由，所以**不要**往这里加 splice 相关指令——加了不会
# 报错、也不会生效，只会让人误以为有一条零拷贝快路。
#
# 结论：本场景的高带宽只能优化用户态拷贝路径，也就是下面的 tune.bufsize
# 与受管区块里的 min-size（后者由 rl-limiter 按限额比例自动算，见
# enforcer 模块）。

global
    # 同机的 rl-limiter 通过它只读采样（level user 即够）。
    # mode 660：属主/属组可读写——生产上把 rl-limiter 的运行用户加进
    # haproxy 组即可，不需要 root；也完全不占网络端口。
    stats socket /run/haproxy/admin.sock mode 660 level user
    # reload 后旧 worker 的强停宽限期：限额/端口调整对**存量连接**生效
    # 的手段。演示取 15s 便于观察；生产建议 30~60s。
    hard-stop-after 15s

    # ---- 高并发 ----------------------------------------------------------
    # 进程级并发连接上限。
    #
    # **这一项配错会直接起不来**，而且报错信息不明显，务必看清楚：HAProxy
    # 需要的文件描述符数 = maxconn × 2 + 34（实测精确值：maxconn 2000 要
    # 4034 个，maxconn 100000 要 200034 个）。给不够就是
    #
    #     [ALERT] Cannot raise FD limit to 200034, limit is 4096.
    #
    # 然后拒绝启动。所以改这个值时**必须同步改部署层的 nofile 上限**：
    #   - docker compose：本项目已在 docker-compose.yml 给节点服务设了
    #     `ulimits.nofile: 262144`；
    #   - systemd：unit 里设 `LimitNOFILE=262144`；
    #   - 裸跑：`ulimit -n 262144`。
    #
    # 顺带一提，加 `no strict-limits` 能让它"警告后照常启动"，但实测它
    # **并不会把 maxconn 降下来**（仍报告 Maxconn: 100000 而 Ulimit-n 只有
    # 4096），等于把启动期的明确失败换成运行期的莫名其妙的 accept 失败。
    # 因此这里保持默认的 strict-limits（启动即失败、信息明确）。
    #
    # 内存开销（实测，TCP 代理、下行为主）：
    #   tune.bufsize 16384（默认）→ 约 20 KB/连接
    #   tune.bufsize 65536（本文件）→ 约 66 KB/连接
    # 也就是 maxconn 100000 配 64K 缓冲，满载约 6.6 GB。32 核的机器一般
    # 内存充足，若不是，按这个数等比下调 maxconn。
    maxconn 100000

    # nbthread 刻意**不写**：HAProxy 2.8 起不指定时自动等于可用 CPU 数，
    # 32 核机器上就是 32 线程（实测本机 4 核 → 自动 4 线程）。写死反而会在
    # 换机器或容器限核后失配。
    #
    # 按线程分片监听（每线程一个 SO_REUSEPORT 套接字），32 线程下能显著
    # 改善 accept 的扩展性。
    #
    # **这一项曾让人怀疑限速会被放大 N 倍**，实测澄清了：分片只影响连接
    # 怎么分到各线程，bwlim 的速率桶存在进程级的 stick-table 里，全部线程
    # 共用一个。16 条连接打同一个 100 Mbps 的 frontend，开/不开分片合计
    # 都是 99 Mbps 出头，没有翻倍。
    #
    #（测试时若读到"正好 2 倍限额"，几乎一定是上一个 haproxy 进程没退干净
    # ——SO_REUSEPORT 会让两个进程共享同一个端口，各自按限额整形。本项目
    # 已经被这个假象骗过两次，验证时请按 PID 确认旧进程真的退了。）
    tune.listener.default-shards by-thread

    # ---- 高带宽 ----------------------------------------------------------
    # 用户态转发缓冲区大小。既然 splice 用不了（见文件头），这就是本场景
    # 最有效的一项：缓冲区越大，同样的字节数需要的读写系统调用越少。
    #
    # 实测（限额 500 MB/s、单连接）：
    #   16384（默认） 3993 Mbps / CPU 53%
    #   32768         3972 Mbps / CPU 42%
    #   65536         3994 Mbps / CPU 39%   ← 取这个
    #   131072        3991 Mbps / CPU 40%   （不再有收益，只多耗内存）
    #
    # 代价是每连接内存翻三倍（20 KB → 66 KB），所以它和 maxconn 是一组
    # 权衡，改一个就要回头看另一个。
    tune.bufsize 65536

    # ---- 这里**特意不写**的东西 -------------------------------------------
    #
    # tune.rcvbuf.* / tune.sndbuf.*：本文件此前写死过
    # `tune.rcvbuf.server 65536` 和 `tune.sndbuf.client 65536`，实测是**负
    # 优化**——写死 socket 缓冲会关掉内核的自动调优（TCP 窗口无法随
    # 带宽时延积增长）：
    #
    #   | 配置              | 吞吐（限额 4000 Mbps）| CPU     |
    #   | ----------------- | --------------------- | ------- |
    #   | 写死 65536        | 3422~3991 Mbps        | 63~91%  |
    #   | 不写（内核自适应）| 3990~3992 Mbps        | 50~58%  |
    #
    # 不仅慢，还不稳定（有时跑不到限额）。除非有实测支撑的特殊场景，
    # 让内核自己调。
    #
    # cpu-map（绑核）：裸金属上能减少线程迁移与 cache 抖动，但**在容器里
    # 有害**。实测把进程限制在 CPU 2,3（模拟容器 cpuset）再配
    # `cpu-map auto:1/1-32 0-31`，HAProxy 会把线程钉到 CPU 0——一个不在
    # 允许集合里的核。因此默认注释掉；32 核裸金属独占部署时可以打开：
    #
    #     cpu-map auto:1/1-32 0-31

defaults
    # 本项目默认按 TCP 代理用（受管区块里每个 listen 也会各写一次 mode）。
    mode tcp
    # 连续统计。不开的话 TCP 长连接的 bytes_out 只在会话结束时跳变，
    # 逐秒差分出来的速率是"0 与巨大脉冲交替"，与网卡实际流量完全对不上，
    # 监控数据不可用。受管区块里每个 listen 段也会各写一次。
    option contstats
    # accept 队列。高并发下突发连接来得比 accept 快，队列短会直接被内核
    # 丢掉（表现为客户端偶发连接超时）。不写时默认取 maxconn，这里写出来
    # 是为了让它不随 maxconn 一起被改掉。
    backlog 65536
    # 下面三项只对**非受管**的 proxy 生效：受管区块里每个 listen 都会写
    # 自己的 timeout（值来自 Web 控制台/配置库），不受这里影响。
    timeout connect 5s
    timeout client  50s
    timeout server  50s

# compose 网络里用容器名访问后端（web）需要 DNS。
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 10s
