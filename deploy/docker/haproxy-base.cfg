# deploy/docker/haproxy-base.cfg —— compose 演示里每台节点的**完整**
# HAProxy 配置（入口脚本把它复制成容器内的 /etc/haproxy/haproxy.cfg）。
#
# **本文件就是负载均衡配置的唯一权威**：监听端口、模式、后端服务器都
# 直接写在下面的 listen 段里，改了它 reload HAProxy 即生效。rl-limiter
# **只读**这份 cfg（解析 frontend/listen 清单做监控与 tc 限速），一个
# 字节都不会改写——限速指令也不在这里，限额登记在 rl-limiter 的 YAML
# 配置（deploy/docker/limiter-node.yaml 的 quotas 段），由内核 tc 执行。
#
# 每项调优背后的实测数据见 docs/06-tc限速方案.md；本文件的注释只留结论。
#
# 调优基线：32 核、TCP 代理、高并发 + 高带宽。每一项都在 HAProxy 2.8.16
# 上实测过。

global
    # 同机的 rl-limiter 通过它只读采样（level user 即够）。
    # mode 660：属主/属组可读写——生产上把 rl-limiter 的运行用户加进
    # haproxy 组即可，不需要 root；也完全不占网络端口。
    stats socket /run/haproxy/admin.sock mode 660 level user
    # reload 后旧 worker 的强停宽限期。注意**限额调整不再依赖它**（tc 改
    # 限额不用 reload），它现在只影响改监听端口/后端服务器时的存量连接。
    hard-stop-after 15s

    # ---- 高并发 ----------------------------------------------------------
    # 进程级并发连接上限。默认按 **100 万连接** 给：这里的取值是"**默认不
    # 该成为限制**"，真要限并发请用 frontend 级的 maxconn 或限额，而不是
    # 靠这个进程级上限兜着。
    #
    # **配错会直接起不来**，务必连带看下面的 maxpipes：
    #
    #     FD 需求 = maxconn × 2 + maxpipes × 2 + 34 = 4000034
    #
    # 给不够就是 `[ALERT] Cannot raise FD limit to 4000034, limit is 4096.`
    # 然后拒绝启动。改这两个值时**必须同步改三处**：
    #   1. compose 的 `ulimits.nofile`（本项目已设 4194304）；systemd 上则是
    #      给 **haproxy 自己的** unit 设 `LimitNOFILE`，裸跑用 `ulimit -n`；
    #   2. 宿主机的 `fs.nr_open`（RLIMIT_NOFILE 的硬天花板，默认 1048576
    #      **压不住 400 万**）——它在容器里改不动，见 docs/08；
    #   3. 宿主机的 `net.netfilter.nf_conntrack_max`（容器部署时前后各一份
    #      连接都被跟踪，满了就静默丢包）。
    # 三处的目标值都在 deploy/sysctl/tune-kernel.sh 里，入口脚本会预检。
    #
    # 资源预算（满载才用得到，按需分配）：实测约 20 KB/连接，100 万连接
    # 约 20 GB；再加 fdtab 等固定开销。机器扛不住就往下调——**调小是有意
    # 识地设限，比默认值悄悄卡住你要好**。
    maxconn 1000000

    # 内核管道池上限。**高并发下最容易踩的坑**：splice 每条在传的连接借
    # 一个内核管道，默认只给 maxconn/4。同时在传的连接超过它就退回用户态
    # 拷贝——实测 600 并发下默认值让吞吐从 1995 掉到 1730 Mbps（连目标都
    # 跑不到），CPU 秒/GB 从 0.45 涨到 0.69。
    #
    # 带宽代理的连接绝大多数都在实打实传数据，所以取 maxpipes = maxconn，
    # 不留短板；代价就是上面那个 FD 公式。管道按需从池里取，不用就不占。
    #
    # 场景若以空闲 keep-alive 连接为主，可以调小它省 FD。**判断依据不要靠
    # 猜**：压测峰值时看 `show info` 的 TotalSplicedBytesOut/TotalBytesOut，
    # 明显低于 100% 就是池不够。100 万连接里同时在传的远没有 100 万条时，
    # 把它调到峰值并发的量级能省掉一半 FD。
    maxpipes 1000000

    # nbthread 刻意**不写**：2.8 起不指定时自动等于可用 CPU 数（32 核即
    # 32 线程）。写死会在换机器或容器限核后失配。
    #
    # 按线程分片监听（每线程一个 SO_REUSEPORT 套接字），改善高线程数下的
    # accept 扩展性。它不会让限速翻倍——限速在 tc 上，与 HAProxy 怎么把
    # 连接分派给线程无关。
    #
    #（压测时若读到"正好 2 倍限额"，几乎一定是上一个 haproxy 进程没退干净
    # ——SO_REUSEPORT 会让两个进程共享端口。按 PID 确认旧进程真的退了。）
    tune.listener.default-shards by-thread

    # ---- 这里**特意不写**的东西（都有实测依据，见 docs/06）---------------
    #
    # tune.bufsize：bwlim 时代是最有效的一项，但限速迁到 tc 后 splice 全程
    #   可用、数据不经过用户态缓冲，实测四次与默认值完全重叠，而每连接内存
    #   要从 20 KB 涨到 66 KB。买不到性能就不付这个内存。
    #   （例外：mode http 且响应体要被 HAProxy 处理时 splice 覆盖不全。）
    #
    # tune.rcvbuf.* / tune.sndbuf.*：写死会关掉内核的 socket 缓冲自动调优，
    #   实测是负优化——更慢（3422~3991 vs 3990~3992 Mbps）且不稳定。
    #
    # cpu-map：裸金属独占部署能减少线程迁移；**容器里有害**（实测 cpuset
    #   受限时会把线程钉到不被允许的核上）。32 核裸金属可以打开：
    #     cpu-map auto:1/1-32 0-31

defaults
    # 本项目默认按 TCP 代理用（受管区块里每个 listen 也会各写一次 mode）。
    mode tcp
    # 连续统计。不开的话 TCP 长连接的 bytes_out 只在会话结束时跳变，
    # 逐秒差分出来的速率是"0 与巨大脉冲交替"，监控数据不可用。
    option contstats
    # accept 队列。高并发下突发连接来得比 accept 快，队列短会被内核直接
    # 丢掉（表现为客户端偶发连接超时）。不写时默认取 maxconn，写出来是
    # 为了让它不随 maxconn 一起被改掉。
    backlog 65536
    # 下面三项只对**非受管**的 proxy 生效：受管区块里每个 listen 都会写
    # 自己的 timeout（值来自 Web 控制台/配置库）。
    timeout connect 5s
    timeout client  50s
    timeout server  50s

# compose 网络里用容器名访问后端（web）需要 DNS。
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 10s

# ---------------------------------------------------------------------------
# 业务监听端口。一个 frontend/listen 段 = 一个监控单位 = 一个 tc 速率类
# （限额在 rl-limiter 的 YAML quotas 段按段名登记；未登记的段只监控
# 不限速）。注意段名就是 stats 的 pxname，改名要连着 quotas 一起改。
#
# splice 三开关：数据面走内核零拷贝（限速在 tc 上，与 bwlim 不冲突——
# 这正是把限速搬去 tc 换来的）。
# ---------------------------------------------------------------------------
listen fe_main
    bind :8080
    mode tcp
    option splice-auto
    option splice-request
    option splice-response
    server web1 web:9000 check inter 2000ms resolvers docker init-addr none
