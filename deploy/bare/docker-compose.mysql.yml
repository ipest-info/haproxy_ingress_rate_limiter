# 裸机部署用的 MySQL 配置库——**只有数据库这一个服务**。
#
# 形态：HAProxy 与 rl-limiter 都直接跑在本机（不进容器），只有配置库
# 用 Docker 起。理由很简单：数据库跑容器没有副作用，而 HAProxy 与
# rl-limiter 都要摸本机的网卡（tc）、本机的 haproxy.cfg 和本机的 unix
# stats socket，进容器只会平添一层麻烦。
#
#   起：  docker compose -f deploy/bare/docker-compose.mysql.yml up -d
#   停：  docker compose -f deploy/bare/docker-compose.mysql.yml down
#   清库：docker compose -f deploy/bare/docker-compose.mysql.yml down -v
#         （-v 会删掉数据卷，下次启动重新执行 init.sql）
#
# 也可以直接用 `deploy/bare/rl-limiter.sh mysql-up` / `mysql-down`。
#
# 端口只绑在回环上：配置库里有各 frontend 的限额，没有任何理由暴露到
# 网外。rl-limiter 与它同机，走 127.0.0.1 即可。

name: rl-limiter-db

services:
  mysql:
    image: mysql:8.4
    container_name: rl-limiter-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${RL_MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${RL_MYSQL_DB:-rl_limiter}
      MYSQL_USER: ${RL_MYSQL_USER:-rl}
      MYSQL_PASSWORD: ${RL_MYSQL_PASSWORD:-rl_pass}
    volumes:
      # 首次启动（数据卷为空时）自动执行：建表 + 演示种子。
      # 已有数据卷时**不会**重跑，所以升级建表语句要手工执行。
      - ../mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    ports:
      # 只绑回环。rl-limiter 就在本机，不需要监听 0.0.0.0。
      - "127.0.0.1:${RL_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

volumes:
  mysql-data:
