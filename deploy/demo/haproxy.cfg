# hap-agg demo 节点的最小 haproxy.cfg：一个 TCP 入口转发到模拟后端，
# global 段暴露内网 TCP stats socket 给聚合器采样。
# level user 就够——hap-agg 只读；demo 绑 0.0.0.0 是因为容器网络本身
# 隔离，生产上请绑内网 IP 并用防火墙限制来源。
global
    stats socket ipv4@0.0.0.0:9999 level user
    maxconn 5000

defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    # 长连接的字节数按秒入账（不开的话曲线是会话结束时的脉冲）。
    option contstats

listen fe_main
    bind :8080
    server web web:9000 maxconn 5000
