# ---------------------------------------------------------------------------
# HAProxy 2.8 example: rl-limiter driven downstream bandwidth shaping
# (design §3.2) — TCP L4 load-balancer form (the production shape).
#
# Mechanism overview:
#   1. rl-limiter (remote) writes the per-frontend aggregate shaping value
#      (bytes/s) into the runtime map /etc/haproxy/maps/bwlim.map via the
#      stats socket:
#        set map /etc/haproxy/maps/bwlim.map fe_env_a 13750000
#      No reload is ever needed for a limit change.
#   2. When a connection is accepted, the tcp-request content rules look up
#      the proxy's aggregate value, divide it by the current connection
#      count (fe_conn), and apply the result as this connection's bwlim-out
#      limit. With N concurrent connections each gets aggregate/N, so the
#      sum approximates the aggregate cap.
#   3. L4-specific semantics (IMPORTANT): the limit is computed ONCE at
#      connection accept. Runtime map updates therefore only affect NEW
#      connections; existing long-lived connections keep their old limit
#      until they close. rl-limiter's AIMD loop (§3.3) converges through
#      natural connection turnover; for workloads dominated by very long
#      connections pair this with the tc backstop (deploy/tc/backstop.sh).
#
# Requires HAProxy >= 2.8 (bwlim is experimental in 2.7, official from 2.8).
#
# Line markers:
#   [LB]  load-bearing  - the mechanism breaks without this line
#   [IL]  illustrative  - placeholder value/topology, adapt per deployment
# ---------------------------------------------------------------------------

global
    # [LB] Admin 级 TCP stats socket（v2.0 集中部署）：分离部署的 rl-limiter
    # 通过它远程采样 `show stat` 并执行 `set map`。host:port 必须与
    # rl-limiter 配置中 haproxy_nodes[].host/port 一致。
    #
    # 安全须知（必读）：level admin 的 runtime API 等同于对 HAProxy 的完全
    # 控制权（可改 map、禁用 server、关闭 frontend 等）——
    #   1. 只允许绑定内网 IP（把下面的 <内网IP> 换成本机内网地址），
    #      绝不可绑 0.0.0.0 或任何公网地址；
    #   2. 安全组/防火墙必须收紧为仅放行限速服务器（rl-limiter 所在机器）
    #      的 IP 访问该端口。
    stats socket ipv4@<内网IP>:9999 level admin
    # 可同时保留一行本机 unix socket 用于应急运维：网络策略故障或排障时
    # 登录本机即可操作 runtime API，不依赖内网可达性。
    # stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    # [LB] Cap per-connection kernel buffers (§3.4): shaping increases the
    # number of in-flight connections; bounded buffers keep memory per
    # connection predictable (~ bufsize + rcvbuf + sndbuf).
    tune.rcvbuf.server 65536
    tune.sndbuf.client 65536

defaults
    # [LB] L4 balancing: pure TCP proxying, no HTTP parsing.
    mode tcp
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# One listen proxy per environment on this node (proxy name == stats pxname
# == map key; the controller ships the frontend -> env mapping to rl-limiter).
listen fe_env_a
    # [IL] Bind address/port per deployment.
    bind :8080
    # [IL] Resource-protection maxconn (§3.4): derived from ECS memory, NOT a
    # rate-limit knob. Example: 8 GB ECS, ~150 KB/conn -> ~25000.
    maxconn 25000

    # [LB] Per-stream (per-connection in TCP mode) shaping filter.
    # IMPORTANT HAProxy semantics: the per-stream bwlim filter is only
    # ENABLED on a stream when a set-bandwidth-limit action executes for
    # it; default-limit merely supplies the value when that action carries
    # no explicit limit — it does NOT implicitly cap streams the action
    # never ran on. That is why a second, inverse-guarded
    # set-bandwidth-limit (no limit argument) below catches map-miss
    # connections, putting them on this 1 MB/s conservative safety net
    # instead of leaving them unshaped.
    # NOTE: default-limit is PER-CONNECTION, not an aggregate cap.
    # default-period 1s makes limits read as bytes/s.
    filter bwlim-out env-dyn default-limit 1048576 default-period 1s

    # [LB] Computed once at connection accept (see header note 3).
    # Variables use the sess scope — TCP mode has no HTTP transaction.
    # Aggregate value for this proxy, from the rl-limiter-owned map
    # (map_str_int = string key match, integer output; a lookup miss
    # yields 0, which routes the connection to the fallback action below).
    tcp-request content set-var(sess.env_lim) fe_name,map_str_int(/etc/haproxy/maps/bwlim.map,0)

    # [LB] Concurrent-connection count with a >=1 guard. fe_conn counts the
    # current connection so it is >=1 in practice; the guard keeps the
    # division safe even if the sample ever returns 0.
    tcp-request content set-var(sess.conns) fe_conn
    tcp-request content set-var(sess.conns) int(1) if { var(sess.conns) -m int lt 1 }

    # [LB] Per-connection limit = aggregate / concurrent connections.
    tcp-request content set-var(sess.stream_lim) var(sess.env_lim),div(sess.conns)

    # [LB] Map hit: apply the computed limit to this connection.
    tcp-request content set-bandwidth-limit env-dyn limit var(sess.stream_lim) if { var(sess.env_lim) -m int gt 0 }

    # [LB] Map miss (aggregate <= 0): enable the filter with no explicit
    # limit so the connection falls back to default-limit. Without this
    # line map-miss connections would be completely unshaped.
    tcp-request content set-bandwidth-limit env-dyn if !{ var(sess.env_lim) -m int gt 0 }

    # [IL] Placeholder upstream (adapter). Shaping happens on the client
    # side of this proxy; backpressure propagates upstream automatically
    # (§3.4).
    server adapter1 127.0.0.1:9000

# ---------------------------------------------------------------------------
# Map file seed: /etc/haproxy/maps/bwlim.map
#
# The file must exist before HAProxy starts (it is loaded at parse time).
# Seed each proxy at 110% of its node quota in BYTES/s; rl-limiter OWNS the
# entries at runtime and rewrites them via `set map` every time its AIMD loop
# changes the target. Manual edits to the file are only picked up on reload
# and will be overwritten by rl-limiter's next runtime update.
#
# Example content (100 Mbps quota = 12,500,000 bytes/s; x1.10 elastic
# ceiling = 13,750,000):
#
#   fe_env_a 13750000
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# VARIANT: HTTP (L7) frontends
#
# The same mechanism works in mode http with http-response rules — the limit
# is then re-evaluated PER RESPONSE (map updates take effect on in-flight
# keep-alive connections too, at the next response), and h2 multiplexing
# must be disabled on shaped frontends (option disable-h2-upgrade; no
# "alpn h2" on TLS binds) because the per-stream limit multiplies per h2
# stream while fe_conn counts connections:
#
#   frontend fe_env_a
#       mode http
#       bind :8080
#       option disable-h2-upgrade
#       filter bwlim-out env-dyn default-limit 1048576 default-period 1s
#       http-response set-var(txn.env_lim) fe_name,map_str_int(/etc/haproxy/maps/bwlim.map,0)
#       http-response set-var(txn.conns) fe_conn
#       http-response set-var(txn.conns) int(1) if { var(txn.conns) -m int lt 1 }
#       http-response set-var(txn.stream_lim) var(txn.env_lim),div(txn.conns)
#       http-response set-bandwidth-limit env-dyn limit var(txn.stream_lim) if { var(txn.env_lim) -m int gt 0 }
#       http-response set-bandwidth-limit env-dyn if !{ var(txn.env_lim) -m int gt 0 }
#       default_backend be_env_a
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# ALTERNATIVE (not enabled): exact aggregate cap via shared stick-table bwlim
#
# The shared form gives a mathematically exact aggregate limit: every stream
# keyed by fe_name draws from ONE token bucket in the stick-table, so the sum
# across streams never exceeds the configured rate, regardless of connection
# count or per-stream skew.
#
# Tradeoff: in HAProxy 2.8 the shared bwlim limit is a static value in the
# configuration - it CANNOT be changed through the runtime API, so every
# quota/AIMD adjustment would require a config rewrite + reload. That defeats
# rl-limiter's per-second control loop, which is why the per-stream map-driven
# approach above is the default. Use this form only for quotas that change
# rarely (and pair the table with a `peers` section so the bucket survives
# reloads, §3.7).
#
# listen fe_env_a
#     bind :8080
#     # One shared bucket for the whole proxy: key is the constant fe_name.
#     stick-table type string len 64 size 16 expire 1h store bytes_out_rate(1s)
#     filter bwlim-out env-agg limit 13750000 key fe_name table fe_env_a
#     server adapter1 127.0.0.1:9000
# ---------------------------------------------------------------------------
