# ---------------------------------------------------------------------------
# HAProxy 2.8 示例：节点聚合限速（shared bwlim）+ rl-limiter 集中监控
# （设计 §3.2）—— TCP L4 负载均衡形态（生产形态）。
#
# 机制总览：
#   1. 限速由 HAProxy 自身的 **shared bwlim** 执行：本 frontend 的全部
#      连接（含存量长连接）从 stick-table 里同一个速率桶取额度，总和
#      永不超过配置的 limit——与连接数、单连接快慢、需求分布无关。
#   2. 限额是配置常量。调整限额 = 原地修改本文件的 limit 值 + reload
#      （systemctl reload haproxy / master-worker 收 SIGUSR2）。旧 worker
#      上的存量连接在 hard-stop-after 宽限期结束时被断开，客户端重连
#      即进入新限额；调整期间限速只会短暂偏向旧值，不会放开。
#   3. rl-limiter（**与 HAProxy 同机部署**，每台机器一个实例）通过本机
#      unix stats socket 每秒 `show stat` 采样 bytes_out，做本机带宽视图
#      与持续超限告警。
#   4. 启用限额自动应用（RL_APPLY_HAPROXY_CFG）后，rl-limiter 还会**原地
#      改写本文件里下面那行 `limit` 的数值**并 reload，让配置库里的限额
#      调整即时落到数据面。它只认受控 frontend 段里的
#      `filter bwlim-out ... limit <数字>` 这一行，只改那个数字，本文件
#      其余内容一律不动；reload 前必过 `haproxy -c`，失败自动回滚。
#      因此：**该行的 limit 数值由配置库托管，手改会在下一轮 reconcile
#      被拉回**（不想要这个行为就别设 RL_APPLY_HAPROXY_CFG）。
#
# 为什么不用 per-stream bwlim + runtime map（旧方案，已废弃）：
#   per-stream 限速值在建连时定格（每连接 = map值/当时并发），生产事故
#   实证了三个叠加缺陷——①存量连接永不跟随调整（调高限额不回升，只有
#   重启 HAProxy 才恢复）；②按连接数均分 vs 倾斜需求（空闲连接占分母不
#   占带宽，设 6G 实际只能跑 2G）；③限速→变慢→并发堆积→每连接额度更小
#   的正反馈锁死。shared bwlim 三个问题都不存在。
#
# 需要 HAProxy >= 2.8（bwlim 2.7 实验、2.8 起正式）。
#
# 行标记：
#   [LB] 承重行 —— 少了机制即失效
#   [IL] 示意行 —— 占位值/拓扑，按部署替换
# ---------------------------------------------------------------------------

global
    # [LB] 本机 unix stats socket：**同机部署**的 rl-limiter 通过它采样
    # `show stat`（只读监控）。路径必须与配置库 haproxy_nodes.socket_path
    # 一致（同机部署是推荐形态：rl-limiter 与 HAProxy 装在同一台 ECS 上，
    # 每台机器一个实例只采本机）。
    #
    # 安全须知：rl-limiter 只需要只读采样，level user 即够；mode 660 让
    # 访问权由文件属主/属组控制——把 rl-limiter 的运行用户加进 haproxy
    # 组即可，**不需要 root，也不占任何网络端口**。
    stats socket /run/haproxy/admin.sock mode 660 level user
    # 可另加一行 admin 级本机 socket 供应急运维（reload/排障）使用。
    # stats socket /run/haproxy/admin-ops.sock mode 600 level admin expose-fd listeners
    #
    # [替代形态] 跨机集中监控（一个 rl-limiter 采多台）：改用内网 TCP
    # socket，配置库填 host/port 而不是 socket_path。此时 stats socket
    # 暴露在网络上，只允许绑内网 IP（绝不可绑 0.0.0.0），并用安全组/
    # 防火墙仅放行监控服务器的 IP。同机形态没有这一层暴露面，优先选它。
    # stats socket ipv4@<内网IP>:9999 level user
    # [LB] reload 后旧 worker 的强停宽限期：到期旧 worker 退出，其上的
    # 存量连接被断开、客户端重连进新 worker 拿到新限额。没有它，长连接
    # 会把旧限额一直带到连接自然结束（限额调整对存量不生效）。
    # 取值 = 业务能接受的"调整限额后旧限额残留的最长时间"，30~60s 常见。
    hard-stop-after 60s
    # [LB] 收敛每连接内核缓冲（§3.4）：限速会抬高在途连接数，有界缓冲让
    # 单连接内存可预算（约 bufsize + rcvbuf + sndbuf）。
    tune.rcvbuf.server 65536
    tune.sndbuf.client 65536

defaults
    # [LB] L4 负载均衡：纯 TCP 转发，不解析 HTTP。
    mode tcp
    # [LB] rl-limiter 采样的前提。HAProxy 默认在会话结束时才把字节计入
    # frontend 统计——TCP 长连接会让 bytes_out 长期不动、断连时一次性
    # 跳变，逐秒差分测速（含 stats 页速率）全部失真；contstats 让计数
    # 随数据转发连续推进。
    option contstats
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# 本节点每个受控 frontend 一个 listen（代理名 == stats pxname；节点与
# frontend 的挂载关系登记在 rl-limiter 的 MySQL 配置库，节点限额以本
# 文件的 limit 为准，两边由发布流程保持一致）。
listen fe_env_a
    # [IL] 按部署替换绑定地址/端口。
    bind :8080
    # [IL] 资源保护 maxconn（§3.4）：按机器内存推导，不是限速旋钮。
    # 例：8 GB 内存、~150 KB/连接 → ~25000。
    maxconn 25000

    # [LB] 聚合速率表：shared bwlim 用它累计本 frontend 的总下行速率。
    # bytes_out_rate 的统计周期（1s）即共享限速的周期（limit 按 字节/s
    # 解读）。key 是常量 fe_name，全 frontend 共用一个桶。
    stick-table type string len 64 size 16 expire 1h store bytes_out_rate(1s)

    # [LB] 共享限速：所有连接合计 ≤ limit 字节/周期。
    # [IL] 示例 100 Mbps = 12_500_000 bytes/s，按节点约定带宽替换。
    # min-size：单次转发的最小放行块，取 MSS（1460）避免小包饿死。
    filter bwlim-out node-agg limit 12500000 key fe_name min-size 1460

    # [LB] 为每条连接启用共享限速（shared 模式动作不带 limit 参数——
    # 限额在上面的 filter 行；漏掉这行则连接完全不受限）。
    tcp-request content set-bandwidth-limit node-agg

    # [IL] 占位上游（adapter）。整形发生在本代理的客户端方向；背压自动
    # 向上游传导（§3.4）。
    server adapter1 127.0.0.1:9000

# ---------------------------------------------------------------------------
# 限额调整 SOP（低频运维动作，来源以 MySQL 配置库的 quota_bps 为准）：
#   1. 改库（控制台或 SQL）：更新该节点 quota_bps —— rl-limiter 的监控
#      基准与超限告警立即跟随；
#   2. 原地修改本文件对应 listen 的 limit（注意：必须原地写、不可先删后
#      建 —— 配置管理工具默认行为通常没问题；容器单文件挂载场景换 inode
#      会导致容器内看不到新内容）；
#   3. reload：systemctl reload haproxy（或对 master 进程发 SIGUSR2）。
#      新连接立即按新限额；存量连接最迟在 hard-stop-after 宽限期结束时
#      断开重连并进入新限额。
# rl-limiter 若发现节点实测持续超过库中 quota_bps，会打持续超限告警——
# 通常意味着第 2/3 步没有执行或配置漂移。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 可选附层：单连接防独占上限（per-stream bwlim 的合理用法）
#
# shared bwlim 限的是总量，不阻止单条连接吃满整个节点限额。若需要"单
# 连接最多占 X"，叠加一个 per-stream 过滤器（同一代理可挂多个 bwlim）：
#
#   filter bwlim-out per-conn default-limit 2500000 default-period 1s
#   tcp-request content set-bandwidth-limit per-conn
#
# default-limit 是静态的每连接上限（示例 20 Mbps），不参与动态调整。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# HTTP（L7）形态：机制相同——shared bwlim 与 stick-table 的写法在
# mode http 下一字不差（动作可用 tcp-request content 或 http-request）。
# 注意 h2：多路复用下多个 stream 共享一条连接，shared 模式按字节总量
# 限速不受影响，可正常使用。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# L4 + 整形的半关闭警示（实测结论，与限速模式无关）：服务端先发 FIN 会
# 与整形器持有的未发字节竞争，客户端可能收到截断的响应。经整形入口的
# 流量应使用 keep-alive / 客户端侧关连接。
# ---------------------------------------------------------------------------
