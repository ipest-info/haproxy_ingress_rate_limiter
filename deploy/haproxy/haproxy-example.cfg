# ---------------------------------------------------------------------------
# HAProxy 2.8 生产骨架示例：TCP L4 负载均衡 + 同机 rl-limiter。
#
# **限速不在这个文件里**。限额由 rl-limiter 下发到内核 tc（HTB），按源
# 端口把每个 frontend 的出向流量分到自己的速率类。原理、实测依据与部署
# 前提见 docs/06-tc限速方案.md。本文件只负责 HAProxy 那一半：
#
#   1. 转发与负载均衡（受管区块由 rl-limiter 渲染，见下方）；
#   2. 本机 unix stats socket，供同机的 rl-limiter 每秒采样 bytes_out
#      做带宽视图与超限告警；
#   3. 高并发/高带宽的 global 调优基线。
#
# 需要 HAProxy >= 2.8（受管区块用的 option splice-* 与监控依赖的 stats
# 列都以 2.8 为准；Ubuntu 24.04 自带 2.8.16）。
#
# 行标记：[LB] 承重行 —— 少了机制即失效
# ---------------------------------------------------------------------------

global
    # [LB] 本机 unix stats socket：**同机部署**的 rl-limiter 通过它采样
    # `show stat`（只读监控）。路径必须与配置库
    # haproxy_instances.socket_path 一致。
    #
    # 安全须知：rl-limiter 只需要只读采样，level user 即够；mode 660 让
    # 访问权由文件属主/属组控制——把 rl-limiter 的运行用户加进 haproxy
    # 组即可，**不需要 root，也不占任何网络端口**。
    stats socket /run/haproxy/admin.sock mode 660 level user
    # 可另加一行 admin 级本机 socket 供应急运维（reload/排障）使用。
    # stats socket /run/haproxy/admin-ops.sock mode 600 level admin expose-fd listeners
    #
    # [替代形态] 远程只读观测：改用内网 TCP socket，配置库填 host/port
    # 而不是 socket_path。此时 stats socket 暴露在网络上，只允许绑内网 IP
    # （绝不可绑 0.0.0.0）并用安全组限制来源；且**无法下发配置**——
    # 改 cfg + reload 必须在本机做。同机形态没有这些限制，优先选它。
    # stats socket ipv4@<内网IP>:9999 level user
    #
    # reload 后旧 worker 的强停宽限期。**限额调整不依赖它**（tc 改限额
    # 不用 reload，存量连接立刻跟上）；它只影响改监听端口/后端服务器时
    # 存量连接被断开重连的最长等待。30~60s 常见。
    hard-stop-after 60s

    # ---- 高并发 / 高带宽（32 核 TCP 代理基线）--------------------------
    # 每项的实测依据见 docs/06-tc限速方案.md 与 deploy/docker/haproxy-base.cfg，
    # 这里只留结论。
    #
    # **改 maxconn/maxpipes 必须同步放开 FD 上限**：
    #     FD 需求 = maxconn × 2 + maxpipes × 2 + 34 = 400034
    # 给不够会拒绝启动。systemd 上给 **haproxy 自己的** unit 写
    # LimitNOFILE=524288（systemctl edit haproxy），不是 rl-limiter 的。
    # 内存预算：约 20 KB/连接，10 万连接约 2 GB。
    maxconn 100000
    # splice 每条在传的连接借一个内核管道，默认只有 maxconn/4。同时在传的
    # 连接超过它就退回用户态拷贝——实测 600 并发下默认值让吞吐掉 13%、
    # CPU 涨 53%。带宽代理的连接基本都在传数据，故取 maxconn。
    maxpipes 100000
    # nbthread 不写：2.8 起自动等于可用 CPU 数（32 核即 32 线程）。
    # 每线程一个 SO_REUSEPORT 监听套接字，改善高线程数下的 accept 扩展性。
    tune.listener.default-shards by-thread
    #
    # 特意不写：tune.bufsize（splice 全程可用时无收益，却让每连接内存涨
    # 3 倍）、tune.rcvbuf.*/tune.sndbuf.*（关掉内核自动调优，实测负优化）、
    # cpu-map（容器里会把线程钉到 cpuset 之外的核；裸金属独占可开
    # `cpu-map auto:1/1-32 0-31`）。

defaults
    # [LB] L4 负载均衡：纯 TCP 转发，不解析 HTTP。
    mode tcp
    # [LB] rl-limiter 采样的前提。HAProxy 默认在会话结束时才把字节计入
    # frontend 统计——TCP 长连接会让 bytes_out 长期不动、断连时一次性
    # 跳变，逐秒差分测速（含 stats 页速率）全部失真；contstats 让计数
    # 随数据转发连续推进。
    option contstats
    timeout connect 5s
    timeout client  60s
    timeout server  60s


# ---------------------------------------------------------------------------
# 下面这段**不需要手写**：监听端口与后端服务器由 rl-limiter 从配置库渲染
# 进本文件末尾的受管区块（首次 reconcile 时自动追加），形如：
#
#   # >>> BEGIN rl-limiter managed >>>
#   listen fe_main
#       bind :8080
#       mode tcp
#       maxconn 2000
#       balance roundrobin
#       timeout connect 5000ms
#       timeout client 50000ms
#       timeout server 50000ms
#       option contstats
#       option splice-auto
#       option splice-request
#       option splice-response
#       server web1 10.0.0.21:9000 weight 100 check inter 2000ms
#   # <<< END rl-limiter managed <<<
#
# 区块里**没有任何限速指令**——限额在 tc 上。开着 splice 正是把限速搬去
# tc 换来的：挂着 bwlim 滤镜时 HAProxy 会完全关闭 splice。
#
# 标记之外的内容（global/defaults/你手写的其它 backend）rl-limiter 一个
# 字节都不会碰。要改监听端口/限额/后端，用 Web 控制台或直接改配置库。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# 配置调整 SOP：**只有一步——改配置库（或在 Web 控制台上点）**。
#
#   改限额     → rl-limiter 执行 tc class change，**不 reload**，
#                存量连接立刻按新限额跑；
#   改端口/后端 → 渲染受管区块 → `haproxy -c` 校验 → 原子替换 → reload，
#                存量连接最迟在 hard-stop-after 宽限期结束时断开重连。
#
# 检查限速有没有真的生效：`python3 tools/tc_check.py verify`。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# L4 + 整形的半关闭警示（实测结论）：服务端先发 FIN 会与整形器持有的未发
# 字节竞争，客户端可能收到截断的响应。经整形入口的流量应使用 keep-alive /
# 客户端侧关连接。
# ---------------------------------------------------------------------------
