# ---------------------------------------------------------------------------
# HAProxy 2.8 生产示例：TCP L4 负载均衡 + 同机 rl-limiter。
#
# **本文件（你的 haproxy.cfg）是负载均衡配置的唯一权威**：监听端口、
# 模式、后端服务器都由运维直接写在这里，改完 systemctl reload haproxy。
# rl-limiter 只**读**这份 cfg（解析 frontend/listen 段名与监听端口），
# 与它自己 YAML 配置里 quotas 登记的限额合并后做两件事——把限额下发到
# 内核 tc（HTB，按监听端口分类，真实限速），以及秒级带宽监控与持续超限
# 告警。**限速不在这个文件里**，原理与实测依据见 docs/06-tc限速方案.md。
#
# 本文件要提供的三样东西：
#   1. 转发与负载均衡（下方的 listen 段，直接手写）；
#   2. 本机 unix stats socket，供同机的 rl-limiter 每秒采样 bytes_out；
#   3. 高并发/高带宽的 global 调优基线。
#
# 需要 HAProxy >= 2.8（splice 与监控依赖的 stats 列都以 2.8 为准；
# Ubuntu 24.04 自带 2.8.16）。
#
# 行标记：[LB] 承重行 —— 少了机制即失效
# ---------------------------------------------------------------------------

global
    # [LB] 本机 unix stats socket：**同机部署**的 rl-limiter 通过它采样
    # `show stat`（只读监控）。路径必须与 rl-limiter YAML 配置里
    # haproxy.socket_path 一致。
    #
    # 安全须知：rl-limiter 只需要只读采样，level user 即够；mode 660 让
    # 访问权由文件属主/属组控制——把 rl-limiter 的运行用户加进 haproxy
    # 组即可，**不需要 root，也不占任何网络端口**。
    stats socket /run/haproxy/admin.sock mode 660 level user
    # 可另加一行 admin 级本机 socket 供应急运维（reload/排障）使用。
    # stats socket /run/haproxy/admin-ops.sock mode 600 level admin expose-fd listeners
    #
    # [替代形态] 远程只读观测：改用内网 TCP socket，YAML 里填 host/port
    # 而不是 socket_path。此时 stats socket 暴露在网络上，只允许绑内网 IP
    # （绝不可绑 0.0.0.0）并用安全组限制来源；且这种形态下 rl-limiter
    # 不在本机，**无法做 tc 限速**，一般只用于纯监控。同机形态优先。
    # stats socket ipv4@<内网IP>:9999 level user
    #
    # reload 后旧 worker 的强停宽限期。**限额调整不依赖它**（tc 改限额
    # 不用 reload，存量连接立刻跟上）；它只影响改监听端口/后端服务器时
    # 存量连接被断开重连的最长等待。30~60s 常见。
    hard-stop-after 60s

    # ---- 高并发 / 高带宽（32 核 TCP 代理基线）--------------------------
    # 每项的实测依据见 docs/06-tc限速方案.md 与 deploy/docker/haproxy-base.cfg，
    # 这里只留结论。
    #
    # **改 maxconn/maxpipes 必须同步放开 FD 上限**：
    #     FD 需求 = maxconn × 2 + maxpipes × 2 + 34 = 4000034
    # 给不够会拒绝启动。systemd 上给 **haproxy 自己的** unit 写
    # LimitNOFILE=4194304（systemctl edit haproxy），不是 rl-limiter 的。
    # 还要在宿主机把 fs.nr_open 抬到 4194304（默认 1048576 压不住），
    # 见 deploy/sysctl/tune-kernel.sh。
    # 内存预算：约 20 KB/连接，10 万连接约 2 GB。
    maxconn 1000000
    # splice 每条在传的连接借一个内核管道，默认只有 maxconn/4。同时在传的
    # 连接超过它就退回用户态拷贝——实测 600 并发下默认值让吞吐掉 13%、
    # CPU 涨 53%。带宽代理的连接基本都在传数据，故取 maxconn。
    maxpipes 100000
    # nbthread 不写：2.8 起自动等于可用 CPU 数（32 核即 32 线程）。
    # 每线程一个 SO_REUSEPORT 监听套接字，改善高线程数下的 accept 扩展性。
    tune.listener.default-shards by-thread
    #
    # 特意不写：tune.bufsize（splice 全程可用时无收益，却让每连接内存涨
    # 3 倍）、tune.rcvbuf.*/tune.sndbuf.*（关掉内核自动调优，实测负优化）、
    # cpu-map（容器里会把线程钉到 cpuset 之外的核；裸金属独占可开
    # `cpu-map auto:1/1-32 0-31`）。

defaults
    # [LB] L4 负载均衡：纯 TCP 转发，不解析 HTTP。
    mode tcp
    # [LB] rl-limiter 采样的前提。HAProxy 默认在会话结束时才把字节计入
    # frontend 统计——TCP 长连接会让 bytes_out 长期不动、断连时一次性
    # 跳变，逐秒差分测速（含 stats 页速率）全部失真；contstats 让计数
    # 随数据转发连续推进。
    option contstats
    timeout connect 5s
    timeout client  60s
    timeout server  60s


# ---------------------------------------------------------------------------
# 业务监听端口：**直接手写**。一个 frontend/listen 段 = 一个监控单位 =
# 一个 tc 速率类。要点：
#   - 段名（fe_main）就是 stats 的 pxname，也是 rl-limiter YAML 里 quotas
#     的键——三处必须一致，改名要一起改；
#   - 一个段只放**一个** bind 端口（tc 按端口分类；多 bind 段只有第一条
#     的端口被限速，rl-limiter 会告警）；
#   - 段里**没有任何限速指令**——限额在 tc 上。开着 splice 正是把限速
#     搬去 tc 换来的：挂着 bwlim 滤镜时 HAProxy 会完全关闭 splice；
#   - 未在 quotas 登记的段照常被监控，只是不限速（启动时 warn 一次）。
# ---------------------------------------------------------------------------

listen fe_main
    bind :8080
    mode tcp
    option splice-auto
    option splice-request
    option splice-response
    balance roundrobin
    server web1 10.0.0.21:9000 weight 100 check inter 2000ms
    server web2 10.0.0.22:9000 weight 100 check inter 2000ms

# ---------------------------------------------------------------------------
# 配置调整 SOP（都是普通文件编辑，没有别的入口）：
#
#   改限额     → 改 /etc/rl-limiter/config.yaml 的 quotas 段。rl-limiter
#                轮询到内容变化（5s 内）即执行 tc class change——**不
#                reload**，存量连接立刻按新限额跑；
#   改端口/后端 → 改本文件 → systemctl reload haproxy。rl-limiter 轮询到
#                cfg 内容变化后自动更新监控清单与 tc 分类；存量连接最迟
#                在 hard-stop-after 宽限期结束时断开重连。
#
# 检查限速有没有真的生效：`python3 tools/tc_check.py verify`。
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# L4 + 整形的半关闭警示（实测结论）：服务端先发 FIN 会与整形器持有的未发
# 字节竞争，客户端可能收到截断的响应。经整形入口的流量应使用 keep-alive /
# 客户端侧关连接。
# ---------------------------------------------------------------------------
