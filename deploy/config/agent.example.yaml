# rl-agent 本地配置示例（安装到 /etc/rl-agent/config.yaml）
# 单位约定：quota_bps 为 bit/s（运维口径，200000000 = 200 Mbps），
# Agent 内部统一换算为 bytes/s。

node_id: lb-01                # 节点唯一标识，需与控制面 LB_NODE 记录一致
mode: dry-run                 # dry-run = 只打日志不写 map；enforce = 真实下发限速
log_level: info               # debug | info | warn | error

haproxy:
  # HAProxy 管理 socket，必须为 level admin（采集 show stat + 执行 set map）
  stats_socket: /var/run/haproxy/admin.sock
  # bwlim map 文件路径，需与 haproxy 配置中 map_str_int(...) 的路径一致
  bwlim_map_path: /etc/haproxy/maps/bwlim.map
  # 单次 runtime API 调用超时（毫秒）
  timeout_ms: 500

controller:
  # 控制面地址；留空则进入 standalone 模式，只用下方 envs 的本地配额
  base_url: http://127.0.0.1:9090
  # fail-static 配置缓存：断联时按最后一次下发的配置继续限速（设计 §3.7）
  cache_path: /var/lib/rl-agent/config-cache.json
  tls:
    ca_file: ""               # mTLS CA 证书路径（可选，生产必配）
    cert_file: ""             # mTLS 客户端证书路径（可选）
    key_file: ""              # mTLS 客户端私钥路径（可选）

# standalone / 首启引导配额；控制面下发配置后以下发为准
envs:
  - env_id: env-a             # 环境 ID
    frontends:                # 该环境在本节点上的 HAProxy frontend 名称列表
      - fe_env_a
    quota_bps: 200000000      # 约定带宽（bit/s），200 Mbps
    # params:                 # 可选：按环境覆盖快环参数（设计 §3.3，缺省用默认值）
    #   elastic_ceiling: 1.10 # 弹性上限系数：bwlim 常态 = 配额 × 该值
    #   low_watermark: 0.90   # 恢复水位：均值低于 配额×该值 才开始放松
    #   tighten_after_s: 3    # 均值超配额持续秒数 → 触发收紧
    #   recover_after_s: 5    # 均值低于水位持续秒数 → 触发放松
    #   md_factor: 0.9        # 乘性收紧系数
    #   tighten_floor: 0.95   # 收紧下限：不低于 配额 × 该值
    #   ai_step_frac: 0.05    # 加性放松步长（每秒，配额的比例）
