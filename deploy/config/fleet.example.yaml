# rl-fleet（总控制台）配置示例。放到 /etc/rl-limiter/fleet.yaml，
# rl-fleet -c 指定路径启动。
#
# 总控做什么：轮询各节点 rl-limiter 的控制台 API 汇总流量 → 周期把
# total_egress_mbps 按需切成各节点的实例出向目标（instance_quota_mbps）
# → 经节点写 API 下发；节点自己的闭环再把出向目标转成入向限速。
# 节点侧**零改动**：只要每台节点开了控制台（RL_CONSOLE_PORT，绑内网
# 可达地址）并配置了写 API 令牌（RL_API_TOKEN）。
#
# 本文件被运行期轮询（5s）：total_egress_mbps、nodes、allocation、
# offline_after 改了即热生效；log_level 与各周期字段启动时定型，改了
# 要重启 rl-fleet。总控的写 API（页面改总带宽、节点管理）只改写
# total_egress_mbps 与 nodes 两处，但回写会重写整份文件、手写注释不保留。

log_level: info

# 总流出带宽目标（Mbps）：全部节点出向带宽合计要被压到的值。
# 0 = 纯观察模式：只汇总展示，不向任何节点下发。
total_egress_mbps: 1000

# 节点轮询周期（秒）。页面实时性与几十台节点请求开销的平衡，默认 2。
poll_interval_s: 2

# 分配周期（秒，≥10）。观测口径是节点的 10s 均值，且节点内环要几十秒
# 才能消化一次目标变更——分配得更快只会追噪声、和节点闭环打架。
alloc_interval_s: 15

# 单节点 HTTP 超时（秒）。一台慢/死节点绝不拖累其余节点的观测。
node_timeout_s: 3

# 连续失败多少次判离线。离线节点配额被冻结（绝不乱动），其份额如实
# 从可分池里扣掉；恢复在线自动纳回。
offline_after: 3

# 按需动态分配的参数（整段热生效；通常用默认值即可）。
allocation:
  # 保底池占比：每个可控节点保底 = min_share_ratio × 可分池 / 节点数。
  # 防饿死——零流量节点也留得住承接新流量的最小额度。
  min_share_ratio: 0.2
  # 需求信号的 EWMA 平滑系数（每个分配周期更新一次）。
  smooth_alpha: 0.3
  # 出向 ≥ press_ratio×自身配额 视为"被配额压着"（有未表达的需求），
  # 需求按 配额×press_boost 虚报——给上冲空间，防"配额小→观测小→分得
  # 更小"的饿死锁定，逐轮迭代自然收敛。
  press_ratio: 0.9
  press_boost: 1.3
  # 需求低于该值（Mbps）视为空闲；全体空闲时均分可分池。
  idle_mbps: 1.0
  # 写抑制：与节点现值相比，相对变化 < apply_epsilon 且绝对变化 <
  # min_delta_mbps 的分配不下发（节点每次写都整份重写自己的 YAML）。
  apply_epsilon: 0.05
  min_delta_mbps: 1.0
  # 单节点分配下限（Mbps）。绝不下发 ≤0：0 在节点语义里是"不限"。
  min_quota_mbps: 0.5

# 节点清单：**在总控页面「节点管理」里添加/编辑/删除**（页头填总控令牌
# 后操作，写回本文件热生效），也可以直接编辑本段（同样热生效）。
# 出厂为空清单，装好总控后逐台登记。每项的写法：
#
#   - name: node-sh-01
#     # 节点控制台地址（总控轮询与下发都走它）：节点侧需要
#     # RL_CONSOLE_BIND 绑到总控可达的内网地址，并用防火墙/安全组
#     # 限制只有总控能访问（节点读接口无鉴权）。
#     url: http://10.0.1.11:8090
#     # 节点写 API 的令牌 = 该节点的 RL_API_TOKEN（装节点时
#     # install.sh --token 指定的那个）。空 = 该节点只读观测
#     # （汇总里看得到，但不参与分配、不被下发）。
#     token: <该节点的 RL_API_TOKEN>
#     # 页面"跳到该节点控制台"的链接；内外网地址不同时填，缺省 = url。
#     console_url: ""
nodes: []
