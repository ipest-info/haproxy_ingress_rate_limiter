# rl-limiter 本地 YAML 配置示例（standalone/开发用；安装到
# /etc/rl-limiter/config.yaml）。生产推荐用 MySQL 配置库（设置
# RL_MYSQL_HOST 即启用，见 docs/03 §2.1），两种来源走同一套校验管线。
#
# 架构要点：限速由各节点 HAProxy 的 shared bwlim（聚合限速，配置常量
# + reload 调整）执行；rl-limiter 是分离部署的集中监控服务——通过内网
# TCP 采样多台 HAProxy 的下行带宽，对照这里登记的节点限额做持续超限
# 告警。envs 是业务环境分组（纯分组，仅供聚合查看），挂载点
# (节点, frontend) 声明 frontend 归属。
#
# 单位约定：quota_bps 一律为 bit/s（运维口径，40000000 = 40 Mbps），
# 服务内部统一换算为 bytes/s（唯一换算点在 model.EnvQuota）。

log_level: info                 # debug | info | warning | error
tick_interval_s: 1.0            # 采样节拍（秒）；1 秒是设计基准，一般无需改动

# 受控 HAProxy 节点清单。接线字段（host/port/timeout）重启生效；
# quota_bps（登记限额）在 MySQL 模式下可热更。
# 每台节点需在 haproxy.cfg 的 global 段开启内网 TCP stats socket：
#   stats socket ipv4@<内网IP>:9999 level user
# （rl-limiter 只做只读采样，user 级即够；端口只绑内网并用安全组/
# 防火墙限制仅本服务所在机器可达，见 deploy/haproxy/bwlim-example.cfg）
haproxy_nodes:
  - name: hap-1                 # 节点名：envs[].targets[].node 引用它，必须全局唯一
    host: 10.0.0.11             # 该节点的内网地址
    port: 9999                  # TCP stats socket 端口
    quota_bps: 40000000         # 登记限额（bit/s），40 Mbps；被挂载的节点必填。
                                # 应与该节点 haproxy.cfg 里 shared bwlim 的
                                # limit（bytes/s，此例 5000000）保持一致；
                                # 实测持续超过该值会触发持续超限告警
    timeout_ms: 500             # 单次 runtime API 命令超时（连接 + 读写，毫秒）
  - name: hap-2
    host: 10.0.0.12
    port: 9999
    quota_bps: 40000000

# 业务环境分组（纯分组）：环境不携带限额——限额登记在上方节点上。
# 约束：节点是环境的独占资源（一个环境可横跨多台节点，一台节点只允许
# 服务一个环境）；每个环境至少一个挂载点。
envs:
  - env_id: env-a               # 环境 ID（控制台聚合视图按它汇总成员节点）
    targets:                    # 挂载点：节点 × 该节点上的 frontend 名（stats 的 pxname 列）
      - node: hap-1
        frontend: fe_env_a
      - node: hap-2
        frontend: fe_env_a
