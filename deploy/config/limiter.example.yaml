# rl-limiter YAML 配置示例（LVS 形态；安装到 /etc/rl-limiter/config.yaml）。
#
# 架构要点：一个 rl-limiter 实例管**一台**与它同机的 LVS（IPVS）
# director（NAT/FULLNAT 模式）。**内核 IPVS 实况表是受管清单的唯一
# 权威**——虚拟服务（VIP:端口）由 keepalived / ipvsadm 维护；
# rl-limiter 只**读**内核（/proc/net/ip_vs + ipvsadm --stats），把
# 清单与下面 quotas 登记的限额合并后：
#   - 把限额下发到本机网卡的内核 tc（HTB，按虚拟服务端口分类）；
#   - 每秒采样各虚拟服务的带宽，做持续超限告警。
#
# 这份 YAML 因此只有四类内容：
#   1. lvs 段——接线（可整段省略，字段都有默认值）；
#   2. quotas 段——限额登记（虚拟服务合成名 vs_<VIP>_<端口> → Mbps）；
#   3. instance_quota_mbps——可选的实例总限速；
#   4. 运行参数（log_level、tick_interval_s）。
#
# 热更新：运行期轮询本文件与内核 IPVS 表（默认 5s），quotas/
# instance_quota_mbps 或虚拟服务增删即热生效。lvs 接线段与 log_level
# 启动时定型，改了需重启本服务。
#
# 主备（keepalived VRRP）：两台 director 都装 rl-limiter、用同一份
# 本文件。keepalived 的 virtual_server 在主备都进内核表，所以备机的
# 受管清单与主机一致、tc 规则常驻空转，VIP 漂移即生效（docs/11）。
#
# 除了直接编辑本文件，限额（quotas / instance_quota_mbps）也可以经控制台页面
# 或带鉴权的写 API 修改（需设 RL_API_TOKEN，见 docs/07）——那条路最终
# 也是回写到这份文件（**手写注释会丢**，YAML 数据往返的限制）。
#
# 单位约定：**限额一律用 Mbps**（40 = 40 Mbps，允许小数），服务内部统一
# 换算为 bytes/s（唯一换算点在 model.FrontendConfig）。

log_level: info                 # debug | info | warn | error
tick_interval_s: 1.0            # 采样节拍（秒）；只支持 1.0，见校验说明

# ---------------------------------------------------------------------------
# 本机 LVS（IPVS）接线。重启生效。全部字段可省略（整段不写也行）：
# 采样与受管清单都来自内核，没有 socket/配置文件路径要配，唯一外部
# 依赖是 ipvsadm 可执行文件（读 --stats 的按服务字节数用）。
# ---------------------------------------------------------------------------
lvs:
  name: lvs-director-1          # 展示名（日志/控制台）
  # ipvsadm_path: /usr/sbin/ipvsadm   # 默认 PATH 查找
  # timeout_ms: 500                   # 单次 ipvsadm 子进程超时

# ---------------------------------------------------------------------------
# 限额登记：虚拟服务合成名 vs_<VIP>_<端口>（内核表里每个 VIP:端口
# 自动对应一个）→ 限额（Mbps，≥ 0）。
#
#   - 表里有、这里登记了正限额 → 限速（tc）+ 监控 + 超限告警；
#   - 表里有、这里没登记 → **只监控不限速**（启动时会 warn 一次）；
#   - 表里有、这里**显式写 0** → 同样不限速，但不再 warn——这是
#     "运维确认过不限速"的正规写法；
#   - 这里登记、表里没有 → 该条目被忽略并 warn（服务被删或名字拼错）。
#
# v1 边界：多个 VIP 共用同一端口时 tc 无法按源端口区分，只有名序第一
# 个服务参与限速、其余只监控（启动 error 点名，见 docs/11）。
# ---------------------------------------------------------------------------
quotas:
  vs_10.0.0.1_8080: 40          # 40 Mbps
  vs_10.0.0.1_8443: 8           # 8 Mbps

# ---------------------------------------------------------------------------
# 实例总限速（可选，Mbps）：本机 HAProxy 全部 frontend 出向流量合计的
# 总闸。
#
# 设置后 tc 切换为**层级模式**：所有 frontend（含未在 quotas 里登记、
# 只监控的段）合计不超过它，各 frontend 自己的限额仍各自生效（单端口
# 上限 = min(自身限额, 总限速)）；SSH/监控等系统流量**不在**总闸内、
# 不受影响。各端口限额合计超过总限速时，超卖部分按比例分担带宽（HTB
# 的保证值缩放，见 docs/02 §5）。
#
# 不写或写 0 = 不限（平铺模式，只按端口各限各的）。
# ---------------------------------------------------------------------------
# instance_quota_mbps: 800

# ---------------------------------------------------------------------------
# 请求方向限速（可选，**双网卡形态**）：客户端侧网卡入向的 tc police。
#
#   mbps       入向带宽上限（Mbps；0 = 不限带宽）——限客户端上行/请求体；
#   conn_rate  每秒新建连接（SYN）上限（0 = 不限）——tc 能表达的最接近
#              "请求速率"的口径（L4 数不出 HTTP 请求）。
#
# 配了本段就必须设 RL_TC_IN_IFACE=<客户端侧网卡>（不自动探测，放错网卡
# 会误伤后端流量），否则启动失败。与 quotas（响应方向）相互独立。
# 详见 docs/02-闭环限速原理.md。
# ---------------------------------------------------------------------------
# request_limits:
#   fe_main:
#     mbps: 10
#     conn_rate: 200

# ---------------------------------------------------------------------------
# 入向动态限速（可选，闭环；需要 request_limits + quotas 同时登记）。
#
# 开启后出向推荐不做 tc 整形（RL_TC_IFACE=-）：quotas 的数字变成出向
# 带宽**目标**，控制器按实测出向带宽（10s 均值）平缓调整入向 police
# 上限（request_limits.mbps 是上限/封顶），把出向间接压在目标内——
# 响应路径零排队，对客户端比出向 HTB 更温和。算法与字段语义见
# rl_limiter/ingressgov.py 的模块注释。本段启动时定型，改了需重启。
#
# 各字段默认值（通常不用改）：
#   interval_s: 15        调节周期（≥5；观测窗口是 10s，别调得比它快）
#   low_ratio: 0.85       死区下界（×目标）：低于它才上调
#   high_ratio: 1.0       死区上界（×目标）：高于它才下调
#   step_up: 0.05         单次上调步长（×当前值，乘性；绝对下限 0.1Mbps。
#                         锚当前值而不是上限：动态值常收敛在上限的几十
#                         分之一刻度，锚上限的步子在那里是巨步，会造成
#                         上冲→猛降的振荡）
#   step_down_max: 0.10   单次下调封顶（×当前值，乘性）
#   floor_ratio: 0.10     动态值下限（×上限）
#   apply_epsilon: 0.02   变化低于该比例不下发（省得反复重建 tc 规则）
# ---------------------------------------------------------------------------
# dynamic_ingress:
#   enabled: true
