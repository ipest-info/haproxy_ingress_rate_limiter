# rl-limiter YAML 配置示例（安装到 /etc/rl-limiter/config.yaml，-c 指定）。
#
# 架构要点（单 HAProxy 模型）：一个 rl-limiter 实例管**一台**与它同机的
# HAProxy。**haproxy.cfg 是负载均衡配置的唯一权威**——监听端口、模式、
# 后端服务器由运维直接写在 cfg 里并自行 reload；rl-limiter 只**读** cfg
# （cfg_path），解析出 frontend/listen 清单，与下面 quotas 登记的限额
# 合并后：
#   - 把限额下发到本机网卡的内核 tc（HTB，按监听端口分类）——真实限速；
#   - 每秒经 stats socket 采样各 frontend 的带宽，做持续超限告警。
#
# 这份 YAML 的全部内容（**可改的配置都显式写在下面**，直接改本文件即可）：
#   1. haproxy 段——本机 HAProxy 的接线（stats socket + cfg 路径）；
#   2. quotas 段——限额登记（frontend 名 → Mbps）【热生效】；
#   3. instance_quota_mbps——实例总限速【热生效】；
#   4. request_limits——请求方向（入向）静态登记【热生效】；
#   5. dynamic_ingress——闭环控制器参数【热生效】；
#   6. 运行参数（log_level、tick_interval_s）【重启生效】。
#
# 热更新：运行期轮询本文件与 haproxy.cfg 的内容（默认 5s，页面/写 API 改
# 完会立即触发一轮）。quotas / instance_quota_mbps / request_limits /
# dynamic_ingress 以及 cfg 内容变化即热生效（改 cfg 后记得 reload HAProxy；
# rl-limiter 会自动跟上）。**启动时定型（改了需重启）的只有**：haproxy
# 接线段、log_level、tick_interval_s，以及所有 RL_* 环境变量（网卡接线、
# 控制台端口等，在 rl-limiter.env 里）。
#
# 除了直接编辑本文件，限额（quotas / instance_quota_mbps）也可以经控制台页面
# 或带鉴权的写 API 修改（需设 RL_API_TOKEN，见 docs/07）——那条路最终
# 也是回写到这份文件（**手写注释会丢**，YAML 数据往返的限制）。
#
# 单位约定：**限额一律用 Mbps**（40 = 40 Mbps，允许小数），服务内部统一
# 换算为 bytes/s（唯一换算点在 model.FrontendConfig）。

log_level: info                 # debug | info | warn | error【重启生效】
tick_interval_s: 1.0            # 采样节拍（秒）；只支持 1.0【重启生效】

# ---------------------------------------------------------------------------
# 本机 HAProxy 的接线。重启生效。
#
# 采样通道二选一（校验强制恰好给一种）：
#   - socket_path（**同机部署，推荐**）：本机 unix stats socket 绝对路径。
#     haproxy.cfg 的 global 段需有：
#       stats socket /var/lib/haproxy/stats mode 660 level user
#     不占任何网络端口，访问权由文件属主/属组控制。
#   - host + port（远程只读观测）：内网 TCP stats socket。
#       stats socket ipv4@<内网IP>:9999 level user
#     注意这种形态下 rl-limiter 不在 HAProxy 本机，**无法做 tc 限速**
#     （tc 作用在本机网卡上），一般只用于纯监控。
#
# cfg_path 必填：受管 frontend 清单（监听端口、模式）从这份 cfg 解析。
# 采样还要求 cfg 的 defaults 段带 `option contstats`——否则长连接的字节
# 数只在会话结束时一次性入账，秒级带宽曲线会脉冲式跳变。
# ---------------------------------------------------------------------------
haproxy:
  name: haproxy                 # 实例名（日志/控制台展示用）
  socket_path: /var/lib/haproxy/stats
  cfg_path: /etc/haproxy/haproxy.cfg
  timeout_ms: 500               # 单次 runtime API 命令超时（连接 + 读写）
  # 远程观测形态改用（与 socket_path 二选一，不可混填）：
  # host: 10.0.0.11
  # port: 9999

# ---------------------------------------------------------------------------
# 限额登记：frontend 名（= haproxy.cfg 里 frontend/listen 段的名字）→
# 限额（Mbps，≥ 0）。
#
#   - cfg 里有、这里登记了正限额 → 限速（tc）+ 监控 + 超限告警；
#   - cfg 里有、这里没登记 → **只监控不限速**（启动时会 warn 一次）；
#   - cfg 里有、这里**显式写 0** → 同样不限速，但不再 warn——这是
#     "运维确认过不限速"的正规写法（临时解除限速且保留登记行）；
#   - 这里登记、cfg 里没有 → 该条目被忽略并 warn（段被删了或名字拼错）。
# ---------------------------------------------------------------------------
quotas:
  fe_main: 40                   # 40 Mbps
  fe_api: 8                     # 8 Mbps

# ---------------------------------------------------------------------------
# 实例总限速（可选，Mbps）：本机 HAProxy 全部 frontend 出向流量合计的
# 总闸。
#
# 设置后 tc 切换为**层级模式**：所有 frontend（含未在 quotas 里登记、
# 只监控的段）合计不超过它，各 frontend 自己的限额仍各自生效（单端口
# 上限 = min(自身限额, 总限速)）；SSH/监控等系统流量**不在**总闸内、
# 不受影响。各端口限额合计超过总限速时，超卖部分按比例分担带宽（HTB
# 的保证值缩放，见 docs/02 §5）。
#
# 0 = 不限（平铺模式，只按端口各限各的）。改本行热生效，页面"实例总
# 限速"输入框与此等价（页面改的也回写到这里）。
# ---------------------------------------------------------------------------
instance_quota_mbps: 0

# ---------------------------------------------------------------------------
# 请求方向限速（可选，**双网卡形态**）：客户端侧网卡入向的 tc police。
#
#   mbps       入向带宽上限（Mbps；0 = 不限带宽）——限客户端上行/请求体；
#   conn_rate  每秒新建连接（SYN）上限（0 = 不限）——tc 能表达的最接近
#              "请求速率"的口径（L4 数不出 HTTP 请求）。
#
# 入向执行网卡默认 eth0（rl-limiter.env 的 RL_TC_IN_IFACE，不自动探测，
# 放错网卡会误伤后端流量）。与 quotas（响应方向）相互独立；闭环开着时
# 这里的 mbps 是动态调节的上限/封顶。改本段热生效，页面"入向限速登记"
# 与此等价。详见 docs/02-闭环限速原理.md。
#
# 默认空表 = 不做静态入向登记（闭环仍可工作：上限退化为出向目标值）。
# 登记示例：
#   fe_main:
#     mbps: 10
#     conn_rate: 200
# ---------------------------------------------------------------------------
request_limits: {}

# ---------------------------------------------------------------------------
# 入向动态限速（闭环）——出厂形态（出向不整形 RL_TC_IFACE=- + 入向执行
# 网卡 eth0）下限速的**唯一执行者**。
#
# **整段热生效**：直接改下面的值，保存后 5 秒内生效，无需重启。enabled
# 由 true 改 false 的那一刻，动态入向上限/总闸即时清除、回到静态登记值
# （不会冻结在半路）；改回 true 下一个调节周期重新开始收敛。
#
# quotas 的数字是出向带宽**目标**，控制器按实测出向带宽（10s 均值）
# 平缓调整入向上限（request_limits.mbps 是上限/封顶，不登记时退化为
# 目标值本身），把出向间接压在目标内——响应路径零排队，对客户端比
# 出向 HTB 更温和。算法与字段语义见 rl_limiter/ingressgov.py 的模块
# 注释。
#
# 不要闭环的形态显式关：基线出向 HTB（RL_TC_IFACE=<网卡>）或纯监控
# 写 enabled: false；入向没接线（RL_TC_IN_IFACE=-）时控制器自然不跑，
# 不用改这里。下面写的就是各字段默认值，通常只动 enabled。
# ---------------------------------------------------------------------------
dynamic_ingress:
  enabled: true          # 闭环开关。false = 限额只登记不执行（会告警）
  interval_s: 15         # 调节周期（秒）。观测窗口是 10s，别调得比它快
  low_ratio: 0.85        # 死区下界（×目标）：观测低于它才上调
  high_ratio: 1.0        # 死区上界（×目标）：观测高于它才下调
  step_up: 0.05          # 单次上调步长（×当前值，乘性；绝对下限
                         # 0.1Mbps）。锚当前值而不是上限：动态值常收敛
                         # 在上限的几十分之一刻度，锚上限的步子在那里
                         # 是巨步，会造成上冲→猛降的振荡，别改回去
  step_down_max: 0.10    # 单次下调封顶（×当前值，乘性）
  floor_ratio: 0.10      # 动态值下限（×上限；总闸落位后锚落位值）
  apply_epsilon: 0.02    # 变化低于该比例不下发（省得反复重建 tc 规则；
                         # 封顶回上限的最后一步不受它拦截）
