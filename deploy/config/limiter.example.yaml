# rl-limiter YAML 配置示例（安装到 /etc/rl-limiter/config.yaml，-c 指定）。
#
# 本形态是**通用服务器限速与监控**：不依赖机器上跑的任何服务（nginx /
# HAProxy / 自研 TCP 服务……一概不关心）：
#   - 监控：双网卡设备视图（/proc/net/dev：带宽/包/丢包，出厂接线
#     eth0 客户侧 / eth1 后端侧）+ 内核 TCP 计数器（/proc/net/snmp：
#     并发连接、每秒新建连接，整机口径）；
#   - 限速：instance_quota_mbps 是**出向带宽目标（网卡口径）**，由闭环
#     动态收紧客户端侧网卡（RL_TC_IN_IFACE，默认 eth0）的入向带宽间接
#     执行；另可按端口登记静态入向限速（ports + request_limits，纯 tc）。
#
# 热更新：运行期轮询本文件（5s，页面/写 API 改完立即触发）。
# instance_quota_mbps / ports / request_limits / dynamic_ingress 变化即
# 热生效；启动定型（改了需重启）的只有 name、log_level、tick_interval_s
# 与 RL_* 环境变量（网卡接线、控制台端口等，在 rl-limiter.env 里）。
#
# 单位约定：**限额一律用 Mbps**（40 = 40 Mbps，允许小数）。

name: server                    # 实例名（页面/日志展示）【重启生效】
log_level: info                 # debug | info | warn | error【重启生效】
tick_interval_s: 1.0            # 采样节拍（秒）；只支持 1.0【重启生效】

# ---------------------------------------------------------------------------
# 实例总限速（Mbps）：本机出向带宽目标，**网卡口径**（客户端侧网卡的
# 流出字节，与按量计费同口径）。闭环按它动态收紧入向：请求进得慢 →
# 响应自然出得少。0 = 不限（只监控）。改本行热生效，页面"实例总限速"
# 输入框与此等价。
# ---------------------------------------------------------------------------
instance_quota_mbps: 0

# ---------------------------------------------------------------------------
# 端口登记（可选）：名字 → 本机监听端口。只为下面的 request_limits
# 服务（tc 按端口分类需要端口号），与机器上跑什么服务无关；整机监控
# 与总量限速不需要登记任何端口。改本段热生效。
#
# 登记示例：
#   web: 8080
#   api: 8443
# ---------------------------------------------------------------------------
ports: {}

# ---------------------------------------------------------------------------
# 按端口的静态入向限速（可选）：ports 里的名字 → 限额。纯 tc 执行：
#   mbps       入向带宽上限（Mbps；0 = 不限带宽）——限客户端上行；
#   conn_rate  每秒新建连接（SYN）上限（0 = 不限）。
# 改本段热生效，页面"入向限速登记"与此等价。
#
# 登记示例（名字必须先在 ports 里登记）：
#   web:
#     mbps: 10
#     conn_rate: 200
# ---------------------------------------------------------------------------
request_limits: {}

# ---------------------------------------------------------------------------
# 入向动态限速（闭环）——**默认已启用**，它是本形态限速的唯一执行者：
# 按实测出向带宽（客户端侧网卡，10s 均值）对照 instance_quota_mbps
# 目标，平缓调整入向总闸。**整段热生效**：enabled 改 false 的瞬间动态
# 值清除、回到静态登记值；改回 true 下一个调节周期重新收敛。
# 下面写的就是各字段默认值，通常只动 enabled。
# ---------------------------------------------------------------------------
dynamic_ingress:
  enabled: true          # 闭环开关。false = 限额只登记不执行（会告警）
  interval_s: 15         # 调节周期（秒）。观测窗口是 10s，别调得比它快
  low_ratio: 0.85        # 死区下界（×目标）：观测低于它才上调
  high_ratio: 1.0        # 死区上界（×目标）：观测高于它才下调
  step_up: 0.05          # 单次上调步长（×当前值，乘性；绝对下限
                         # 0.1Mbps）。锚当前值而不是上限：动态值常收敛
                         # 在上限的几十分之一刻度，锚上限的步子在那里
                         # 是巨步，会造成上冲→猛降的振荡，别改回去
  step_down_max: 0.10    # 单次下调封顶（×当前值，乘性）
  floor_ratio: 0.10      # 动态值下限（×上限；总闸落位后锚落位值）
  apply_epsilon: 0.02    # 变化低于该比例不下发（省得反复重建 tc 规则；
                         # 封顶回上限的最后一步不受它拦截）
